<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda — Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:16px; box-sizing:border-box; }
    .login-box { width:100%; max-width:360px; background:var(--bg2); border:1px solid var(--border); border-radius:16px; padding:32px 28px; }
    .login-title { font-size:22px; font-weight:800; color:var(--text); margin-bottom:4px; }
    .login-sub { font-size:13px; color:var(--text-muted); margin-bottom:28px; }
    .form-group { display:flex; flex-direction:column; gap:4px; margin-bottom:16px; }
    .form-group label { font-size:10px; font-weight:700; letter-spacing:.6px; color:var(--text-muted); }
    .form-group input { background:var(--bg3); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:14px; padding:10px 12px; outline:none; width:100%; box-sizing:border-box; }
    .login-btn { width:100%; background:#6495ed; color:#fff; border:none; border-radius:10px; padding:12px; font-size:14px; font-weight:700; cursor:pointer; margin-top:8px; }
    .login-err { color:#ef4444; font-size:12px; margin-top:8px; min-height:16px; }
    .agenda-icon { font-size:36px; margin-bottom:16px; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="agenda-icon">📅</div>
    <div class="login-title">Agenda Nickel</div>
    <div class="login-sub">Entre com suas credenciais para acessar a agenda.</div>
    <form id="login-form">
      <div class="form-group">
        <label>USUÁRIO</label>
        <input id="username" type="text" autocomplete="username" autocapitalize="none">
      </div>
      <div class="form-group">
        <label>SENHA</label>
        <input id="password" type="password" autocomplete="current-password">
      </div>
      <div class="login-err" id="login-err"></div>
      <button class="login-btn" type="submit">Entrar</button>
    </form>
  </div>
  <script type="module" src="agenda.js"></script>
</body>
</html>
