<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Agenda Nickel</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 40px;
      box-sizing: border-box;
    }
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 32px;
    }
    .logo-icon { font-size: 48px; line-height: 1; }
    .logo-title { font-size: 24px; font-weight: 800; color: var(--text); letter-spacing: -.5px; }
    .logo-sub { font-size: 13px; color: var(--text-muted); }
    .names-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .8px;
      color: var(--text-muted);
      text-transform: uppercase;
      align-self: flex-start;
      margin-bottom: 10px;
      width: 100%;
      max-width: 400px;
    }
    .names-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 400px;
    }
    .name-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      text-align: left;
      width: 100%;
    }
    .name-btn:active { background: var(--bg3); border-color: #6495ed; }
    .name-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(100,149,237,0.15);
      color: #6495ed;
      font-size: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .name-avatar.gestor {
      background: rgba(249,115,22,0.15);
      color: #f97316;
    }
    .name-info { flex: 1; }
    .name-full { font-size: 15px; font-weight: 700; color: var(--text); }
    .name-role { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .name-arrow { font-size: 18px; color: var(--text-muted); }
    #loading-names { color: var(--text-muted); font-size: 13px; padding: 20px 0; }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <div class="logo-icon">📅</div>
    <div class="logo-title">Agenda Nickel</div>
    <div class="logo-sub">Selecione seu nome para entrar</div>
  </div>

  <div class="names-label">QUEM É VOCÊ?</div>
  <div class="names-grid" id="names-grid">
    <div id="loading-names">Carregando...</div>
  </div>

  <script type="module" src="agenda.js?v=188"></script>
</body>
</html>
