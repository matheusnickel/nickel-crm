<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carteira">
<title>Carteira Nickel</title>
<meta property="og:title" content="Carteira Nickel">
<meta property="og:description" content="Quem procura o quê, onde.">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050b1a; --sheet:#0b1530; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15);
  --text:#f4f6fb; --text2:#c6d0e6; --muted:#8d9bbb; --faint:#66759a;
  --or:#ff5a1f; --or2:#ff8a3d; --orbg:rgba(255,90,31,.12); --orline:rgba(255,122,61,.5);
  --ok:#3ddc97; --warn:#ffc65c; --red:#ff6b78;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{min-height:100vh;background:var(--bg);color:var(--text);font:15px/1.45 'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(800px 420px at 100% -5%,rgba(255,90,31,.13),transparent 60%),radial-gradient(700px 520px at -10% 105%,rgba(40,90,220,.14),transparent 60%);background-attachment:fixed}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.muted{color:var(--muted)}
em,.grad{font-style:normal;background:linear-gradient(90deg,var(--or),var(--or2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lbl{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:9px}
.lbl .hint{text-transform:none;letter-spacing:0;font-family:'Geist',sans-serif;font-weight:500;color:var(--faint);margin-left:6px}
.kick{font-family:'Geist Mono',ui-monospace,monospace;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--or2);font-weight:600}

/* topo */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:calc(var(--sat) + 12px) 20px 12px;background:rgba(5,11,26,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:'Geist Mono',monospace;font-size:13px;letter-spacing:.14em;white-space:nowrap}
.brand i{width:8px;height:8px;background:var(--or);transform:rotate(45deg);border-radius:2px;flex-shrink:0}
.brand b{font-weight:700}.brand span{color:var(--muted)}
.tabs{display:flex;gap:4px;margin-left:10px}
.tabs button{padding:8px 15px;border-radius:99px;color:var(--text2);font-weight:600;font-size:14.5px;transition:background .15s}
.tabs button:hover{background:rgba(255,255,255,.05)}
.tabs button.on{background:var(--orbg);color:#fff;box-shadow:inset 0 0 0 1px var(--orline)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:14px;position:relative}
.sync{font-family:'Geist Mono',monospace;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
.sync::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ok);flex-shrink:0}
.sync.busy::before{background:var(--or2);animation:pulse 1s infinite}
.sync.warn{color:var(--warn)}.sync.warn::before{background:var(--warn)}
@keyframes pulse{50%{opacity:.3}}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;font-weight:800;flex-shrink:0}
.menu{position:absolute;right:0;top:46px;background:var(--sheet);border:1px solid var(--line2);border-radius:14px;padding:6px;min-width:200px;box-shadow:0 20px 40px rgba(0,0,0,.5);z-index:40}
.menu button{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:9px;font-weight:600}
.menu button:hover{background:var(--orbg)}
.teste{background:repeating-linear-gradient(135deg,#ffc65c,#ffc65c 10px,#f5b43a 10px,#f5b43a 20px);color:#2a1a00;text-align:center;font:700 12px 'Geist Mono',monospace;letter-spacing:.12em;padding:5px}

/* botões */
.btn-or{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;font-weight:700;padding:12px 18px;border-radius:12px;box-shadow:0 10px 24px -10px rgba(255,90,31,.8);white-space:nowrap}
.btn-or.sm{padding:8px 14px;font-size:14px;border-radius:10px}
.btn-or:active{transform:translateY(1px)}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);padding:11px 16px;border-radius:12px;font-weight:600;color:var(--text2);white-space:nowrap}
.btn-ghost:hover{border-color:var(--orline);color:#fff}
.link{color:var(--or2);font-weight:600;font-size:14px}
.link:hover{text-decoration:underline}

main{max-width:1180px;margin:0 auto;padding:22px 20px calc(120px + var(--sab))}
.phd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.phd h1{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.phd .sub{font-size:14px;color:var(--muted)}
.phd .cnt{font:700 13px 'Geist Mono',monospace;color:var(--or2);background:var(--orbg);border:1px solid var(--orline);border-radius:99px;padding:2px 10px;align-self:center}
.phd .cnt:empty{display:none}

/* chips e campos */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:99px;border:1px solid var(--line2);color:var(--text2);font-weight:600;font-size:14.5px;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--orline);color:#fff}
.chip.on{background:linear-gradient(135deg,var(--or),var(--or2));border-color:transparent;color:#fff}
.chip .n{font-family:'Geist Mono',monospace;font-size:12.5px;opacity:.75}
.chips.sm .chip{padding:6px 11px;font-size:13.5px}
.chip.tag{background:var(--orbg);border-color:var(--orline);color:#fff;padding:7px 8px 7px 13px}
.chip.tag .rm{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:16px;line-height:1;color:var(--text2)}
.chip.tag .rm:hover{background:rgba(255,255,255,.12);color:#fff}
input,textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;line-height:1.5}
input:focus,textarea:focus{border-color:var(--orline);box-shadow:0 0 0 3px rgba(255,90,31,.16)}
::placeholder{color:var(--faint)}
.fl{display:flex;flex-direction:column}
.err{color:var(--red);font-size:13.5px;font-weight:600;margin-top:6px;min-height:0}
.err:empty{display:none}
.ta{position:relative}
.ta .x{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;font-size:20px;color:var(--muted)}
.ta .x:hover{background:rgba(255,255,255,.08);color:#fff}
.ta input.has-x{padding-right:44px}
.dd{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--sheet);border:1px solid var(--line2);border-radius:14px;padding:6px;z-index:30;box-shadow:0 20px 40px rgba(0,0,0,.55);max-height:300px;overflow:auto}
.opt{padding:11px 12px;border-radius:9px;cursor:pointer;font-size:15px;display:flex;justify-content:space-between;gap:10px}
.opt:hover,.opt.act{background:var(--orbg)}
.opt.add{color:var(--or2);font-weight:600}
.opt mark{background:none;color:var(--or2);font-weight:700}
.opt .n{font-family:'Geist Mono',monospace;font-size:12.5px;color:var(--muted)}

/* quem procura */
.grid2{display:grid;grid-template-columns:390px minmax(0,1fr);gap:22px;margin-top:18px;align-items:start}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:20px;position:sticky;top:86px}
.panel .step{display:flex;align-items:center;gap:8px}
.panel .step .k{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;font:700 11.5px 'Geist Mono',monospace;display:inline-flex;align-items:center;justify-content:center;letter-spacing:0}
.top-b{margin-top:10px}
.top-b .cap{font-size:12.5px;color:var(--faint);margin-bottom:7px}
details.more{border-top:1px solid var(--line);padding-top:16px}
details.more summary{list-style:none;cursor:pointer;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:'+';width:22px;height:22px;border-radius:7px;border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;color:var(--or2);font-weight:700}
details.more[open] summary::before{content:'–'}
details.more .in{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.row-s{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.xs{font-size:12.5px}
.clear{align-self:flex-start}

#p-head{scroll-margin-top:calc(var(--sat) + 80px)}
.rhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:2px 2px 16px}
.rhead .big{font-size:38px;font-weight:900;letter-spacing:-.05em;line-height:.9}
.rhead .sub{font-size:18px;color:var(--text2)}
.rhead .sub b{color:#fff}
.group-t{display:flex;align-items:center;gap:10px;margin:22px 2px 12px}
.group-t .lbl{margin:0}
.group-t::after{content:'';flex:1;height:1px;background:var(--line)}
.list{display:flex;flex-direction:column;gap:12px}
.empty{border:1px dashed var(--line2);border-radius:20px;padding:34px 26px;text-align:center;color:var(--text2)}
.empty h3{font-size:22px;font-weight:800;letter-spacing:-.02em;color:#fff;margin-bottom:6px}
.empty p{max-width:46ch;margin:0 auto}
.empty .chips{justify-content:center;margin-top:16px}
.empty .btn-or{margin-top:18px}

.cli{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:11px;transition:border-color .15s}
.cli:hover{border-color:var(--line2)}
.cli.sent{border-color:rgba(61,220,151,.45)}
.cli.dim{opacity:.72}
.cli-top{display:flex;align-items:center;gap:13px}
.av{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font:700 14.5px 'Geist Mono',monospace;color:var(--or2);flex-shrink:0;letter-spacing:.02em}
.av.lg{width:58px;height:58px;border-radius:18px;font-size:18px}
.cli-id{flex:1;min-width:0;cursor:pointer}
.nm{font-size:17.5px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.meta{font-size:14px;color:var(--text2);margin-top:2px}
.meta .sep{color:var(--faint)}
.btn-wa{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;font-weight:700;padding:10px 15px;border-radius:12px;font-size:14.5px;flex-shrink:0;box-shadow:0 10px 22px -12px rgba(255,90,31,.9)}
.btn-wa svg{width:18px;height:18px}
.btn-wa.off{background:rgba(255,255,255,.06);color:var(--muted);box-shadow:none;border:1px solid var(--line2)}
.bchips{display:flex;flex-wrap:wrap;gap:6px}
.b{font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--line2);color:var(--text2)}
.b.on{border-color:var(--orline);background:var(--orbg);color:#fff}
.obs{font-size:14.5px;color:var(--text2);line-height:1.45}
.obs::before{content:'“';color:var(--or2)}.obs::after{content:'”';color:var(--or2)}
.foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.or{background:var(--or2)}
.foot .ok-t{color:var(--ok);font-weight:700}
.foot .warn-t{color:var(--warn);font-weight:600}
.foot .or-t{color:var(--or2);font-weight:600}
.foot .sp{margin-left:auto}
.motivo{font-size:13.5px;color:var(--warn);font-weight:600}

/* bairros */
.bar-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}
.bar-tools .ta{flex:1;min-width:220px;max-width:380px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:18px}
.brow{text-align:left;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,transform .15s}
.brow:hover{border-color:var(--orline);transform:translateY(-1px)}
.brow .bt{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.brow .bn{font-size:18px;font-weight:800;letter-spacing:-.02em}
.brow .bc{font-family:'Geist Mono',monospace;font-size:13px;color:var(--muted);white-space:nowrap}
.brow .bc b{font-size:22px;color:#fff;font-family:'Geist',sans-serif;font-weight:900;margin-right:4px}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--or),var(--or2))}
.brow .bx{font-size:13.5px;color:var(--text2)}

/* clientes */
.crow{width:100%;text-align:left;display:flex;align-items:center;gap:14px;padding:14px 16px;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:16px;transition:border-color .15s}
.crow:hover{border-color:var(--line2)}
.crow .cm{flex:1;min-width:0}
.crow .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .cs{text-align:right;font-size:13px;flex-shrink:0;display:flex;align-items:center;gap:7px;color:var(--muted)}
.crow .cs .ts{display:none;white-space:nowrap}
.pill{display:inline-block;font:700 10.5px 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;vertical-align:middle;margin-left:6px}
.pill.pausado{background:rgba(255,198,92,.14);color:var(--warn)}
.pill.comprou{background:rgba(61,220,151,.14);color:var(--ok)}
.pill.ativo{background:var(--orbg);color:var(--or2)}

/* imóveis da J8 na ficha */
.j8box{border:1px solid var(--orline);background:linear-gradient(180deg,rgba(255,90,31,.08),rgba(255,90,31,.02));border-radius:18px;padding:16px}
.j8box .lbl{color:var(--or2)}
.j8l{display:flex;flex-direction:column;gap:10px}
.j8c{display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--line2);border-radius:14px;overflow:hidden;transition:border-color .15s,transform .15s}
.j8c:hover{border-color:var(--orline);transform:translateY(-1px)}
.j8c .ph{display:block;width:136px;flex-shrink:0;background:#1a2440 center/cover no-repeat;min-height:112px}
.j8c .bd{flex:1;min-width:0;padding:11px 14px 11px 0;display:flex;flex-direction:column;gap:2px}
.j8c .t1{font-weight:700;font-size:15.5px;letter-spacing:-.01em}
.j8c .t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.j8c .sp{font-size:13.5px;color:var(--text2);margin-top:2px}
.j8c .pr{font-weight:800;font-size:16px;margin-top:4px}
.j8top{display:flex;gap:14px}
.ultc{display:inline-block;margin-top:8px;font:600 12.5px 'Geist Mono',monospace;letter-spacing:.04em;color:var(--ok);border:1px solid rgba(61,220,151,.4);border-radius:99px;padding:3px 10px}
.ultc.warn{color:var(--warn);border-color:rgba(255,198,92,.45)}
.j8mais{width:100%;margin-top:10px;padding:12px;border:1px dashed var(--orline);border-radius:12px;color:var(--or2);font-weight:700;font-size:14.5px}
.j8mais:hover{background:var(--orbg)}
.j8mais .muted{font-weight:500}
.j8c .env8{font-size:12.5px;color:var(--ok);font-weight:600;margin-top:4px}
.j8c .selos{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.j8c .selos span{font:600 10.5px 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--or2);border:1px solid var(--orline);border-radius:99px;padding:2px 8px}
.j8act{display:grid;grid-template-columns:repeat(3,1fr);align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.j8c .go,.j8c .bk{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13.5px;white-space:nowrap;padding:8px 12px;border-radius:9px}
.j8c .bk{color:#fff;background:linear-gradient(135deg,var(--or),var(--or2))}
.j8c .bk.ghost{background:none;border:1px solid var(--line2);color:var(--text)}
.j8c .bk.ghost:hover{border-color:var(--orline)}
.j8c .bk.ready{background:linear-gradient(135deg,#1fbf78,#3ddc97)}
.j8c .go{color:var(--or2);grid-column:1 / -1;justify-self:end}
.j8c .go:hover{background:var(--orbg)}
.j8c .go svg,.j8c .bk svg{width:15px;height:15px}
.j8n{font:700 11px 'Geist Mono',monospace;letter-spacing:.06em;color:var(--or2);border:1px solid var(--orline);border-radius:99px;padding:3px 8px;white-space:nowrap}

/* folhas (modais) */
.ov{position:fixed;inset:0;z-index:50;background:rgba(2,5,14,.66);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:24px}
.sheet{width:100%;max-width:600px;max-height:calc(100dvh - 48px);background:var(--sheet);border:1px solid var(--line2);border-radius:24px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,.6)}
.sh-h{display:flex;align-items:flex-start;gap:14px;padding:22px 22px 16px;border-bottom:1px solid var(--line)}
.sh-h h2{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin-top:3px;overflow-wrap:anywhere}
.sh-h .x{margin-left:auto;width:36px;height:36px;border-radius:50%;font-size:22px;color:var(--muted);flex-shrink:0}
.sh-h .x:hover{background:rgba(255,255,255,.08);color:#fff}
.sh-b{padding:20px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:20px;-webkit-overflow-scrolling:touch}
.sh-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px calc(14px + var(--sab));border-top:1px solid var(--line)}
.seg{display:flex;background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 8px;border-radius:9px;font-weight:700;font-size:14px;color:var(--text2)}
.seg button.on{background:linear-gradient(135deg,var(--or),var(--or2));color:#fff}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.acts > *{flex:1}
.info{display:grid;grid-template-columns:150px 1fr;gap:12px 16px;font-size:15px}
.info dt{color:var(--muted);font-size:13.5px;padding-top:1px}
.info dd{color:var(--text)}
.env{display:flex;flex-direction:column;gap:8px}
.env-i{display:flex;align-items:flex-start;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;font-size:14px}
.env-i .d{font-family:'Geist Mono',monospace;font-size:12.5px;color:var(--muted);white-space:nowrap;padding-top:1px}
.env-i .w{flex:1;min-width:0}
.env-i a{color:var(--or2);word-break:break-all;font-size:13px}

'use strict';
// ── CONFIG ──

// categorias do estoque da J8 -> tipos da Carteira

  'CASA CONDOMINIO FECHADO': 'Casa em condomínio', 'SOBRADO': 'Sobrado', 'SOBRADO CONDOMINIO FECHADO': 'Sobrado em condomínio',
  'TERRENO': 'Terreno', 'TERRENO CONDOMINIO FECHADO': 'Terreno em condomínio', 'CONJUNTO/COMERCIAL/LOJA': 'Comercial'
};

// ── UTIL ──
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').normalize('NFC').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const pad = n => String(n).padStart(2, '0');
const ALIAS_KEY = {};
ALIASES.forEach(g => g.forEach(b => { ALIAS_KEY[norm(b)] = norm(g[0]); }));
const bkey = b => ALIAS_KEY[norm(b)] || norm(b);
const bLabel = b => { const g = ALIASES.find(g => g.some(x => norm(x) === norm(b))); return g ? g.join(' / ') : b; };

function nowLocal() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function daysSince(iso) {
  if (!iso) return null;
  const [y, m, d] = iso.slice(0, 10).split('-').map(Number);
  const t = new Date();
  return Math.round((Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) - Date.UTC(y, m - 1, d)) / 864e5);
}
const fmtDate = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : '';
const fmtShort = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : '';
const haDias = n => n <= 0 ? 'hoje' : n === 1 ? 'ontem' : `há ${n} dias`;
function fmtValor(v) {
  if (!v) return '';
  if (v >= 1e6) { const x = v / 1e6; const s = Number.isInteger(x) ? String(x) : x.toFixed(2).replace(/0+$/, '').replace(/\.$/, ''); return 'R$ ' + s.replace('.', ',') + ' mi'; }
  if (v >= 1e3) return 'R$ ' + Math.round(v / 1e3) + ' mil';
  return 'R$ ' + v;
}
const parseMoney = s => Number(String(s || '').replace(/\D/g, '')) || 0;
function maskMoney(inp) { const d = inp.value.replace(/\D/g, '').replace(/^0+/, ''); inp.value = d ? 'R$ ' + Number(d).toLocaleString('pt-BR') : ''; }
const digits = s => String(s || '').replace(/\D/g, '');
function waNumber(p) { let d = digits(p).replace(/^0+/, ''); if (!d) return ''; if (d.length <= 11) d = '55' + d; return d; }
function fmtFone(p) {
  const d = digits(p).replace(/^55(?=\d{10,11}$)/, '');
  if (d.length === 11) return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
  if (d.length === 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
  return p || '';
}
const initials = n => { const p = String(n || '').trim().split(/\s+/).filter(Boolean); return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); };
const firstName = n => String(n || '').trim().split(/\s+/)[0] || '';
const normLink = s => String(s || '').trim().replace(/^https?:\/\//i, '').replace(/^www\./i, '').replace(/#.*$/, '').replace(/\/+$/, '').toLowerCase();
const plural = (n, s, p) => n === 1 ? s : p;
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const WA_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.5-.3z"/></svg>';

// ── FIRESTORE (REST) ──
function toFs(v) {
  if (v === null || v === undefined) return { nullValue: null };
  if (Array.isArray(v)) return { arrayValue: { values: v.map(toFs) } };
  switch (typeof v) {
    case 'string': return { stringValue: v };
    case 'boolean': return { booleanValue: v };
    case 'number': return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
    case 'object': { const f = {}; for (const k in v) if (v[k] !== undefined) f[k] = toFs(v[k]); return { mapValue: { fields: f } }; }
  }
  return { nullValue: null };
}
function fromFs(v) {
  if (!v) return null;
  if ('stringValue' in v) return v.stringValue;
  if ('integerValue' in v) return Number(v.integerValue);
  if ('doubleValue' in v) return v.doubleValue;
  if ('booleanValue' in v) return v.booleanValue;
  if ('nullValue' in v) return null;
  if ('timestampValue' in v) return v.timestampValue;
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(fromFs);
  if ('mapValue' in v) { const o = {}, f = v.mapValue.fields || {}; for (const k in f) o[k] = fromFs(f[k]); return o; }
  return null;
}
function docFields(c) { const o = Object.assign({}, c); delete o.id; return toFs(o).mapValue.fields; }

function cleanClient(o) {
  o = o || {};
  return {
    id: o.id,
    nome: String(o.nome || ''),
    whats: String(o.whats || ''),
    tipos: Array.isArray(o.tipos) ? o.tipos.filter(Boolean) : [],
    bairros: Array.isArray(o.bairros) ? o.bairros.filter(Boolean) : [],
    valorMax: Number(o.valorMax) || 0,
    quartos: Number(o.quartos) || 0,

    areaMin: Number(o.areaMin) || 0,

    situacao: Array.isArray(o.situacao) ? o.situacao.filter(x => SITUACOES.some(s => s[0] === x)) : [],

}

let clientes = [];
const byId = id => clientes.find(c => c.id === id);
const persistCache = () => lsSet(LS_CACHE, clientes);

// Cada cliente grava em fila própria, sempre com a versão local mais recente.
// O que não chegou ao Firebase fica pendente neste aparelho e é reenviado depois.
const chain = {}, seq = {};
let failing = false, inflight = 0;
function queueWrite(id) {
  const my = seq[id] = (seq[id] || 0) + 1;
  const run = async () => {
    if (my !== seq[id]) return;
    const pend = lsGet(LS_PEND, {});
    if (!(id in pend)) return;
    const cur = pend[id];
    const url = `${FB_ROOT}/${COL}/${encodeURIComponent(id)}?key=${FB_KEY}`;
    inflight++; updateSync();
    try {
      const r = cur.__del
        ? await fetch(url, { method: 'DELETE' })
        : await fetch(url, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields: docFields(cur) }) });
      if (!r.ok && !(cur.__del && r.status === 404)) throw new Error('HTTP ' + r.status);
      if (my === seq[id]) { const p = lsGet(LS_PEND, {}); delete p[id]; lsSet(LS_PEND, p); }
      failing = false;
    } catch (e) {
      if (!failing) toast('Sem conexão. Salvo neste aparelho; envio para a nuvem assim que a internet voltar.');
      failing = true;
    } finally { inflight--; updateSync(); }
  };
  chain[id] = (chain[id] || Promise.resolve()).then(run, run);
  return chain[id];
}
const flushPending = () => Object.keys(lsGet(LS_PEND, {})).forEach(queueWrite);
setInterval(() => { if (failing) flushPending(); }, 30000);
window.addEventListener('online', flushPending);

function saveClient(c) {

function j8Section(c) {

function matchQ(c, q) {

        <dt>Metragem</dt><dd>${c.areaMin && c.areaMax ? `de ${c.areaMin} a ${c.areaMax} m²` : c.areaMin ? `a partir de ${c.areaMin} m²` : c.areaMax ? `até ${c.areaMax} m²` : 'Tanto faz'}</dd>
        <dt>Quartos</dt><dd>${c.quartos ? c.quartos + ' ou mais' : 'Tanto faz'}</dd>
        ${c.terrenoMin ? `<dt>Terreno</dt><dd>a partir de ${c.terrenoMin.toLocaleString('pt-BR')} m²</dd>` : ''}
        <dt>Vagas</dt><dd>${c.vagas ? c.vagas + ' ou mais' : 'Tanto faz'}</dd>
        <dt>Situação</dt><dd>${c.situacao.length ? SITUACOES.filter(s => c.situacao.includes(s[0])).map(s => s[1]).join(' ou ') : 'Tanto faz'}</dd>
        <dt>Mobília</dt><dd>${c.mobilia.length ? MOBILIAS.filter(s => c.mobilia.includes(s[0])).map(s => s[1]).join(' ou ') : 'Tanto faz'}</dd>
        <dt>O que mais busca</dt><dd>${esc(c.obs) || '—'}</dd>
        <dt>De onde veio</dt><dd>${esc(c.origem) || '—'}</dd>
      </dl>
    </div>
    <div><span class="lbl">Imóveis enviados · ${envios.length}</span>
      ${envios.length ? `<div class="env">${envios.map(e => `<div class="env-i"><span class="d">${fmtShort(e.data)}</span><div class="w">${esc([e.tipo, e.bairro].filter(Boolean).join(' · ') || 'Imóvel')}${e.valor ? ' · ' + fmtValor(e.valor) : ''}${e.link ? `<br><a href="${esc(/^https?:/i.test(e.link) ? e.link : 'https://' + e.link)}" target="_blank" rel="noopener">${esc(e.link)}</a>` : ''}</div><button class="rm" data-act="env-del" data-id="${c.id}" data-e="${esc(e.id)}" aria-label="Remover envio">×</button></div>`).join('')}</div>`
        : `<p class="muted" style="font-size:14px">Nenhum imóvel enviado ainda. Use “Quem procura” para mandar o primeiro.</p>`}
    </div>
    <div>${confirmDel
      ? `<div class="confirm"><span>Excluir <b>${esc(c.nome)}</b> da carteira?</span><button class="btn-del" data-act="del-yes" data-id="${c.id}">Sim, excluir</button><button class="link" data-act="del-no" data-id="${c.id}">Cancelar</button></div>`
      : `<button class="danger" data-act="del-ask" data-id="${c.id}">Excluir cliente</button>`}</div>
  </div>`;
  if (ui.sheet && ui.sheet.kind === 'ficha' && ui.sheet.id === id) { const sb = $('#sheet .sh-b'), top = sb ? sb.scrollTop : 0; $('#sheet').innerHTML = html; const nb = $('#sheet .sh-b'); if (nb) nb.scrollTop = top; }
  else openSheet(html, { kind: 'ficha', id });
}

// ── FORMULÁRIO ──
let form = null;
function openForm(id) {
  const c = id ? byId(id) : null;
  form = c ? JSON.parse(JSON.stringify(c)) : cleanClient({});
  form._dupOk = false;
  const f = form;
  openSheet(`
  <div class="sh-h"><div style="min-width:0"><div class="kick">${c ? 'Editar ficha' : 'Novo cliente'}</div><h2>${c ? esc(c.nome) : 'Quem é e o que procura'}</h2></div><button class="x" data-act="close" aria-label="Fechar">×</button></div>
  <div class="sh-b">
    <div class="fl"><label class="lbl" for="f-nome">Nome *</label><input id="f-nome" value="${esc(f.nome)}" placeholder="Nome do cliente" autocomplete="off"><div class="err" id="e-nome"></div></div>
    <div class="fl"><label class="lbl" for="f-whats">WhatsApp</label><input id="f-whats" type="tel" inputmode="tel" value="${esc(fmtFone(f.whats))}" placeholder="(41) 99999-9999" autocomplete="off"><div class="err" id="e-whats"></div><div id="e-dup"></div></div>
    <div><span class="lbl">Tipo de imóvel *<span class="hint">pode marcar mais de um</span></span><div class="chips" id="f-tipos"></div><div class="err" id="e-tipos"></div></div>
    <div><span class="lbl">Bairros *<span class="hint">todos que ele aceita</span></span><div class="chips" id="f-bairros" style="margin-bottom:10px"></div>
      <div class="ta"><input id="f-bairro" placeholder="Digite um bairro e escolha na lista" autocomplete="off" aria-label="Adicionar bairro"><div class="dd hidden" id="f-bairro-dd"></div></div><div class="err" id="e-bairros"></div></div>
    <div class="fl"><label class="lbl" for="f-valor">Até quanto investe</label><input id="f-valor" inputmode="numeric" value="${f.valorMax ? 'R$ ' + f.valorMax.toLocaleString('pt-BR') : ''}" placeholder="R$ 0" autocomplete="off"></div>
    <div><span class="lbl">Metragem<span class="hint">apartamento: área privativa · casa: área construída (m²)</span></span>
      <div class="row-s" style="margin-top:0;flex-wrap:nowrap">
        <input id="f-amin" inputmode="numeric" value="${f.areaMin || ''}" placeholder="De (ex.: 120)" autocomplete="off" aria-label="Metragem mínima">
        <span class="muted">a</span>
        <input id="f-amax" inputmode="numeric" value="${f.areaMax || ''}" placeholder="Até (opcional)" autocomplete="off" aria-label="Metragem máxima">
      </div><div class="err" id="e-area"></div></div>
    <div class="fl" id="f-terreno-box"><label class="lbl" for="f-terreno">Terreno (no mínimo)<span class="hint">para casa e terreno, em m²</span></label><input id="f-terreno" inputmode="numeric" value="${f.terrenoMin || ''}" placeholder="Ex.: 600" autocomplete="off"></div>
    <div><span class="lbl">Quartos (no mínimo)</span><div class="chips" id="f-quartos"></div></div>
    <div><span class="lbl">Vagas (no mínimo)</span><div class="chips" id="f-vagas"></div></div>
    <div><span class="lbl">Situação<span class="hint">nenhum marcado = tanto faz</span></span><div class="chips" id="f-sit"></div></div>
    <div><span class="lbl">Mobília<span class="hint">nenhum marcado = tanto faz</span></span><div class="chips" id="f-mob"></div></div>
    <div class="fl"><label class="lbl" for="f-obs">O que mais ele busca</label><textarea id="f-obs" rows="3" placeholder="Ex.: piscina, 3 vagas, condomínio fechado, aceita permuta">${esc(f.obs)}</textarea></div>
    <div><span class="lbl">De onde veio</span><div class="chips sm" id="f-origem"></div></div>
  </div>
  <div class="sh-f"><button class="btn-ghost" data-act="close">Cancelar</button><button class="btn-or" data-act="f-save">${c ? 'Salvar alterações' : 'Cadastrar cliente'}</button></div>`, { kind: 'form', id: id || null });
  renderFormChips();
  $('#f-valor').addEventListener('input', e => maskMoney(e.target));
  $('#f-whats').addEventListener('input', () => { form._dupOk = false; $('#e-dup').innerHTML = ''; });
  typeahead($('#f-bairro'), $('#f-bairro-dd'), { exclude: () => form.bairros, onPick: b => { addFormBairro(b); return true; } });
  if (matchMedia('(min-width:901px)').matches) setTimeout(() => $('#f-nome').focus(), 30);
}
function addFormBairro(b) {
  b = spell(b);
  if (!b || form.bairros.some(x => norm(x) === norm(b))) return;
  form.bairros.push(b); renderFormChips(); $('#e-bairros').textContent = '';
}
function renderFormChips() {
  const f = form;
  $('#f-tipos').innerHTML = TIPOS.map(t => `<button class="chip${f.tipos.includes(t) ? ' on' : ''}" data-act="f-tipo" data-v="${t}">${t}</button>`).join('');
  $('#f-bairros').innerHTML = f.bairros.map(b => `<span class="chip tag">${esc(b)}<button class="rm" data-act="f-bairro-rm" data-b="${esc(b)}" aria-label="Remover ${esc(b)}">×</button></span>`).join('');
  $('#f-bairros').style.display = f.bairros.length ? '' : 'none';
  $('#f-quartos').innerHTML = [0, 1, 2, 3, 4].map(n => `<button class="chip${f.quartos === n ? ' on' : ''}" data-act="f-quartos" data-v="${n}">${n ? n + '+' : 'Tanto faz'}</button>`).join('');
  $('#f-vagas').innerHTML = [0, 1, 2, 3, 4].map(n => `<button class="chip${f.vagas === n ? ' on' : ''}" data-act="f-vagas" data-v="${n}">${n ? n + '+' : 'Tanto faz'}</button>`).join('');
  $('#f-origem').innerHTML = ORIGENS.map(o => `<button class="chip${f.origem === o ? ' on' : ''}" data-act="f-origem" data-v="${o}">${o}</button>`).join('');
  $('#f-sit').innerHTML = SITUACOES.map(([k, l]) => `<button class="chip${f.situacao.includes(k) ? ' on' : ''}" data-act="f-sit" data-v="${k}">${l}</button>`).join('');
  $('#f-mob').innerHTML = MOBILIAS.map(([k, l]) => `<button class="chip${f.mobilia.includes(k) ? ' on' : ''}" data-act="f-mob" data-v="${k}">${l}</button>`).join('');
  // terreno só interessa para casa e terreno
  $('#f-terreno-box').classList.toggle('hidden', !f.tipos.some(t => t === 'Casa' || t === 'Terreno'));
}
function saveForm() {
  const f = form; if (!f) return;
  const pend = $('#f-bairro').value.trim();
  if (pend) { const s = suggest(pend, f.bairros)[0]; addFormBairro(s && norm(s).startsWith(norm(pend)) ? s : pend); $('#f-bairro').value = ''; }
  f.nome = $('#f-nome').value.trim().replace(/\s+/g, ' ');
  f.whats = digits($('#f-whats').value);
  f.valorMax = parseMoney($('#f-valor').value);
  f.obs = $('#f-obs').value.trim();
  f.areaMin = Number(digits($('#f-amin').value)) || 0;
  f.areaMax = Number(digits($('#f-amax').value)) || 0;
  f.terrenoMin = $('#f-terreno-box').classList.contains('hidden') ? 0 : Number(digits($('#f-terreno').value)) || 0;
  let bad = null;
  const err = (id, msg) => { $('#' + id).textContent = msg; if (msg && !bad) bad = id; };
  err('e-nome', f.nome ? '' : 'Coloque o nome do cliente.');
  err('e-whats', !f.whats || (f.whats.length >= 10 && f.whats.length <= 13) ? '' : 'Número incompleto. Use DDD + número, ex.: (41) 99999-9999.');
  err('e-tipos', f.tipos.length ? '' : 'Marque pelo menos um tipo.');
  err('e-bairros', f.bairros.length ? '' : 'Adicione pelo menos um bairro.');
  err('e-area', f.areaMin && f.areaMax && f.areaMax < f.areaMin ? 'A metragem “até” está menor que a “de”.' : '');
  if (bad) { const el = $('#' + bad); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
  if (f.whats && !f._dupOk) {
    const dup = clientes.find(c => c.id !== f.id && digits(c.whats) && waNumber(c.whats) === waNumber(f.whats));
    if (dup) {
      $('#e-dup').innerHTML = `<div class="dup" style="margin-top:8px">Já existe um cliente com esse WhatsApp: <b>${esc(dup.nome)}</b>. <button data-act="ficha" data-id="${dup.id}">Abrir ficha</button> ou toque em salvar de novo para cadastrar assim mesmo.</div>`;
      f._dupOk = true; return;
    }
  }
  const isNew = !f.id;
  const data = Object.assign({}, f); delete data._dupOk;
  if (isNew) { data.id = newId('c'); data.criadoEm = nowLocal(); data.status = 'ativo'; data.envios = []; }
  else { const orig = byId(f.id); if (orig) { data.envios = orig.envios; data.status = orig.status; data.criadoEm = orig.criadoEm; } }
  const saved = saveClient(data);
  closeSheet();
  toast(isNew ? `${firstName(saved.nome)} entrou na carteira.` : 'Ficha atualizada.');
}

// ── BUSCA DE BAIRROS (autocompletar) ──
function suggest(q, exclude) {
  const n = norm(q), ex = new Set((exclude || []).map(bkey));
  let list = allBairros().filter(b => !ex.has(bkey(b)));
  if (n) list = list.filter(b => norm(b).includes(n)).sort((a, b) => (norm(b).startsWith(n) - norm(a).startsWith(n)) || a.localeCompare(b, 'pt-BR'));
  else { const top = demanda('').map(r => r.b).filter(b => !ex.has(bkey(b))); list = top.concat(list.filter(b => !top.some(t => bkey(t) === bkey(b)))); }
  return list.slice(0, 8);
}
function hl(b, q) {
  const n = norm(q); const i = n ? norm(b).indexOf(n) : -1;
  if (i < 0) return esc(b);
  return esc(b.slice(0, i)) + '<mark>' + esc(b.slice(i, i + n.length)) + '</mark>' + esc(b.slice(i + n.length));
}
function typeahead(input, dd, opts) {
  let act = -1;
  const counts = () => { const m = {}; demanda('').forEach(r => { m[bkey(r.b)] = r.n; }); return m; };
  const show = () => {
    const q = input.value.trim(); const ex = opts.exclude();
    const list = suggest(q, ex); const cnt = counts();
    const exact = list.some(b => norm(b) === norm(q)) || ex.some(b => norm(b) === norm(q));
    let h = list.map((b, i) => `<div class="opt${i === act ? ' act' : ''}" data-b="${esc(b)}"><span>${hl(b, q)}</span>${cnt[bkey(b)] ? `<span class="n">${cnt[bkey(b)]} ${plural(cnt[bkey(b)], 'cliente', 'clientes')}</span>` : ''}</div>`).join('');
    if (q && !exact) h += `<div class="opt add" data-b="${esc(q)}">Usar “${esc(q)}”</div>`;
    dd.innerHTML = h; dd.classList.toggle('hidden', !h);
  };
  const pick = b => { const clear = opts.onPick(b); if (clear) input.value = ''; dd.classList.add('hidden'); act = -1; if (clear) show(); };
  input.addEventListener('input', () => { act = -1; show(); });
  input.addEventListener('focus', show);
  input.addEventListener('blur', () => setTimeout(() => dd.classList.add('hidden'), 160));
  input.addEventListener('keydown', e => {
    const items = [...dd.querySelectorAll('.opt')];
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!items.length) return; e.preventDefault();
      act = (act + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items.forEach((o, i) => o.classList.toggle('act', i === act));
      items[act].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      if (!input.value.trim() && act < 0) return;
      e.preventDefault();
      const o = items[act >= 0 ? act : 0]; if (o) pick(o.dataset.b);
    } else if (e.key === 'Escape') { dd.classList.add('hidden'); }
  });
  dd.addEventListener('mousedown', e => { const o = e.target.closest('.opt'); if (!o) return; e.preventDefault(); pick(o.dataset.b); });
}

// ── TOAST ──
let toastT;
function toast(msg, action) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button id="toast-a">${esc(action.label)}</button>` : '');
  t.classList.remove('hidden');
  if (action) $('#toast-a').onclick = () => { t.classList.add('hidden'); action.fn(); };
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), action ? 6000 : 3200);
}

// ── AÇÕES ──
function registrarEnvio(id) {
  const c = byId(id); if (!c) return;
  const e = { id: newId('e'), data: nowLocal(), tipo: ui.p.tipo || '', bairro: ui.p.bairro || '', valor: ui.p.valor || 0, link: ui.p.link || '' };
  ui.sent[id] = e.id;
  saveClient(Object.assign({}, c, { envios: c.envios.concat([e]) }));
}
function desfazerEnvio(id) {
  const c = byId(id), eid = ui.sent[id]; delete ui.sent[id];
  if (!c) return;
  saveClient(Object.assign({}, c, { envios: c.envios.filter(e => e.id !== eid) }));
}

document.addEventListener('click', e => {
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn) { go(tabBtn.dataset.tab); return; }
  const menu = $('#menu');
  if (menu && !menu.classList.contains('hidden') && !e.target.closest('#menu') && !e.target.closest('[data-act="menu"]')) menu.classList.add('hidden');
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  switch (a) {
    case 'novo': openForm(); break;
    case 'menu': menu.classList.toggle('hidden'); break;
    case 'recarregar': menu.classList.add('hidden'); loaded = false; updateSync(); refresh(); break;
    case 'sair': try { localStorage.removeItem(LS_AUTH); } catch (er) {} location.reload(); break;
    case 'p-tipo': ui.p.tipo = ui.p.tipo === v ? '' : v; if (ui.tab !== 'procurar') go('procurar'); renderPTipos(); renderPTop(); renderPList(); break;
    case 'p-quartos': ui.p.quartos = ui.p.quartos === +v ? 0 : +v; renderPQuartos(); renderPList(); break;
    case 'p-bairro': setPBairro(el.dataset.b); break;
    case 'p-clear':
      ui.p = { tipo: '', bairro: '', valor: 0, quartos: 0, link: '' }; ui.sent = {};
      $('#p-bairro').value = ''; $('#p-valor').value = ''; $('#p-link').value = '';
      renderPTipos(); renderPQuartos(); renderPTop(); renderPList(); break;
    case 'alimentar': ui.c.f = 'alimentar'; go('clientes'); renderClientes(); break;
    case 'enviar': setTimeout(() => { registrarEnvio(id); toast('Envio registrado na ficha.', { label: 'Desfazer', fn: () => desfazerEnvio(id) }); }, 0); break;
    case 'desfazer': desfazerEnvio(id); break;
    case 'ficha': if (ui.sheet && ui.sheet.kind === 'form') closeSheet(); renderFicha(id); break;
    case 'edit': openForm(id); break;
    case 'close': closeSheet(); break;
    case 'status': { const c = byId(id); if (c && c.status !== v) { saveClient(Object.assign({}, c, { status: v })); toast(v === 'ativo' ? 'Cliente ativo de novo.' : v === 'pausado' ? 'Pausado: não aparece nas buscas até você reativar.' : 'Comprou! Saiu das buscas.'); } break; }
    case 'del-ask': renderFicha(id, true); break;
    case 'del-no': renderFicha(id); break;
    case 'del-yes': {
      const c = byId(id); if (!c) break;
      const copia = JSON.parse(JSON.stringify(c));
      closeSheet(); removeClient(id);
      toast(`${firstName(c.nome)} foi excluído.`, { label: 'Desfazer', fn: () => { saveClient(copia); } });
      break;
    }
    case 'env-del': { const c = byId(id); if (c) { if (ui.sent[id] === el.dataset.e) delete ui.sent[id]; saveClient(Object.assign({}, c, { envios: c.envios.filter(x => x.id !== el.dataset.e) })); } break; }
    case 'bairro': ui.p.tipo = ui.b.tipo; ui.p.bairro = ''; go('procurar'); renderPTipos(); setPBairro(el.dataset.b); break;
    case 'b-tipo': ui.b.tipo = v; renderBairros(); break;
    case 'c-f': ui.c.f = v; renderClientes(); break;
    case 'f-tipo': { const i = form.tipos.indexOf(v); if (i >= 0) form.tipos.splice(i, 1); else form.tipos.push(v); $('#e-tipos').textContent = ''; renderFormChips(); break; }
    case 'f-bairro-rm': form.bairros = form.bairros.filter(b => b !== el.dataset.b); renderFormChips(); break;
    case 'f-quartos': form.quartos = +v; renderFormChips(); break;
    case 'f-vagas': form.vagas = +v; renderFormChips(); break;
    case 'f-sit': case 'f-mob': { const arr = a === 'f-sit' ? form.situacao : form.mobilia; const k = arr.indexOf(v); if (k >= 0) arr.splice(k, 1); else arr.push(v); renderFormChips(); break; }
    case 'f-origem': form.origem = form.origem === v ? '' : v; renderFormChips(); break;
    case 'f-save': saveForm(); break;
    case 'j8-fotos': baixarFotos(el, el.dataset.c); break;
    case 'j8-pdf': baixarPDF(el, el.dataset.c, el.dataset.cli); break;
    case 'j8-mais': ui.j8Mais[id] = (ui.j8Mais[id] || 5) + 5; renderFicha(id); break;
    case 'j8-desc': copiarDescritivo(el, el.dataset.c); break;
  }
});

// ── CAMPOS DA BUSCA ──
function bindProcurar() {
  const inp = $('#p-bairro');
  typeahead(inp, $('#p-bairro-dd'), { exclude: () => [], onPick: b => { setPBairro(b); inp.blur(); return false; } });
  inp.addEventListener('input', () => { if (ui.p.bairro && norm(inp.value) !== norm(ui.p.bairro)) { ui.p.bairro = ''; renderPTop(); renderPList(); } syncPInputs(); });
  $('#p-bairro-x').addEventListener('click', () => { setPBairro(''); inp.focus(); });
  $('#p-valor').addEventListener('input', e => { maskMoney(e.target); ui.p.valor = parseMoney(e.target.value); renderPList(); });
  $('#p-link').addEventListener('input', e => { ui.p.link = e.target.value.trim(); ui.sent = {}; renderPList(); });
  $('#b-q').addEventListener('input', e => { ui.b.q = e.target.value; renderBairros(); });
  $('#c-q').addEventListener('input', e => { ui.c.q = e.target.value; renderClientes(); });
}

// ── ENTRADA ──
function startApp() {
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  bindProcurar();
  clientes = applyPending(lsGet(LS_CACHE, []).map(cleanClient));
  renderAll();
  refresh();
  loadJ8();
}
$('#lg-form').addEventListener('submit', e => {
  e.preventDefault();
  if ($('#lg-pass').value === SENHA) { lsSet(LS_AUTH, true); startApp(); }
  else { $('#lg-err').textContent = 'Senha incorreta.'; $('#lg-pass').select(); }
});
if (TESTE) $('#teste-bar').classList.remove('hidden');
if (lsGet(LS_AUTH, false) === true) startApp();
else { $('#login').classList.remove('hidden'); setTimeout(() => $('#lg-pass').focus(), 50); }
</script>
