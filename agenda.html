<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Agenda Nickel</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .ag-header { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; background:var(--bg2); border-bottom:1px solid var(--border); gap:12px; flex-wrap:wrap; }
    .ag-header-left { display:flex; align-items:center; gap:10px; }
    .ag-title { font-size:16px; font-weight:800; color:var(--text); }
    .ag-user { font-size:12px; color:var(--text-muted); }
    .ag-logout { background:none; border:1px solid var(--border); border-radius:7px; color:var(--text-muted); font-size:12px; padding:5px 10px; cursor:pointer; }
    .ag-main { max-width:900px; margin:0 auto; padding:16px 12px; }
    .ag-new-btn { display:flex; align-items:center; gap:8px; background:#6495ed; color:#fff; border:none; border-radius:10px; padding:11px 20px; font-size:13px; font-weight:700; cursor:pointer; margin-bottom:20px; }
    .ag-controls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
    .ag-view-group { display:flex; background:var(--bg3); border-radius:8px; padding:3px; gap:2px; }
    .ag-view-btn { padding:5px 14px; border-radius:6px; border:none; cursor:pointer; font-size:12px; font-weight:600; background:transparent; color:var(--text-muted); transition:background .15s; }
    .ag-view-btn.active { background:#6495ed; color:#fff; }
    .ag-nav { display:flex; align-items:center; gap:6px; }
    .ag-nav-btn { width:30px; height:30px; border-radius:7px; border:1px solid var(--border); background:var(--bg3); color:var(--text); cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; }
    .ag-nav-label { font-size:12px; font-weight:600; color:var(--text); min-width:110px; text-align:center; }
    .ag-filter { background:var(--bg3); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:12px; padding:6px 10px; outline:none; }
    .ag-cal-week { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
    .ag-day-col { border-radius:10px; background:var(--bg3); border:1px solid var(--border); padding:8px 6px; min-height:100px; }
    .ag-day-col.today { background:rgba(100,149,237,0.06); border-color:rgba(100,149,237,0.4); }
    .ag-day-head { text-align:center; margin-bottom:6px; }
    .ag-day-name { font-size:10px; font-weight:700; letter-spacing:.5px; color:var(--text-muted); text-transform:uppercase; }
    .ag-day-num { font-size:16px; font-weight:600; color:var(--text); line-height:1.1; }
    .ag-day-col.today .ag-day-num { font-size:18px; font-weight:800; color:#6495ed; }
    .ag-day-col.past .ag-day-name, .ag-day-col.past .ag-day-num { color:var(--text-muted); }
    .ag-pill { display:flex; align-items:center; gap:4px; padding:4px 7px; border-radius:6px; margin-bottom:3px; cursor:pointer; border-left:2px solid; overflow:hidden; transition:opacity .15s; }
    .ag-pill:hover { opacity:.8; }
    .ag-pill-badge { font-size:9px; font-weight:800; flex-shrink:0; }
    .ag-pill-time { font-size:10px; font-weight:700; color:var(--text); flex-shrink:0; }
    .ag-pill-name { font-size:10px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
    .ag-more { font-size:10px; color:var(--text-muted); text-align:center; cursor:pointer; margin-top:2px; }
    .ag-cal-month { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
    .ag-month-head { font-size:10px; font-weight:700; color:var(--text-muted); text-align:center; padding:4px 0; letter-spacing:.5px; text-transform:uppercase; }
    .ag-month-day { min-height:56px; border-radius:8px; background:var(--bg3); border:1px solid transparent; padding:4px; cursor:pointer; }
    .ag-month-day.today { background:rgba(100,149,237,0.08); border-color:rgba(100,149,237,0.4); }
    .ag-month-day-num { font-size:11px; font-weight:500; color:var(--text); text-align:center; margin-bottom:2px; }
    .ag-month-day.today .ag-month-day-num { font-weight:800; color:#6495ed; }
    .ag-month-day.past .ag-month-day-num { color:var(--text-muted); }
    .ag-month-pill { font-size:9px; border-radius:4px; padding:1px 4px; margin-bottom:2px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ag-day-view { display:flex; flex-direction:column; gap:8px; }
    .ag-day-event { display:flex; align-items:flex-start; gap:12px; padding:12px 14px; border-radius:10px; border-left:3px solid; cursor:pointer; transition:opacity .15s; }
    .ag-day-event:hover { opacity:.85; }
    .ag-day-event-left { display:flex; flex-direction:column; align-items:center; min-width:44px; }
    .ag-day-event-type { font-size:9px; font-weight:800; letter-spacing:.5px; }
    .ag-day-event-time { font-size:16px; font-weight:700; color:var(--text); line-height:1.2; }
    .ag-day-event-name { font-size:13px; font-weight:600; color:var(--text); }
    .ag-day-event-agent { font-size:11px; color:var(--text-muted); margin-top:2px; }
    .ag-empty { text-align:center; padding:40px 0; color:var(--text-muted); font-size:13px; }
    @media(max-width:640px){
      .ag-header { padding:10px 14px; }
      .ag-controls { gap:6px; }
      .ag-cal-week { grid-template-columns:repeat(7,1fr); gap:2px; }
      .ag-day-col { padding:4px 2px; min-height:72px; }
      .ag-day-name { font-size:9px; }
      .ag-day-num { font-size:14px; }
      .ag-pill { padding:2px 3px; gap:2px; }
      .ag-pill-time { display:none; }
      .ag-pill-badge { font-size:8px; }
      .ag-pill-name { font-size:9px; }
      .ag-new-btn { width:100%; justify-content:center; border-radius:12px; padding:14px; font-size:14px; }
      .ag-nav-label { min-width:80px; font-size:11px; }
    }
  </style>
</head>
<body>
  <div class="ag-header">
    <div class="ag-header-left">
      <span style="font-size:22px">📅</span>
      <div>
        <div class="ag-title">Agenda Nickel</div>
        <div class="ag-user" id="ag-user-label"></div>
      </div>
    </div>
    <button class="ag-logout" id="ag-logout">Sair</button>
  </div>

  <div class="ag-main">
    <button class="ag-new-btn" id="ag-new-btn">＋ Novo compromisso</button>

    <div class="ag-controls">
      <div class="ag-view-group">
        <button class="ag-view-btn active" data-v="week">Semana</button>
        <button class="ag-view-btn" data-v="month">Mês</button>
        <button class="ag-view-btn" data-v="day">Dia</button>
      </div>
      <div class="ag-nav">
        <button class="ag-nav-btn" id="ag-prev">‹</button>
        <span class="ag-nav-label" id="ag-nav-label"></span>
        <button class="ag-nav-btn" id="ag-next">›</button>
      </div>
      <select class="ag-filter" id="ag-filter-agent" style="display:none">
        <option value="">Todos os corretores</option>
      </select>
      <select class="ag-filter" id="ag-filter-type">
        <option value="">Todos os tipos</option>
        <option value="angariacao">Angariação</option>
        <option value="venda">Venda</option>
        <option value="fotos">Fotos</option>
      </select>
    </div>

    <div id="ag-calendar"></div>
  </div>

  <script type="module" src="agenda.js"></script>
  <script>
    document.addEventListener('click', e => {
      const btn = e.target.closest('.card-toggle');
      if (!btn) return;
      const body = document.getElementById(btn.dataset.target);
      if (!body) return;
      const open = body.style.display === 'none';
      body.style.display = open ? 'block' : 'none';
    });
  </script>
</body>
</html>
