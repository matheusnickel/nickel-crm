<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1530">
<title>Book do imóvel · Matheus Nickel</title>
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
@page { size: 1280px 720px; margin: 0; }
:root{
  --navy:#0a1530; --deep:#060c1c; --ivory:#f5f3ee; --paper:#fbfaf7; --ink:#101a33; --stone:#6f7686; --mist:#a9afbd;
  --line:rgba(10,21,48,.12); --or:#ff5a1f; --or2:#ff8a3d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#1d2130}
body{font-family:'Geist',system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.mono{font-family:'Geist Mono',ui-monospace,monospace}

/* barra de ações (só na tela) */
.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;background:rgba(10,21,48,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
.bar .back{color:#c9d1e6;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.bar .ref{font:600 12px 'Geist Mono',monospace;letter-spacing:.12em;color:#8d9bbb;margin:0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;border:none;font:700 14px 'Geist',sans-serif;padding:10px 16px;border-radius:10px;cursor:pointer;white-space:nowrap}
.hint{color:#8d9bbb;font-size:13px;text-align:center;padding:10px 16px 0}
.wrap{display:flex;flex-direction:column;align-items:center;gap:18px;padding:18px 16px 40px}
.sc{position:relative;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.45);border-radius:4px}
.msg{color:#c9d1e6;text-align:center;padding:80px 20px;font-size:16px;line-height:1.5}

/* páginas */
.pg{width:1280px;height:720px;position:relative;overflow:hidden;background:var(--ivory);transform-origin:top left;break-after:page;page-break-after:always}
.pg img{display:block;width:100%;height:100%;object-fit:cover}
.lbl{font:600 12.5px 'Geist Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--or)}
.mk{display:flex;align-items:center;gap:12px;font:600 13px 'Geist Mono',monospace;letter-spacing:.28em;color:#fff}
.mk i{width:8px;height:8px;background:var(--or);transform:rotate(45deg);display:inline-block}
.mk.dark{color:var(--navy)}
.foot{position:absolute;left:64px;right:64px;bottom:30px;display:flex;justify-content:space-between;font:500 11.5px 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--mist)}

/* 1 · capa */
.capa .ph{position:absolute;inset:0}
.capa .veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,12,28,.88) 0%,rgba(6,12,28,.55) 38%,rgba(6,12,28,.05) 72%),linear-gradient(0deg,rgba(6,12,28,.55) 0%,transparent 45%)}
.capa .mk{position:absolute;top:56px;left:72px}
.capa .cb{position:absolute;left:72px;bottom:72px;color:#fff;max-width:640px}
.capa .cb .lbl{color:var(--or2)}
.capa h1{font-weight:300;font-size:78px;letter-spacing:-.04em;line-height:1;margin:18px 0 22px;text-wrap:balance}
.capa .sp{font-size:20px;font-weight:400;color:#dfe4f0;letter-spacing:.01em}
.capa .rule{width:56px;height:2px;background:linear-gradient(90deg,var(--or),var(--or2));margin:26px 0 18px}
.capa .pr{font-size:30px;font-weight:500;letter-spacing:-.01em}
.capa .para{position:absolute;right:72px;bottom:76px;text-align:right;color:#fff}
.capa .para small{display:block;font:600 11.5px 'Geist Mono',monospace;letter-spacing:.22em;text-transform:uppercase;color:#c9d1e6;margin-bottom:6px}
.capa .para b{font-weight:400;font-size:24px;letter-spacing:-.01em}

/* 2 · o imóvel */
.vg{display:grid;grid-template-columns:600px 1fr;height:100%}
.vg .tx{padding:64px 72px 64px 64px;display:flex;flex-direction:column;background:var(--paper)}
.vg h2{font-weight:300;font-size:40px;letter-spacing:-.035em;line-height:1.08;color:var(--navy);margin:16px 0 18px;text-wrap:balance}
.vg .intro{font-size:16.5px;line-height:1.65;color:#3a4256;max-width:52ch}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 18px;margin-top:auto;padding-top:26px;border-top:1px solid var(--line)}
.nums b{display:block;font-weight:300;font-size:34px;letter-spacing:-.03em;color:var(--navy);line-height:1}
.nums b small{font-size:17px;margin-left:3px;color:var(--stone)}
.nums span{display:block;font:500 11px 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--stone);margin-top:8px}
.vals{display:flex;gap:36px;margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
.vals div span{display:block;font:500 11px 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--stone)}
.vals div b{display:block;font-weight:500;font-size:20px;color:var(--navy);margin-top:5px}
.vals div:first-child b{font-size:24px}

/* 3 e 5 · galerias */
.g3{position:absolute;inset:40px 40px 72px;display:grid;gap:12px}
.g3.a{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}
.g3.a > :first-child{grid-row:1 / 3}
.g3.b{grid-template-columns:1fr 1fr 1fr}
.g3.c{grid-template-columns:1fr 1fr}
.g3 > div{overflow:hidden;background:#dcd8cf}

/* 4 · destaques */
.dg{display:grid;grid-template-columns:1fr 520px;height:100%}
.dg .tx{padding:64px 56px 64px 72px;display:flex;flex-direction:column;background:var(--paper)}
.dg h2{font-weight:300;font-size:40px;letter-spacing:-.035em;color:var(--navy);margin:16px 0 28px}
.dl{list-style:none;display:grid;grid-template-columns:1fr;gap:13px 34px}
.dl.two{grid-template-columns:1fr 1fr}
.dl li{position:relative;padding-left:22px;font-size:16px;line-height:1.45;color:#2c3448}
.sobre{display:flex;flex-direction:column;gap:14px;max-width:62ch}
.sobre p{font-size:16px;line-height:1.7;color:#3a4256}
.sobre.curto p{font-size:21px;font-weight:300;line-height:1.6;color:var(--navy)}
.dl li::before{content:'';position:absolute;left:0;top:.72em;width:11px;height:1.5px;background:var(--or)}

/* 6 · fechamento */
.fg{display:grid;grid-template-columns:1fr 560px;height:100%}
.fg .tx{background:var(--navy);color:#fff;padding:64px 72px;display:flex;flex-direction:column;position:relative}
.fg .tx::after{content:'';position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;border:1.5px solid rgba(255,255,255,.07)}
.fg .lbl{color:var(--or2)}
.fg h2{font-weight:300;font-size:56px;letter-spacing:-.045em;line-height:1;margin:22px 0 10px}
.fg .cargo{color:#aeb7cc;font-size:17px}
.fg .ct{margin-top:38px;display:flex;flex-direction:column;gap:12px;font-size:17px;color:#e3e7f1}
.fg .ct span{display:block;font:500 11px 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#7f8aa6;margin-bottom:3px}
.fg .nota{margin-top:auto;font-size:12.5px;line-height:1.6;color:#8d97b0;border-top:1px solid rgba(255,255,255,.1);padding-top:18px}

@media print{
  html,body{background:none}
  .bar,.hint{display:none!important}
  .wrap{display:block;padding:0}
  .sc{width:auto!important;height:auto!important;box-shadow:none;border-radius:0;overflow:visible}
  .pg{transform:none!important}
}
</style>
</head>
<body>
<div class="bar">
  <a class="back" href="carteira.html" id="back">← Carteira</a>
  <span class="ref" id="ref">BOOK DO IMÓVEL</span>
  <button id="pdf" disabled>Baixar PDF</button>
</div>
<div class="hint" id="hint">Na janela que abrir, escolha “Salvar como PDF”. No iPhone, toque em Compartilhar e depois em “Salvar em Arquivos”.</div>
<div class="wrap" id="wrap"><div class="msg">Montando o book…</div></div>

<script>
'use strict';
// Seus dados de contato na última página (o que ficar vazio não aparece)
const CONTATO = { nome: 'Matheus Nickel', cargo: 'Corretor de imóveis', whatsapp: '', instagram: '', creci: '' };

const ROTULO = {
  'APARTAMENTO': 'Apartamento', 'APARTAMENTO GARDEN': 'Apartamento garden', 'COBERTURA': 'Cobertura', 'CASA': 'Casa',
  'CASA CONDOMINIO FECHADO': 'Casa em condomínio', 'SOBRADO': 'Sobrado', 'SOBRADO CONDOMINIO FECHADO': 'Sobrado em condomínio',
  'TERRENO': 'Terreno', 'TERRENO CONDOMINIO FECHADO': 'Terreno em condomínio', 'CONJUNTO/COMERCIAL/LOJA': 'Imóvel comercial'
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = v => 'R$ ' + Math.round(v).toLocaleString('pt-BR');
const plural = (n, s, p) => n === 1 ? s : p;
const nb = n => Number(n).toLocaleString('pt-BR');
const prep = b => /^(vila|cidade|alameda)\b/i.test(b) ? 'na' : 'no';
// nomes de empreendimento vêm em CAIXA ALTA às vezes: deixa em "Título"
const titulo = s => /[a-zà-ú]/.test(s) ? s : s.toLowerCase().replace(/(^|\s)(\S)/g, (m, a, b) => a + b.toUpperCase());

const qs = new URLSearchParams(location.search);
const cod = (qs.get('c') || '').replace(/\D/g, '');
const para = (qs.get('n') || '').trim().slice(0, 40);
if (document.referrer && new URL(document.referrer).pathname.endsWith('carteira.html')) {
  $('back').href = document.referrer; $('back').addEventListener('click', e => { e.preventDefault(); history.back(); });
}
function $(id) { return document.getElementById(id); }

async function monta() {
  if (!cod) { $('wrap').innerHTML = '<div class="msg">Imóvel não informado.</div>'; return; }
  let d;
  try { const r = await fetch(`dados/j8/${cod}.json`, { cache: 'no-cache' }); if (!r.ok) throw 0; d = await r.json(); }
  catch (e) { $('wrap').innerHTML = '<div class="msg">O book deste imóvel ainda não está pronto.<br>Ele é preparado na atualização diária do estoque.</div>'; return; }

  const tipo = ROTULO[d.t] || 'Imóvel';
  const ehTerreno = /TERRENO|COMERCIAL/.test(d.t);
  const nome = d.e ? titulo(d.e) : tipo;
  const local = `${tipo} ${prep(d.b)} ${d.b}`;
  const fotos = (d.fotos || []).slice(0, 10);
  let k = 0;
  const pega = n => { if (fotos.length - k < n) return null; const r = fotos.slice(k, k + n); k += n; return r; };
  const img = u => `<img src="${esc(u)}" alt="" loading="eager" decoding="async">`;
  const quartos = ehTerreno ? '' : d.s && d.s === d.q ? `${d.s} ${plural(d.s, 'suíte', 'suítes')}` : d.q ? `${d.q} ${plural(d.q, 'quarto', 'quartos')}` + (d.s ? ` · ${d.s} ${plural(d.s, 'suíte', 'suítes')}` : '') : '';
  const specs = [d.a ? nb(d.a) + ' m²' : '', quartos, !ehTerreno && d.v ? `${d.v} ${plural(d.v, 'vaga', 'vagas')}` : ''].filter(Boolean).join('  ·  ');
  const preco = d.p ? brl(d.p) : 'Valor sob consulta';
  const marca = (dark) => `<div class="mk${dark ? ' dark' : ''}"><i></i>${esc(CONTATO.nome.toUpperCase())}</div>`;
  const rodape = n => `<div class="foot"><span>${esc(nome)} · ${esc(d.b)}</span><span>${esc(CONTATO.nome)} · ${n}</span></div>`;
  const pags = [];

  // 1 · capa
  const capaF = pega(1) || [''];
  pags.push(`<section class="pg capa"><div class="ph">${capaF[0] ? img(capaF[0]) : ''}</div><div class="veil"></div>${marca()}
    <div class="cb"><div class="lbl">${esc(d.e ? local : tipo)}</div><h1>${esc(d.e ? nome : d.b)}</h1><div class="sp">${esc(specs)}</div><div class="rule"></div><div class="pr">${esc(preco)}</div></div>
    ${para ? `<div class="para"><small>Seleção para</small><b>${esc(para)}</b></div>` : ''}</section>`);

  // 2 · o imóvel
  const nums = [
    d.a ? [nb(d.a), 'm²', ehTerreno ? 'Área' : 'Área privativa'] : null,
    d.at && d.at > d.a ? [nb(d.at), 'm²', 'Terreno'] : null,
    !ehTerreno && d.q ? [d.q, '', plural(d.q, 'Quarto', 'Quartos')] : null,
    !ehTerreno && d.s ? [d.s, '', plural(d.s, 'Suíte', 'Suítes')] : null,
    !ehTerreno && d.v ? [d.v, '', plural(d.v, 'Vaga', 'Vagas')] : null,
    !ehTerreno && d.bh ? [d.bh, '', plural(d.bh, 'Banheiro', 'Banheiros')] : null,
    d.ano && d.ano > 1900 && d.ano <= new Date().getFullYear() + 5 ? [d.ano, '', d.ano > new Date().getFullYear() ? 'Entrega' : 'Construção'] : null
  ].filter(Boolean).slice(0, 6);
  const f2 = pega(1);
  pags.push(`<section class="pg"><div class="vg"><div>${f2 ? img(f2[0]) : capaF[0] ? img(capaF[0]) : ''}</div>
    <div class="tx"><div class="lbl">O imóvel</div><h2>${esc(local)}</h2>${d.intro ? `<p class="intro">${esc(d.intro)}</p>` : ''}
      <div class="nums">${nums.map(([v, u, l]) => `<div><b>${esc(v)}${u ? `<small>${u}</small>` : ''}</b><span>${esc(l)}</span></div>`).join('')}</div>
      <div class="vals"><div><span>Valor</span><b>${esc(preco)}</b></div>${d.cond ? `<div><span>Condomínio</span><b>${brl(d.cond)}</b></div>` : ''}${d.iptu ? `<div><span>IPTU</span><b>${brl(d.iptu)}</b></div>` : ''}</div>
    </div></div></section>`);

  // 3 · galeria
  const g1 = pega(3) || pega(2);
  if (g1) pags.push(`<section class="pg"><div class="g3 ${g1.length === 3 ? 'a' : 'c'}">${g1.map(u => `<div>${img(u)}</div>`).join('')}</div>${rodape('{n}')}</section>`);

  // 4 · destaques (lista do anúncio) ou, sem lista, "Sobre o imóvel" com o texto resumido
  const dl = (d.destaques || []).slice(0, 12), tx = d.texto || [];
  if (dl.length >= 3 || tx.length) {
    const f4 = pega(1);
    const corpo = dl.length >= 3
      ? `<div class="lbl">Destaques</div><h2>O que faz a diferença</h2><ul class="dl${dl.length > 6 ? ' two' : ''}">${dl.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`
      : `<div class="lbl">Sobre o imóvel</div><h2>${esc(nome)}</h2><div class="sobre${tx.join('').length < 450 ? ' curto' : ''}">${tx.map(p => `<p>${esc(p)}</p>`).join('')}</div>`;
    pags.push(`<section class="pg"><div class="dg" style="${f4 ? '' : 'grid-template-columns:1fr'}"><div class="tx">${corpo}</div>${f4 ? `<div>${img(f4[0])}</div>` : ''}</div></section>`);
  }

  // 5 · galeria
  const g2 = pega(3) || pega(2);
  if (g2) pags.push(`<section class="pg"><div class="g3 ${g2.length === 3 ? 'b' : 'c'}">${g2.map(u => `<div>${img(u)}</div>`).join('')}</div>${rodape('{n}')}</section>`);

  // 6 · fechamento (usa a próxima foto que sobrou, ou a capa)
  const ff = pega(1) || [fotos[fotos.length - 1] || capaF[0]];
  const ct = [CONTATO.whatsapp ? ['WhatsApp', CONTATO.whatsapp] : null, CONTATO.instagram ? ['Instagram', CONTATO.instagram] : null, CONTATO.creci ? ['CRECI', CONTATO.creci] : null].filter(Boolean);
  pags.push(`<section class="pg"><div class="fg"><div>${ff[0] ? img(ff[0]) : ''}</div><div class="tx">${marca()}
    <div style="margin-top:auto"><div class="lbl">Agende sua visita</div><h2>${esc(CONTATO.nome)}</h2><div class="cargo">${esc(CONTATO.cargo)}</div>
      ${ct.length ? `<div class="ct">${ct.map(([l, v]) => `<div><span>${l}</span>${esc(v)}</div>`).join('')}</div>` : ''}</div>
    <div class="nota" style="margin-top:40px">Imóvel em parceria com J8 Imóveis · Ref. ${esc(d.c)}<br>Fotos: J8 Imóveis. Valores e disponibilidade sujeitos a alteração.</div>
  </div></div></section>`);

  const total = pags.length;
  $('wrap').innerHTML = pags.map((p, i) => `<div class="sc">${p.replace('{n}', String(i + 1).padStart(2, '0') + ' / ' + String(total).padStart(2, '0'))}</div>`).join('');
  $('ref').textContent = `${local.toUpperCase()} · REF. ${d.c}`;
  document.title = `Book ${tipo} ${d.b} ${d.c} - ${CONTATO.nome}`;
  escala(); $('pdf').disabled = false;
  // ?pg=N mostra só uma página, sem barra (usado para gerar prévias)
  const so = Number(qs.get('pg'));
  if (so) {
    document.querySelectorAll('.sc').forEach((sc, i) => { if (i !== so - 1) sc.remove(); else { sc.style.width = '1280px'; sc.style.height = '720px'; sc.firstElementChild.style.transform = 'none'; sc.style.boxShadow = 'none'; sc.style.borderRadius = '0'; } });
    document.querySelector('.bar').remove(); $('hint').remove(); $('wrap').style.padding = '0';
    removeEventListener('resize', escala);
  }
}

function escala() {
  const s = Math.min(1, (document.documentElement.clientWidth - 32) / 1280);
  document.querySelectorAll('.sc').forEach(sc => { sc.style.width = 1280 * s + 'px'; sc.style.height = 720 * s + 'px'; sc.firstElementChild.style.transform = `scale(${s})`; });
}
addEventListener('resize', escala);

// espera todas as fotos carregarem antes de abrir o "Salvar como PDF"
$('pdf').addEventListener('click', async () => {
  const b = $('pdf'); b.disabled = true; b.textContent = 'Preparando…';
  await Promise.all([...document.images].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  b.disabled = false; b.textContent = 'Baixar PDF';
  print();
});
monta();
</script>
</body>
</html>
