<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nickel CRM — Gestor</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nickel CRM">
  <meta name="theme-color" content="#a8e63d">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <header class="app-header">
    <span class="logo">NICKEL CRM</span>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="user-info" id="gestor-name"></span>
      <button class="logout-btn" id="logout-btn">Sair</button>
    </div>
  </header>

  <main class="main-content wide">

    <!-- Filtro + Pickers (full width) -->
    <div class="filter-row">
      <button class="filter-btn" data-period="today">Hoje</button>
      <button class="filter-btn active" data-period="week">Semana</button>
      <button class="filter-btn" data-period="month">Mês</button>
    </div>
    <div class="form-group" id="week-picker-wrap" style="display:none;margin-bottom:16px">
      <label>Selecione a semana</label>
      <input type="week" id="week-picker">
    </div>
    <div class="form-group" id="month-picker-wrap" style="display:none;margin-bottom:16px">
      <label>Selecione o mês</label>
      <input type="month" id="month-picker">
    </div>

    <!-- Totais (full width) -->
    <div class="totals-grid">
      <div class="total-box">
        <div class="t-val" id="tot-prosp">0</div>
        <div class="t-lbl">PROSP</div>
      </div>
      <div class="total-box">
        <div class="t-val" id="tot-cpd">0</div>
        <div class="t-lbl">CP</div>
      </div>
      <div class="total-box">
        <div class="t-val" id="tot-doc">0</div>
        <div class="t-lbl">DOC</div>
      </div>
    </div>

    <!-- Linha 1: Ranking (2/3) + Ranking de Notas (1/3) -->
    <div class="g-row g-row-2-1">

      <div class="card">
        <div class="card-title">Ranking — ordenado por DOC · CP · PROSP</div>
        <div style="overflow-x:auto">
          <table class="data-table rank-table" style="width:100%">
            <colgroup>
              <col class="col-pos">
              <col class="col-name">
              <col class="col-vendas">
              <col class="col-doc">
              <col class="col-cpd">
              <col class="col-prosp">
            </colgroup>
            <thead>
              <tr>
                <th>#</th>
                <th>Angariador</th>
                <th class="num-cell" style="color:#a8e63d">VENDAS</th>
                <th class="num-cell doc-th">DOC</th>
                <th class="num-cell">CP</th>
                <th class="num-cell">PROSP</th>
              </tr>
            </thead>
            <tbody id="rank-body"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="card-title">⭐ Ranking de Notas</div>
        <div id="notas-ranking-wrap"></div>
      </div>

    </div>

    <!-- Linha 2: Conversão (largura total) -->
    <div class="g-row g-row-1-1">

      <canvas id="evolucao-chart" style="display:none"></canvas>

      <div class="card collapsible-card" style="grid-column:1/-1">
        <button class="card-title card-toggle" data-target="conv-body">
          Taxa de conversão <span class="toggle-arrow">▸</span>
        </button>
        <div class="card-body" id="conv-body" style="display:none">
          <div class="conv-mode-row">
            <button class="conv-mode-btn active" data-mode="prosp-cpd">PROSP → CP</button>
            <button class="conv-mode-btn" data-mode="cpd-doc">CP → DOC</button>
          </div>
          <div id="conv-list"></div>
        </div>
      </div>

    </div>

    <!-- Linha 3: DOCs (1/2) + CPDs (1/2) -->
    <div class="g-row g-row-1-1">

      <div class="card collapsible-card">
        <button class="card-title card-toggle" data-target="doc-list-body">
          DOCs registrados no período <span class="toggle-arrow">▸</span>
        </button>
        <div class="card-body" id="doc-list-body" style="display:none">
          <div id="doc-list-wrap"></div>
        </div>
      </div>

      <div class="card collapsible-card">
        <button class="card-title card-toggle" data-target="cpd-list-body">
          CPs — acompanhamento <span class="toggle-arrow">▸</span>
        </button>
        <div class="card-body" id="cpd-list-body" style="display:none">
          <div id="cpd-list-wrap"></div>
        </div>
      </div>

    </div>

    <!-- Linha 4: Análise DOCs (1/2) + Sequência (1/2) -->
    <div class="g-row g-row-1-1">

      <div class="card">
        <div class="card-title">Análise de DOCs</div>
        <div class="analytics-row">
          <button class="analytics-btn active" data-mode="tipo">Tipo</button>
          <button class="analytics-btn" data-mode="bairro">Bairro</button>
          <button class="analytics-btn" data-mode="valor">Valor total</button>
          <button class="analytics-btn" data-mode="ticket">Ticket médio</button>
        </div>
        <div class="chart-wrap" style="height:260px">
          <canvas id="tipo-chart"></canvas>
        </div>
        <div id="analytics-empty" class="empty-state" style="display:none">Nenhum DOC com dados registrado</div>
      </div>

      <div class="card">
        <div class="card-title">🔥 Sequência de envios — últimos 30 dias</div>
        <div id="timeline-wrap"></div>
      </div>

    </div>

    <!-- Linha 5: Novo lançamento (1/2) + Exportar + Consulta (1/2 empilhados) -->
    <div class="g-row g-row-1-1">

      <div class="card collapsible-card">
        <button class="card-title card-toggle" data-target="lanc-body">
          Novo lançamento <span class="toggle-arrow">▸</span>
        </button>
        <div class="card-body" id="lanc-body" style="display:none">
        <form id="gestor-lanc-form">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
            <div class="form-group" style="margin-bottom:0">
              <label>Angariador</label>
              <select id="lanc-agent" required>
                <option value="">Selecione</option>
              </select>
            </div>
            <div class="form-group" style="margin-bottom:0">
              <label>Data</label>
              <input type="date" id="lanc-date" required>
            </div>
          </div>
          <div class="fields-row" style="margin-bottom:10px">
            <div class="field-box"><label>PROSP<span class="field-hint">(Prospecção)</span></label><input type="number" id="lanc-prosp" min="0" value="0"></div>
            <div class="field-box"><label>CP<span class="field-hint">(Nova conversa com o proprietário)</span></label><input type="number" id="lanc-cpd" min="0" value="0"></div>
            <div class="field-box"><label>DOC<span class="field-hint">(Pegou Documentação)</span></label><input type="number" id="lanc-doc" min="0" value="0"></div>
          </div>
          <div class="fields-row" style="margin-bottom:14px">
            <div class="field-box"><label style="color:#e879f9">VÍDEO<span class="field-hint">(IG, TikTok…)</span></label><input type="number" id="lanc-video" min="0" value="0"></div>
          </div>
          <div id="lanc-cpd-details"></div>
          <div id="lanc-doc-details"></div>
          <button type="submit" class="btn">Salvar lançamento</button>
        </form>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:16px">

        <div class="card" style="margin-bottom:0">
          <div class="card-title">Exportar relatório</div>
          <div class="export-row">
            <button class="export-btn" data-period="today">Hoje</button>
            <button class="export-btn" data-period="week">Semana</button>
            <button class="export-btn" data-period="month">Mês</button>
          </div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:8px">Abre uma nova aba — use "Imprimir" do navegador para salvar como PDF.</div>
        </div>

        <div class="card collapsible-card" style="margin-bottom:0">
          <button class="card-title card-toggle" data-target="day-view-body">
            Consulta por dia <span class="toggle-arrow">▸</span>
          </button>
          <div class="card-body" id="day-view-body" style="display:none">
            <div class="form-group" style="margin-bottom:14px;margin-top:4px">
              <label>Selecione o dia</label>
              <input type="date" id="day-input">
            </div>
            <div id="day-view-wrap"></div>
          </div>
        </div>

      </div>

    </div>

    <!-- Vendas -->
    <div class="card collapsible-card">
      <button class="card-title card-toggle" data-target="vendas-body">
        💰 Registrar venda <span class="toggle-arrow">▸</span>
      </button>
      <div class="card-body" id="vendas-body" style="display:none">
        <form id="venda-form" style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:16px">
          <div class="form-group" style="margin:0">
            <label>Angariador</label>
            <select id="venda-agent" required><option value="">Selecione</option></select>
          </div>
          <div class="form-group" style="margin:0">
            <label>Data</label>
            <input type="date" id="venda-date" required>
          </div>
          <div class="form-group" style="margin:0">
            <label>Valor (R$)</label>
            <input type="number" id="venda-value" min="1" step="1" placeholder="3000000" required>
          </div>
          <button type="submit" class="btn" style="padding:12px 16px;white-space:nowrap">+ Registrar</button>
        </form>
        <div id="venda-list"></div>
      </div>
    </div>

    <!-- Linha 6: Oferta Ativa + Equipe (colapsáveis, full width) -->
    <div class="card collapsible-card" id="oferta-card">
      <button class="card-title card-toggle" data-target="oferta-body">
        🏹 Oferta Ativa Semanal <span class="toggle-arrow">▸</span>
      </button>
      <div class="card-body" id="oferta-body" style="display:none">
        <div id="oferta-wrap"></div>
      </div>
    </div>

    <div class="card collapsible-card" id="team-mgmt">
      <button class="card-title card-toggle" data-target="team-body">
        Equipe — adicionar / remover <span class="toggle-arrow">▸</span>
      </button>
      <div class="card-body" id="team-body" style="display:none">
        <div id="team-list" style="margin-bottom:16px"></div>
        <form id="add-agent-form" style="display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end">
          <div class="form-group" style="margin:0">
            <label>Nome</label>
            <input type="text" id="new-agent-name" placeholder="Ex: Lucas" required>
          </div>
          <div class="form-group" style="margin:0">
            <label>Senha</label>
            <input type="text" id="new-agent-pass" placeholder="nickel123">
          </div>
          <button type="submit" class="btn" style="padding:12px 16px;white-space:nowrap">+ Adicionar</button>
        </form>
      </div>
    </div>

  </main>

  <script type="module" src="app.js"></script>
  <script>
    document.addEventListener('click', e => {
      const btn = e.target.closest('.card-toggle');
      if (!btn) return;
      const body = document.getElementById(btn.dataset.target);
      if (!body) return;
      const card = btn.closest('.collapsible-card');
      const open = body.style.display === 'none';
      body.style.display = open ? 'block' : 'none';
      card.classList.toggle('open', open);
    });
  </script>
</body>
</html>
