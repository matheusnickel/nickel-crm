<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>Seleção exclusiva</title>
<meta property="og:title" content="Seleção exclusiva de imóvel">
<meta property="og:description" content="Fotos, ficha técnica e valor do imóvel selecionado para você.">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<!--
  Página do imóvel para o cliente (19/11, pedido do Matheus: "uma landpage além do book do imóvel").
  O link (imovel.html?l=<id>) é criado na Carteira ("Link para cliente"): lá fica gravada uma foto do imóvel naquele
  momento (título, ficha, diferenciais, fotos, para quem é e quem assina). Esta página só lê isso — não mostra
  imobiliária, link do anúncio nem complemento — e anota no próprio link a hora em que o cliente abriu
  (19/11, pedido dele: "mais completo": ficha completa, valor do condomínio e endereço com "Ver no mapa" — rua e
  número, como no book. Texto do anúncio da imobiliária e IPTU NÃO entram, também pedido dele)
  (a Carteira mostra "abriu o link"). Quem está logado na Carteira neste aparelho vê como prévia, sem contar abertura.
  1ª letra do id: m = Matheus, f = Felipe Moreira; &t=1 = base de teste.
-->
<style>
:root{
  --bg:#ffffff; --bg2:#f5f5f3; --line:rgba(40,42,46,.09); --line2:rgba(40,42,46,.16);
  --text:#2c2e33; --text2:#55585e; --muted:#8a8a8a;
  --or:#e0662c; --or2:#b8521f; --orbg:#fcece2;
  --wa:#1f9e57; --wa-h:#188a4a;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font:400 16px/1.6 'Open Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.hidden{display:none!important}

.top{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 16px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.top i{width:7px;height:7px;background:var(--or);transform:rotate(45deg);flex-shrink:0}
.top b{font-weight:700}

.hero{position:relative;max-width:1180px;margin:0 auto}
.hero img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--bg2)}
.hero .vf{position:absolute;right:16px;bottom:16px;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:99px;background:rgba(255,255,255,.94);font-size:13.5px;font-weight:600;box-shadow:0 4px 16px -6px rgba(0,0,0,.35)}
.hero .vf svg{width:17px;height:17px}

.wrap{max-width:820px;margin:0 auto;padding:0 20px}
.intro{padding:30px 0 6px;display:flex;flex-direction:column;gap:6px}
.kick{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--or);font-weight:600}
.para{font-size:15px;color:var(--text2)}
h1{font-size:clamp(30px,7vw,44px);line-height:1.12;font-weight:300;letter-spacing:-.01em;margin-top:10px;text-wrap:balance}
.sub{font-size:15px;color:var(--muted)}
.preco{display:flex;flex-direction:column;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.preco small{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.preco b{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.vals{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:12px;font-size:16px;font-variant-numeric:tabular-nums}
.vals span{display:flex;flex-direction:column}
.vals small{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.desc{display:flex;flex-direction:column;gap:12px;font-size:16px;line-height:1.7;color:var(--text2);max-width:66ch}
.loc{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:16px 18px;border:1px solid var(--line2);border-radius:10px}
.loc div{display:flex;flex-direction:column;min-width:0}
.loc b{font-size:16.5px;font-weight:600}
.loc span{font-size:14px;color:var(--muted)}
.loc .mapa{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:99px;border:1px solid var(--line2);font-size:14px;font-weight:600;white-space:nowrap}
.loc .mapa:hover{border-color:var(--or);color:var(--or2)}
.loc .mapa svg{width:17px;height:17px}
.texto{margin-top:20px;font-size:17px;line-height:1.65;color:var(--text2);max-width:62ch}

.sec{padding:34px 0 0}
.sec h2{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--or);font-weight:600;margin-bottom:14px}
.ficha{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}
.ficha div{display:flex;flex-direction:column;padding:12px 0;border-bottom:1px solid var(--line)}
.ficha span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ficha b{font-size:20px;font-weight:400;font-variant-numeric:tabular-nums}
.difs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 24px;list-style:none}
.difs li{position:relative;padding-left:16px;font-size:15.5px}
.difs li::before{content:'';position:absolute;left:1px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--or)}
.cond{font-size:15.5px;color:var(--text2)}

.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.gal button{display:block;aspect-ratio:4/3;overflow:hidden;background:var(--bg2);border-radius:4px}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.gal button:hover img{transform:scale(1.03)}

.corr{margin:40px 0 0;padding:26px 0 30px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:4px}
.corr .nm{font-size:13px;letter-spacing:.24em;text-transform:uppercase;font-weight:700}
.corr .cg{font-size:14px;color:var(--muted)}
.corr .ig{font-size:14.5px;color:var(--text2);margin-top:6px}
.corr .ig:hover{color:var(--or2)}
.aviso{font-size:12.5px;color:var(--muted);padding-bottom:30px}

.cta{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.cta a{display:flex;align-items:center;justify-content:center;gap:10px;max-width:520px;margin:0 auto;height:52px;border-radius:12px;background:var(--wa);color:#fff;font-weight:600;font-size:16px}
.cta a:hover{background:var(--wa-h)}
.cta svg{width:21px;height:21px}

.prev{position:sticky;top:0;z-index:30;padding:8px 16px;text-align:center;font-size:13px;background:var(--orbg);color:var(--or2);font-weight:600}

.msg{max-width:520px;margin:18vh auto 0;padding:0 20px;text-align:center;display:flex;flex-direction:column;gap:10px}
.msg h1{margin:0;font-size:28px}
.msg p{color:var(--muted)}
.load{display:flex;justify-content:center;padding:30vh 0}
.load i{width:9px;height:9px;background:var(--or);transform:rotate(45deg);animation:pulsa 1s ease-in-out infinite}
@keyframes pulsa{50%{opacity:.25}}

/* fotos em tela cheia */
.lb{position:fixed;inset:0;z-index:50;background:#0d0d0e;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.lb img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.lb .x,.lb .ar{position:absolute;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(255,255,255,.12);border-radius:50%}
.lb .x{top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:42px;height:42px;font-size:26px;line-height:1}
.lb .ar{top:50%;transform:translateY(-50%);width:46px;height:46px}
.lb .ar svg{width:22px;height:22px}
.lb .ar.p{left:14px}.lb .ar.n{right:14px}
.lb .ct{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));text-align:center;color:rgba(255,255,255,.75);font-size:13.5px;font-variant-numeric:tabular-nums}

@media (min-width:760px){
  .hero{padding:24px 24px 0}
  .hero img{aspect-ratio:16/9;max-height:72vh;border-radius:6px}
  .hero .vf{right:40px;bottom:18px}
  .intro{padding-top:40px}
  .ficha{grid-template-columns:repeat(4,minmax(0,1fr))}
  .difs{grid-template-columns:repeat(3,minmax(0,1fr))}
  .gal{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
}
@media (max-width:420px){.lb .ar{display:none}}
</style>
</head>
<body>
<div id="app"><div class="load"><i></i></div></div>
<script>
const FB_KEY = 'AIzaSyAV1IBBj0usYroywP0i-SLFSHVJh8_S2-g';
const FB_ROOT = 'https://firestore.googleapis.com/v1/projects/nickel-crm/databases/(default)/documents';
const COLS = { m: 'carteira_links', f: 'carteira_links_felipe', g: 'carteira_links_gabriel' };
const q = new URLSearchParams(location.search), ID = (q.get('l') || '').replace(/[^a-z0-9]/gi, '');
const COL = (COLS[ID[0]] || '') + (q.get('t') === '1' ? '_TESTE_CLAUDE' : '');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function fromFs(v) {
  if (!v) return null;
  if ('stringValue' in v) return v.stringValue;
  if ('integerValue' in v) return Number(v.integerValue);
  if ('doubleValue' in v) return v.doubleValue;
  if ('booleanValue' in v) return v.booleanValue;
  if ('nullValue' in v) return null;
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(fromFs);
  if ('mapValue' in v) { const o = {}, f = v.mapValue.fields || {}; for (const k in f) o[k] = fromFs(f[k]); return o; }
  return null;
}
// fotos pelo mesmo serviço do book (tamanho certo para a tela, sem baixar o original)
const foto = (u, w, h) => 'https://images.weserv.nl/?url=' + encodeURIComponent(String(u).replace(/^https?:\/\//, '')) + (h ? `&w=${w}&h=${h}&fit=cover` : `&w=${w}&h=${w}&fit=inside`) + '&q=80&output=jpg';
const WA = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.5-.3z"/></svg>';
const SETA = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
const ICON_FOTOS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>';
const PINO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
const reais = v => 'R$ ' + Math.round(v).toLocaleString('pt-BR');
const primeiro = s => String(s || '').trim().split(/\s+/)[0] || '';
// quem está logado na Carteira neste aparelho (o próprio corretor conferindo o link): prévia, não conta como abertura
const PREVIA = (() => { try { return !!localStorage.getItem('carteira_auth'); } catch (e) { return false; } })();

let L = null, atual = 0;

// 23/11: com a cota de leitura do Firebase estourada (429) o cliente via "link não está mais disponível". Gravar tem cota
// separada, e a gravação devolve o documento: marca um campo sem importância (só se o link existir) e usa a resposta.
async function leDoc(col, id, campo) {
  const url = `${FB_ROOT}/${col}/${id}?key=${FB_KEY}`, masc = campo ? '&mask.fieldPaths=' + campo : '';
  let r = null; try { r = await fetch(url + masc); } catch (e) {}
  if (r && (r.ok || r.status === 404)) return r;
  return fetch(url + masc + '&updateMask.fieldPaths=lidoEm&currentDocument.exists=true', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields: { lidoEm: { stringValue: new Date().toISOString() } } }) });
}
async function carrega() {
  if (!ID || !COL.startsWith('carteira_')) return erro();
  try {
    const r = await leDoc(COL, ID);
    if (!r.ok) return erro(r.status !== 404); // só diz que o link acabou quando ele não existe mesmo
    const d = await r.json();
    L = fromFs({ mapValue: { fields: d.fields || {} } });
    if (!L || !L.titulo) return erro();
    await fotosNickel();
    desenha();
    anotaAbertura(L.vistos || [], L.aberturas || []);
  } catch (e) { erro(true); }
}
// 20/11: imóveis Nickel (do próprio Matheus) guardam as fotos no Firebase ("nf:<id>"): m = 720 px (galeria), g = 1600 px
// (capa e tela cheia). As outras continuam vindo do anúncio pelo serviço de imagens.
const NF_COL = 'nickel_fotos' + (q.get('t') === '1' ? '_TESTE_CLAUDE' : '');
const NF = new Map(); // "nf:id:m" / "nf:id:g" -> data URL
function nfPega(ref, campo) {
  const k = ref + ':' + campo; if (NF.has(k)) return NF.get(k);
  const p = leDoc(NF_COL, ref.slice(3), campo).then(r => r.ok ? r.json() : null)
    .then(j => (j && j.fields && j.fields[campo] && j.fields[campo].stringValue) || '').catch(() => '');
  NF.set(k, p); return p;
}
async function fotosNickel() {
  const nf = (L.fotos || []).filter(u => /^nf:/.test(u)); if (!nf.length) return;
  const [capa] = await Promise.all([nfPega(nf[0], 'g'), ...nf.map(u => nfPega(u, 'm'))]);
  for (const u of nf) NF.set(u + ':m!', await nfPega(u, 'm'));
  NF.set(nf[0] + ':g!', capa);
}
// o endereço de cada foto no tamanho certo (nf: já carregada; as outras pelo serviço de imagens)
const src = (u, w, h) => /^nf:/.test(u) ? (w >= 1200 && NF.get(u + ':g!')) || NF.get(u + ':m!') || '' : foto(u, w, h);
function erro(rede) {
  document.title = 'Link indisponível';
  $('#app').innerHTML = `<div class="msg"><div class="kick">Seleção exclusiva</div><h1>${rede ? 'Não foi possível abrir agora' : 'Este link não está mais disponível'}</h1><p>${rede ? 'Tente de novo em alguns minutos.' : 'Peça um novo link ao seu corretor.'}</p></div>`;
}
// uma abertura por visita (recarregar a página não conta de novo).
// 19/11 (pergunta dele: "se encaminhou e outra pessoa abriu, consigo saber?"): não dá para saber QUEM abriu, então cada
// abertura guarda a hora, o tipo de aparelho (iPhone, Android, Windows…) e um número aleatório do aparelho, guardado só
// neste navegador. A Carteira mostra "aberto 4 vezes em 2 aparelhos": aparelho novo = encaminhado ou aberto em outro lugar.
function aparelho() {
  let id = '';
  try { id = localStorage.getItem('nickel_ap') || ''; if (!id) { id = Math.random().toString(36).slice(2, 10); localStorage.setItem('nickel_ap', id); } }
  catch (e) { id = 'x' + Math.random().toString(36).slice(2, 9); }
  const ua = navigator.userAgent;
  const disp = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'iPad'
    : /Android/.test(ua) ? (/Mobile/.test(ua) ? 'Android' : 'Tablet Android') : /Windows/.test(ua) ? 'Windows' : /Macintosh/.test(ua) ? 'Mac' : /Linux/.test(ua) ? 'Linux' : 'Outro';
  return { ap: id, disp };
}
async function anotaAbertura(vistos, aberturas) {
  if (PREVIA) return;
  const chave = 'aberto_' + ID;
  try { if (sessionStorage.getItem(chave)) return; sessionStorage.setItem(chave, '1'); } catch (e) {}
  const agora = new Date().toISOString(), lista = vistos.concat([agora]).slice(-200);
  const ab = aberturas.concat([Object.assign({ em: agora }, aparelho())]).slice(-200);
  const mapa = o => ({ mapValue: { fields: { em: { stringValue: o.em || '' }, ap: { stringValue: o.ap || '' }, disp: { stringValue: o.disp || '' } } } });
  try {
    await fetch(`${FB_ROOT}/${COL}/${ID}?key=${FB_KEY}&updateMask.fieldPaths=vistos&updateMask.fieldPaths=aberturas&updateMask.fieldPaths=ultimaVez&currentDocument.exists=true`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' }, keepalive: true,
      body: JSON.stringify({ fields: { vistos: { arrayValue: { values: lista.map(s => ({ stringValue: s })) } }, aberturas: { arrayValue: { values: ab.map(mapa) } }, ultimaVez: { stringValue: agora } } })
    });
  } catch (e) {}
}

function desenha() {
  const c = L.corretor || {}, fotos = L.fotos || [];
  document.title = L.titulo;
  const zap = String(c.whats || '').replace(/\D/g, '');
  const msg = `Olá, ${primeiro(c.nome ? c.nome.charAt(0) + c.nome.slice(1).toLowerCase() : '')}! Vi o imóvel ${L.titulo} (${L.sub}) e quero conversar sobre ele.`;
  const ig = String(c.insta || '').replace(/^@/, '');
  $('#app').innerHTML = `
  ${PREVIA ? '<div class="prev">Prévia: você está logado na Carteira, esta abertura não conta</div>' : ''}
  <header class="top"><i></i><b>${esc(c.nome || '')}</b></header>
  ${fotos.length ? `<div class="hero"><img src="${esc(src(fotos[0], 1600))}" alt="${esc(L.titulo)}" fetchpriority="high">${fotos.length > 1 ? `<button class="vf" data-f="0">${ICON_FOTOS}Ver as ${fotos.length} fotos</button>` : ''}</div>` : ''}
  <main class="wrap">
    <div class="intro">
      <div class="kick">Seleção exclusiva</div>
      ${L.para ? `<p class="para">Para ${esc(L.para)}</p>` : ''}
      <h1>${esc(L.titulo)}</h1>
      <p class="sub">${esc(L.sub)}</p>
      <div class="preco"><small>${L.loc ? 'Valor do aluguel' : 'Valor de venda'}</small><b>${L.preco ? reais(L.preco) + (L.loc ? '/mês' : '') : 'Sob consulta'}</b></div>
      ${L.valCond ? `<div class="vals"><span><small>Condomínio</small>${reais(L.valCond)}/mês</span></div>` : ''}
      ${L.texto ? `<p class="texto">${esc(L.texto)}</p>` : ''}
    </div>
    ${(L.ficha || []).length ? `<section class="sec"><h2>Ficha técnica</h2><div class="ficha">${L.ficha.map(x => `<div><span>${esc(x.r)}</span><b>${esc(x.v)}</b></div>`).join('')}</div></section>` : ''}
    ${L.descricao ? `<section class="sec"><h2>Sobre o imóvel</h2><div class="desc">${L.descricao.split(/\n+/).map(p => `<p>${esc(p)}</p>`).join('')}</div></section>` : ''}
    ${(L.dif || []).length ? `<section class="sec"><h2>Características do imóvel</h2><ul class="difs">${L.dif.map(x => `<li>${esc(x)}</li>`).join('')}</ul></section>` : ''}
    ${(L.cond || []).length ? `<section class="sec"><h2>Características do condomínio</h2><ul class="difs">${L.cond.map(x => `<li>${esc(x)}</li>`).join('')}</ul></section>` : ''}
    ${L.endereco || L.bairro ? `<section class="sec"><h2>Localização</h2><div class="loc"><div><b>${esc(L.endereco || L.bairro)}</b><span>${esc([L.endereco ? L.bairro : '', L.cidade || 'Curitiba'].filter(Boolean).join(' · '))}</span></div>${L.endereco ? `<a class="mapa" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([L.endereco, L.bairro, L.cidade || 'Curitiba', 'PR'].filter(Boolean).join(', '))}" target="_blank" rel="noopener">${PINO}Ver no mapa</a>` : ''}</div></section>` : ''}
    ${fotos.length > 1 ? `<section class="sec"><h2>Fotos · ${fotos.length}</h2><div class="gal">${fotos.map((u, i) => `<button data-f="${i}" aria-label="Abrir foto ${i + 1}"><img loading="lazy" src="${esc(src(u, 640, 480))}" alt=""></button>`).join('')}</div></section>` : ''}
    <section class="corr">
      <span class="nm">${esc(c.nome || '')}</span>
      ${c.creci ? `<span class="cg">${esc([c.cargo, c.creci].filter(Boolean).join(' · '))}</span>` : ''}
      ${ig ? `<a class="ig" href="https://instagram.com/${esc(ig)}" target="_blank" rel="noopener">@${esc(ig)} no Instagram</a>` : ''}
    </section>
    <p class="aviso">Valores e disponibilidade sujeitos a confirmação.</p>
  </main>
  ${zap.length >= 10 ? `<div class="cta"><a href="https://wa.me/${zap.length <= 11 ? '55' + zap : zap}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">${WA}Falar com ${esc(primeiro(c.nome).charAt(0) + primeiro(c.nome).slice(1).toLowerCase())} no WhatsApp</a></div>` : ''}
  <div class="lb hidden" id="lb" role="dialog" aria-label="Fotos"><img id="lb-img" alt=""><button class="x" data-lb="x" aria-label="Fechar">×</button><button class="ar p" data-lb="p" aria-label="Foto anterior">${SETA('M15 18l-6-6 6-6')}</button><button class="ar n" data-lb="n" aria-label="Próxima foto">${SETA('M9 18l6-6-6-6')}</button><div class="ct" id="lb-ct"></div></div>`;
  if (!zap) document.body.style.paddingBottom = '0';
}

// fotos em tela cheia: setas, teclado e arrastar com o dedo
function abreFoto(i) {
  const fotos = L.fotos || []; if (!fotos.length) return;
  atual = (i + fotos.length) % fotos.length;
  const u0 = fotos[atual];
  $('#lb-img').src = src(u0, 1800);
  // foto Nickel: mostra a de 720 px na hora e troca pela de 1600 px quando chegar
  if (/^nf:/.test(u0) && !NF.get(u0 + ':g!')) nfPega(u0, 'g').then(s => { if (s) { NF.set(u0 + ':g!', s); if (fotos[atual] === u0) $('#lb-img').src = s; } });
  $('#lb-ct').textContent = `${atual + 1} / ${fotos.length}`;
  $('#lb').classList.remove('hidden'); document.body.style.overflow = 'hidden';
  [atual + 1, atual - 1].forEach(k => { const u = fotos[(k + fotos.length) % fotos.length]; if (u && !/^nf:/.test(u)) new Image().src = foto(u, 1800); });
}
function fechaFoto() { $('#lb').classList.add('hidden'); document.body.style.overflow = ''; }
document.addEventListener('click', e => {
  const f = e.target.closest('[data-f]'); if (f) return abreFoto(+f.dataset.f);
  const b = e.target.closest('[data-lb]'); if (!b) { if (e.target.id === 'lb') fechaFoto(); return; }
  if (b.dataset.lb === 'x') fechaFoto(); else abreFoto(atual + (b.dataset.lb === 'n' ? 1 : -1));
});
document.addEventListener('keydown', e => {
  if (!$('#lb') || $('#lb').classList.contains('hidden')) return;
  if (e.key === 'Escape') fechaFoto(); else if (e.key === 'ArrowRight') abreFoto(atual + 1); else if (e.key === 'ArrowLeft') abreFoto(atual - 1);
});
let x0 = null;
document.addEventListener('touchstart', e => { if (e.target.closest('#lb')) x0 = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null;
  if (Math.abs(dx) > 45) abreFoto(atual + (dx < 0 ? 1 : -1));
});

carrega();
</script>
</body>
