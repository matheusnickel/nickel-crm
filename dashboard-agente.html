<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nickel CRM — Angariador</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nickel CRM">
  <meta name="theme-color" content="#a8e63d">
</head>
<body>

  <header class="app-header">
    <span class="logo">NICKEL CRM</span>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="user-info" id="agent-name"></span>
      <button class="logout-btn" id="logout-btn">Sair</button>
    </div>
  </header>

  <main class="main-content">

    <!-- Metas Semanal + Mensal -->
    <div class="card">
      <div class="card-title">🎯 Metas</div>
      <div id="metas-wrap" class="metas-grid"></div>
    </div>

    <!-- Banner: não enviou hoje -->
    <div id="no-send-banner" class="no-send-banner" style="display:none">
      <span class="no-send-icon">⚠️</span>
      <div>
        <div class="no-send-title">Você não enviou o relatório de hoje!</div>
        <div class="no-send-sub">Envie agora o relatório de hoje.</div>
      </div>
    </div>

    <!-- Alerta dias perdidos -->
    <div class="status-badge orange" id="missed-days-alert" style="display:none"></div>

    <!-- Streak -->
    <div class="card" style="text-align:center">
      <div class="card-title">Sequência de envios</div>
      <div id="streak-wrap"></div>
    </div>

    <!-- Formulário diário -->
    <div class="card">
      <div class="card-title">Lançamento diário</div>
      <div class="form-group" style="margin-bottom:14px">
        <label>Data do lançamento</label>
        <input type="date" id="selected-date" max="">
      </div>
      <div id="form-wrap"></div>
    </div>

    <!-- Meus CPDs e DOCs -->
    <div class="card">
      <div class="card-title">📋 Meus CPs e DOCs</div>
      <div id="agent-contacts-wrap"></div>
    </div>

    <!-- Ranking do Dia -->
    <div class="card">
      <div class="card-title">⭐ Ranking</div>
      <div id="agent-daily-ranking"></div>
    </div>

    <!-- Histórico -->
    <div class="card">
      <div class="card-title">Histórico</div>
      <div style="overflow-x:auto">
        <table class="data-table">
          <thead>
            <tr>
              <th>Data</th>
              <th class="num-cell">PROSP</th>
              <th class="num-cell">CP</th>
              <th class="num-cell">DOC</th>
            </tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
      <button id="hist-show-more" style="display:none;margin-top:12px;width:100%;background:none;border:1px solid var(--border);color:var(--text-muted);font-family:'DM Sans',sans-serif;font-size:13px;padding:10px;border-radius:8px;cursor:pointer;">Ver todos</button>
    </div>

  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
