<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nickel CRM — Angariador</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nickel CRM">
  <meta name="theme-color" content="#a8e63d">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/nickel-crm/sw.js').then(reg => {
        reg.update();
        reg.addEventListener('updatefound', () => {
          reg.installing.addEventListener('statechange', function() {
            if (this.state === 'installed' && navigator.serviceWorker.controller) {
              navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
            }
          });
        });
      });
    }
  </script>
</head>
<body>

  <header class="app-header">
    <span class="logo">NICKEL CRM</span>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="user-info" id="agent-name"></span>
      <button class="logout-btn" id="logout-btn">Sair</button>
    </div>
  </header>

  <main class="main-content agent-layout">

    <!-- Metas (full width) -->
    <div class="agent-full">
      <div class="card">
        <div class="card-title">🎯 Metas</div>
        <div id="metas-wrap" class="metas-grid"></div>
      </div>

      <!-- Banner: não enviou hoje -->
      <div id="no-send-banner" class="no-send-banner" style="display:none">
        <span class="no-send-icon">⚠️</span>
        <div>
          <div class="no-send-title">Você não enviou o relatório de hoje!</div>
          <div class="no-send-sub">Envie agora o relatório de hoje.</div>
        </div>
      </div>

      <!-- Alerta dias perdidos -->
      <div class="status-badge orange" id="missed-days-alert" style="display:none"></div>
    </div>

    <!-- Coluna esquerda: lançamento + histórico tabela -->
    <div class="agent-col-left">

      <!-- Formulário diário -->
      <div class="card">
<div class="card-title" style="margin-top:0">Lançamento diário</div>
        <div class="form-group" style="margin-bottom:14px">
          <label>Data do lançamento</label>
          <input type="date" id="selected-date" max="">
        </div>
        <div id="form-wrap"></div>
      </div>

<!-- Histórico de lançamentos -->
      <div class="card">
        <div class="card-title" id="streak-toggle" style="cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:space-between">
          <span>📅 Últimos lançamentos</span>
          <span id="streak-chevron" style="font-size:12px;color:var(--text-muted);transition:transform .2s">▼</span>
        </div>
        <div id="streak-wrap" style="display:none"></div>
      </div>

      <!-- Histórico tabela -->
      <div class="card">
        <div class="card-title" id="hist-toggle" style="cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:space-between">
          <span>📋 Histórico</span>
          <span id="hist-chevron" style="font-size:12px;color:var(--text-muted);transition:transform .2s">▼</span>
        </div>
        <div id="hist-body-wrap" style="display:none">
          <div style="overflow-x:auto">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Data</th>
                  <th class="num-cell">CQ</th>
                  <th class="num-cell">DOC</th>
                </tr>
              </thead>
              <tbody id="history-body"></tbody>
            </table>
          </div>
          <button id="hist-show-more" style="display:none;margin-top:12px;width:100%;background:none;border:1px solid var(--border);color:var(--text-muted);font-family:'DM Sans',sans-serif;font-size:13px;padding:10px;border-radius:8px;cursor:pointer;">Ver todos</button>
        </div>
      </div>

    </div>

    <!-- Coluna direita: leads + CQs + ranking -->
    <div class="agent-col-right">

      <!-- Leads Recebidos (oculto por padrão, toggle no fim da página) -->
      <div class="card" id="agent-leads-card" style="display:none">
        <div class="card-title">🎯 Leads Recebidos</div>
        <div id="agent-leads-wrap"></div>
      </div>

      <!-- Meus CQs, DOCs (colapsável) -->
      <div class="card">
        <div class="card-title" id="contacts-toggle" style="cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:space-between">
          <span>📋 Meus CQs e DOCs</span>
          <span id="contacts-chevron" style="font-size:12px;color:var(--text-muted);transition:transform .2s">▼</span>
        </div>
        <div id="agent-contacts-wrap" style="display:none"></div>
      </div>

      <!-- Minhas Visitas (oculto — integrado acima) -->
      <div id="agent-visits-wrap" style="display:none"></div>

      <!-- Ranking VGV do mês -->
      <div class="card">
        <div class="card-title">🏆 Ranking de Vendas — mês</div>
        <div id="vgv-agent-wrap"></div>
      </div>

      <!-- Ranking do Dia -->
      <div class="card">
        <div class="card-title">⭐ Ranking</div>
        <div id="agent-daily-ranking"></div>
      </div>

    </div>

  </main>

  <!-- Toggle discreto para Leads (no fundo da página) -->
  <div style="text-align:center;padding:12px 0 24px">
    <button id="leads-toggle-btn" style="background:none;border:1px solid var(--border);border-radius:8px;color:var(--text-muted);font-size:12px;padding:7px 18px;cursor:pointer">
      🎯 Ver meus leads
    </button>
  </div>

  <script type="module" src="app.js"></script>
  <script>
    document.addEventListener('click', e => {
      const btn = e.target.closest('.card-toggle');
      if (!btn) return;
      const body = document.getElementById(btn.dataset.target);
      if (!body) return;
      const card = btn.closest('.collapsible-card');
      const open = body.style.display === 'none';
      body.style.display = open ? 'block' : 'none';
      if (card) card.classList.toggle('open', open);
    });

    // Toggle Últimos lançamentos
    document.getElementById('streak-toggle')?.addEventListener('click', function() {
      const wrap = document.getElementById('streak-wrap');
      const chevron = document.getElementById('streak-chevron');
      if (!wrap) return;
      const open = wrap.style.display === 'none';
      wrap.style.display = open ? '' : 'none';
      if (chevron) chevron.style.transform = open ? 'rotate(180deg)' : '';
    });

    // Toggle Histórico tabela
    document.getElementById('hist-toggle')?.addEventListener('click', function() {
      const wrap = document.getElementById('hist-body-wrap');
      const chevron = document.getElementById('hist-chevron');
      if (!wrap) return;
      const open = wrap.style.display === 'none';
      wrap.style.display = open ? '' : 'none';
      if (chevron) chevron.style.transform = open ? 'rotate(180deg)' : '';
    });

    // Toggle CQs e DOCs
    document.getElementById('contacts-toggle')?.addEventListener('click', function() {
      const wrap = document.getElementById('agent-contacts-wrap');
      const chevron = document.getElementById('contacts-chevron');
      if (!wrap) return;
      const open = wrap.style.display === 'none';
      wrap.style.display = open ? '' : 'none';
      if (chevron) chevron.style.transform = open ? 'rotate(180deg)' : '';
    });

    // Toggle de leads
    document.getElementById('leads-toggle-btn')?.addEventListener('click', function() {
      const card = document.getElementById('agent-leads-card');
      if (!card) return;
      const open = card.style.display === 'none' || card.style.display === '';
      card.style.display = open ? '' : 'none';
      card.dataset.userOpened = open ? 'true' : 'false';
      this.textContent = open ? '✕ Fechar leads' : '🎯 Ver meus leads';
      if (open) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  </script>
</body>
</html>
