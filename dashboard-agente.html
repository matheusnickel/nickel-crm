<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nickel CRM — Angariador</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nickel CRM">
  <meta name="theme-color" content="#a8e63d">
</head>
<body>

  <header class="app-header">
    <span class="logo">NICKEL CRM</span>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="user-info" id="agent-name"></span>
      <button class="logout-btn" id="logout-btn">Sair</button>
    </div>
  </header>

  <main class="main-content">

    <!-- DOC Semanal Hero -->
    <div class="card doc-hero">
      <div class="card-title">DOC desta semana</div>
      <div class="doc-number" id="doc-week-num">0</div>
      <div class="doc-label">Documentações</div>
      <div class="doc-meta-label" id="doc-week-meta"></div>
      <div class="doc-week" id="doc-week-range"></div>
    </div>

    <!-- Alerta dias perdidos -->
    <div class="status-badge orange" id="missed-days-alert" style="display:none"></div>

    <!-- Status meta -->
    <div class="status-badge red" id="week-status" style="display:none"></div>

    <!-- Streak -->
    <div class="card" style="text-align:center">
      <div class="card-title">Sequência de envios</div>
      <div id="streak-wrap"></div>
    </div>

    <!-- Formulário diário -->
    <div class="card">
      <div class="card-title">Lançamento diário</div>
      <div class="form-group" style="margin-bottom:14px">
        <label>Data do lançamento</label>
        <input type="date" id="selected-date" max="">
      </div>
      <div id="form-wrap"></div>
    </div>

    <!-- Histórico -->
    <div class="card">
      <div class="card-title">Histórico</div>
      <div style="overflow-x:auto">
        <table class="data-table">
          <thead>
            <tr>
              <th>Data</th>
              <th class="num-cell">PROSP</th>
              <th class="num-cell">CPD</th>
              <th class="num-cell">DOC</th>
            </tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
    </div>

  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
