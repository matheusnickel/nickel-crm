<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Elenco">
<title>Elenco · VIP Imóveis</title>
<meta property="og:title" content="Elenco · VIP Imóveis">
<meta property="og:description" content="Atributos, evolução e produção do time de angariação.">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050b1a; --sheet:#0b1530; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15);
  --text:#f4f6fb; --text2:#c6d0e6; --muted:#8d9bbb; --faint:#66759a;
  --or:#ff5a1f; --or2:#ff8a3d; --orbg:rgba(255,90,31,.12); --orline:rgba(255,122,61,.5);
  --ok:#3ddc97; --warn:#ffc65c; --red:#ff6b78; --vis:#8fa6d8;
  /* tela de jogador do Football Manager */
  --fm0:#060d20; --fm1:#0c1631; --fm2:#0a132b; --fmhi:rgba(61,220,151,.13);
  --n1:#77839e; --n2:#e9edf5; --n3:#ffc65c; --n4:#3ddc97;
  --g-tec:#8fa6d8; --g-men:#ff8a3d; --g-pos:#3ddc97;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{min-height:100vh;background:var(--bg);color:var(--text);font:15px/1.45 'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(800px 420px at 100% -5%,rgba(255,90,31,.13),transparent 60%),radial-gradient(700px 520px at -10% 105%,rgba(40,90,220,.14),transparent 60%);background-attachment:fixed}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
body:not(.adm) .adm{display:none!important}
body.adm .pub{display:none!important}
.muted{color:var(--muted)}
.lbl{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:9px}
.lbl .hint{text-transform:none;letter-spacing:0;font-family:'Geist',sans-serif;font-weight:500;color:var(--faint);margin-left:6px}
.kick{font-family:'Geist Mono',ui-monospace,monospace;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--or2);font-weight:600}

/* topo */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:calc(var(--sat) + 12px) 20px 12px;background:rgba(5,11,26,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:'Geist Mono',monospace;font-size:13px;letter-spacing:.14em;white-space:nowrap}
.brand i{width:8px;height:8px;background:var(--or);transform:rotate(45deg);border-radius:2px;flex-shrink:0}
.brand b{font-weight:700}.brand span{color:var(--muted)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:14px;position:relative}
.sync{font-family:'Geist Mono',monospace;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
.sync::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ok);flex-shrink:0}
.sync.busy::before{background:var(--or2);animation:pulse 1s infinite}
.sync.warn{color:var(--warn)}.sync.warn::before{background:var(--warn)}
@keyframes pulse{50%{opacity:.3}}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;font-weight:800;flex-shrink:0}
.menu{position:absolute;right:0;top:46px;background:var(--sheet);border:1px solid var(--line2);border-radius:14px;padding:6px;min-width:240px;box-shadow:0 20px 40px rgba(0,0,0,.5);z-index:40}
.menu button{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:9px;font-weight:600}
.menu button:hover{background:var(--orbg)}
.teste{background:repeating-linear-gradient(135deg,#ffc65c,#ffc65c 10px,#f5b43a 10px,#f5b43a 20px);color:#2a1a00;text-align:center;font:700 12px 'Geist Mono',monospace;letter-spacing:.12em;padding:5px}

/* botões */
.btn-or{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;font-weight:700;padding:12px 18px;border-radius:12px;box-shadow:0 10px 24px -10px rgba(255,90,31,.8);white-space:nowrap}
.btn-or.sm,.btn-ghost.sm{padding:8px 14px;font-size:14px;border-radius:10px}
.btn-or:active{transform:translateY(1px)}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);padding:11px 16px;border-radius:12px;font-weight:600;color:var(--text2);white-space:nowrap}
.btn-ghost:hover{border-color:var(--orline);color:#fff}
.link{color:var(--or2);font-weight:600;font-size:14px}
.link:hover{text-decoration:underline}

main{max-width:1200px;margin:0 auto;padding:22px 20px calc(120px + var(--sab))}
.phd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.phd h1{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.phd .sub{font-size:14px;color:var(--muted)}
.group-t{display:flex;align-items:center;gap:10px;margin:28px 2px 12px}
.group-t .lbl{margin:0}
.group-t::after{content:'';flex:1;height:1px;background:var(--line)}

/* chips e campos */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:99px;border:1px solid var(--line2);color:var(--text2);font-weight:600;font-size:14.5px;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--orline);color:#fff}
.chip.on{background:linear-gradient(135deg,var(--or),var(--or2));border-color:transparent;color:#fff}
.chips.sm .chip{padding:6px 12px;font-size:13.5px}
.chip.tag{background:var(--orbg);border-color:var(--orline);color:#fff;padding:7px 8px 7px 13px}
.chip.tag .rm{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:16px;line-height:1;color:var(--text2)}
.chip.tag .rm:hover{background:rgba(255,255,255,.12);color:#fff}
.chip.sug{border-style:dashed;font-size:13px;padding:6px 11px}
input,textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;line-height:1.5}
input:focus,textarea:focus{border-color:var(--orline);box-shadow:0 0 0 3px rgba(255,90,31,.16)}
input[type=date]{min-height:48px}
::placeholder{color:var(--faint)}
.fl{display:flex;flex-direction:column}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.err{color:var(--red);font-size:13.5px;font-weight:600;margin-top:6px}
.err:empty{display:none}
.hintp{font-size:13.5px;color:var(--muted);line-height:1.5}

/* estrelas (capacidade atual) */
/* dourada quando tem, prateada quando não tem */
.st5{position:relative;display:inline-block;font-size:16px;line-height:1;white-space:nowrap;vertical-align:-2px;letter-spacing:1px}
.st5::before,.st5 i::before{content:'★★★★★';-webkit-background-clip:text;background-clip:text;color:transparent}
.st5::before{background-image:linear-gradient(180deg,#eef1f5 0%,#b9c0cb 55%,#8b93a1 100%)}
.st5 i{position:absolute;left:0;top:0;overflow:hidden;font-style:normal}
.st5 i::before{background-image:linear-gradient(180deg,#fff1a8 0%,#f7c531 50%,#d99a0b 100%)}

/* nota pintada como no FM */
.n0{color:var(--faint)}.n1{color:var(--n1)}.n2{color:var(--n2)}.n3{color:var(--n3)}.n4{color:var(--n4)}
.dl{font:700 11.5px 'Geist Mono',monospace;white-space:nowrap}
.dl.up{color:var(--ok)}.dl.dn{color:var(--red)}.dl.eq{color:var(--faint)}

/* ── ELENCO (lista do plantel) ── */
.tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px}
.tools .lbl{margin:0}
.tools .hintp{flex-basis:100%;margin-top:-4px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:16px}
.kpis div{background:#08112a;padding:14px 18px;display:flex;flex-direction:column;gap:2px}
.kpis b{font-size:28px;font-weight:900;letter-spacing:-.04em;line-height:1.05;font-variant-numeric:tabular-nums}
.kpis span{font-size:13px;color:var(--muted)}
.sq{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--fm0)}
.sqr .st5{font-size:18px}
.sqr .num{font-size:17px}
.sqr{display:grid;grid-template-columns:minmax(220px,2.4fr) 70px 170px 120px 140px;align-items:center;gap:12px;padding:10px 16px;width:100%;text-align:left;background:var(--fm1);border-top:1px solid rgba(255,255,255,.04);font-size:14.5px;transition:background .12s}
.sqr:nth-child(odd){background:var(--fm2)}
.sqr:hover{background:#13214a}
.sqr.hd{background:#08112a;cursor:default;padding:9px 16px;font:600 11px 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:none}
.sqr.hd:hover{background:#08112a}
.sqr .c{text-align:center}
/* cada número exatamente embaixo do título da coluna */
.sqr > :not(.who){text-align:center}
.sqr.hd > :first-child{text-align:left}
.sqr .cell{display:flex;flex-direction:column;align-items:center;justify-content:center}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.av{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font:700 13.5px 'Geist Mono',monospace;color:var(--or2);flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.who .nm{display:block;font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .mt{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gv{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center}
.num{font-weight:800;font-variant-numeric:tabular-nums;text-align:center}
.num.v{color:var(--vis)}.num.a{color:var(--or2)}
.lbm{display:none}

.legend{margin-top:26px;border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;font-size:14px;color:var(--text2);line-height:1.5}
.legend h4{font:600 12px 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.legend .sw{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px}
.legend .sw span{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.legend .sw i{width:10px;height:10px;border-radius:3px}

/* ── PERFIL DO CORRETOR (tela de jogador do FM) ── */
.back{display:inline-flex;align-items:center;gap:8px;color:var(--text2);font-weight:600;font-size:14.5px;padding:6px 0;margin-bottom:12px}
.back:hover{color:#fff}
.pf{background:var(--fm0);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pf-h{display:flex;gap:20px;align-items:center;padding:18px 20px;background:linear-gradient(90deg,#14224a,#0b1530 60%);border-bottom:1px solid var(--line);flex-wrap:wrap}
.pf-ph{width:104px;height:104px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.06);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font:800 30px 'Geist Mono',monospace;color:var(--or2);flex-shrink:0}
.pf-ph img{width:100%;height:100%;object-fit:cover}
.pf-id{flex:1;min-width:220px}
.pf-id h1{font-size:32px;font-weight:900;letter-spacing:-.04em;line-height:1.05;overflow-wrap:anywhere}
.pf-f{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:12px}
.pf-f div{display:flex;flex-direction:column;gap:3px}
.pf-f span{font:600 10.5px 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pf-f b{font-size:15px;font-weight:700}
.pf-f .st5{font-size:18px}
.capbox{display:flex;flex-direction:column;gap:12px;padding:14px 18px;border-radius:14px;background:#08112a;border:1px solid var(--line2)}
.capbox div{display:flex;flex-direction:column;gap:5px}
.capbox div > span:first-child{font:600 10.5px 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.capbox .st5{font-size:24px;align-self:flex-start}
.sug{font-size:13px;color:var(--muted)}
.sug .st5{font-size:14px;margin-left:4px}
.pf-act{display:flex;gap:8px;flex-wrap:wrap;width:100%;padding-top:4px}
.pf-tabs{display:flex;gap:2px;padding:0 12px;background:#08112a;border-bottom:1px solid var(--line);overflow-x:auto}
.pf-tabs button{padding:12px 14px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.pf-tabs button.on{color:#fff;border-bottom-color:var(--or)}
.pf-tabs button:hover{color:#fff}
.pf-b{padding:16px}

.fm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.fm-c{display:flex;flex-direction:column;gap:2px;min-width:0}
.fm-h{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:2px 4px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.fm-h .t{font:800 12.5px 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase}
.fm-h small{display:block;font:500 12px 'Geist',sans-serif;color:var(--muted);margin-top:2px}
.fm-h .g{text-align:right;white-space:nowrap}
.fm-h .g b{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}
.fm-h .g span{display:block;font:600 10.5px 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fm-r{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;padding:10px 12px;background:var(--fm1);border-left:3px solid transparent;transition:background .12s}
.fm-r:hover{background:#13214a}
.fm-r .ic{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin-left:7px;border-radius:50%;border:1px solid var(--line2);font:700 10px 'Geist',sans-serif;font-style:normal;color:var(--muted);vertical-align:2px}
.fm-r.open .ic{background:var(--or);border-color:var(--or);color:#fff}
.fm-x{display:block;font-size:13.5px;font-weight:500;line-height:1.5;color:var(--text2);background:#08112a;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.fm-x .fx{display:block;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.fm-x .fx b{margin-right:4px}
.pnl-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.fm-r:nth-child(even){background:var(--fm2)}
.fm-r.hi{background:linear-gradient(90deg,var(--fmhi),rgba(61,220,151,.04));border-left-color:var(--n4)}
.fm-r .ln{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.fm-r .an{flex:1;min-width:0}
.nv{font-size:18px;font-weight:800;min-width:24px;text-align:right;font-variant-numeric:tabular-nums}
.fm-leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin-top:12px}
.fm-leg b{font-weight:800}

.pn3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
.pnl{background:var(--fm1);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pnl h3{font:700 11.5px 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pap{display:flex;flex-direction:column;gap:2px}
.pap button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;text-align:left;width:100%}
.pap button:hover{background:rgba(255,255,255,.04)}
.pap button.on{background:var(--fmhi);box-shadow:inset 3px 0 0 var(--n4)}
.pap .pt{flex:1;min-width:0}
.pap .pt b{display:block;font-size:14.5px;font-weight:700}
.pap .pt small{display:block;font-size:12px;color:var(--muted)}
.kv{display:flex;flex-direction:column;gap:2px}
.kv span{font:600 10.5px 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kv b{font-size:15px;font-weight:700}
.chs{display:flex;flex-direction:column;gap:6px}
.chs div{display:flex;gap:9px;align-items:baseline;font-size:14.5px;font-weight:600}
.chs div::before{content:'★';color:var(--n3);font-size:13px}
.evol{font-size:14px;color:var(--text2)}
.evol b{color:var(--or2)}
.nota{font-size:14px;color:var(--text2);line-height:1.5;border-left:2px solid var(--orline);padding-left:10px}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.box{background:var(--fm1);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.box-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.box-h h3{font-size:16px;font-weight:800;letter-spacing:-.01em}
.box-h .r{margin-left:auto}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:'Geist Mono',monospace}
.keyl{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.keyl span{display:inline-flex;align-items:center;gap:6px}
.keyl i{width:10px;height:10px;border-radius:3px;background:var(--vis)}
.keyl .a i{background:var(--or2)}
/* atributos: primeira avaliação × hoje */
.hb{display:flex;flex-direction:column;gap:9px}
.hb-g{font:700 11px 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.hb-r{display:grid;grid-template-columns:150px minmax(0,1fr) 64px;align-items:center;gap:12px;font-size:14px}
.hb-t{position:relative;height:10px;border-radius:99px;background:rgba(255,255,255,.06)}
.hb-t i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.hb-t .a1{background:linear-gradient(90deg,var(--or),var(--or2))}
.hb-t .a0{width:3px;top:-4px;bottom:-4px;border-radius:2px;background:#f4f6fb;box-shadow:0 0 0 2px var(--fm1);z-index:1}
.keyl .tick{width:3px;height:12px;border-radius:2px;background:#f4f6fb}
.hb-v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
/* produção por mês de acompanhamento */
.btn-reg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-reg button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 16px;border-radius:12px;border:1px solid var(--line2);text-align:left;background:rgba(255,255,255,.02)}
.btn-reg button:hover{border-color:var(--orline)}
.btn-reg b{font-size:15.5px;font-weight:800}
.btn-reg small{font-size:12.5px;color:var(--muted)}
.btn-reg .v b{color:var(--vis)}.btn-reg .a b{color:var(--or2)}
.mt3{width:100%;border-collapse:collapse;font-size:14.5px}
.mt3 th{font:600 10.5px 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line)}
.mt3 th:first-child,.mt3 td:first-child{text-align:left}
.mt3 td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.mt3 td small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.mt3 tr.at td:first-child b{color:var(--or2)}
.mt3 tr.tot td{border-bottom:none;background:rgba(255,255,255,.03)}
.mt3 .v{color:var(--vis)}.mt3 .a{color:var(--or2)}
.tw{overflow-x:auto}

// sugestão de estrelas a partir da média de 0 a 20 (régua exigente: 5 estrelas só com média 20)
// 20 = 5 · 17 = 4 · 14 = 3 · 11 = 2 · 8 = 1 — a cada 1½ ponto, ½ estrela
const estrelasDaMedia = m => m === null ? 0 : Math.min(5, Math.max(0.5, Math.round((m - 5) / 3 * 2) / 2));

function delta(d) {

}
// sugestão das notas para a capacidade atual (0 a 5, de meia em meia) e como escrever sem vírgula: 3½
const capAtual = n => estrelasDaMedia(media(n, ATTRS.map(a => a.k)));

// ── FIRESTORE (REST) ──
function toFs(v) {

  if (Array.isArray(v)) return { arrayValue: { values: v.map(toFs) } };
  switch (typeof v) {
    case 'string': return { stringValue: v };
    case 'boolean': return { booleanValue: v };
    case 'number': return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
    case 'object': { const f = {}; for (const k in v) if (v[k] !== undefined) f[k] = toFs(v[k]); return { mapValue: { fields: f } }; }
  }

}
function fromFs(v) {
  if (!v) return null;

  if ('integerValue' in v) return Number(v.integerValue);
  if ('doubleValue' in v) return v.doubleValue;
  if ('booleanValue' in v) return v.booleanValue;
  if ('nullValue' in v) return null;

    const v = n[a.k];

}
function cleanCorretor(o) {

    id: o.id,
    nome: String(o.nome || ''),
    nascimento: String(o.nascimento || ''),
    desde: String(o.desde || ''),
    // início do acompanhamento: conta o 1º, 2º e 3º mês a partir daqui
    inicio: String(o.inicio || (o.criadoEm ? String(o.criadoEm).slice(0, 10) : '')),
    foto: String(o.foto || ''),

    potencial: Number.isFinite(pot) && pot > 0 ? Math.min(5, meioPasso(pot)) : 0,
    // capacidade atual: as estrelas que o gestor dá (0 = ainda não deu)
    capacidade: +o.capacidade > 0 ? Math.min(5, meioPasso(+o.capacidade)) : 0,
    destaques: arr(o.destaques).map(String).filter(Boolean),
    evoluir: String(o.evoluir || ''),
    avaliacoes: arr(o.avaliacoes).filter(a => a && a.data)
      .map(a => ({ id: String(a.id || newId('a')), data: String(a.data), notas: cleanNotas(a.notas), obs: String(a.obs || ''), ca: +a.ca > 0 ? Math.min(5, meioPasso(+a.ca)) : 0 }))
      .sort((a, b) => a.data < b.data ? -1 : a.data > b.data ? 1 : 0),
    producao: arr(o.producao).filter(p => p && p.data && PROD[p.tipo])
      .map(p => ({ id: String(p.id || newId('p')), data: String(p.data), tipo: p.tipo, ti: String(p.ti || ''), valor: Number(p.valor) || 0, bairro: String(p.bairro || '') })),
    criadoEm: String(o.criadoEm || ''),

}

let corretores = [];
const byId = id => corretores.find(c => c.id === id);
const persistCache = () => lsSet(LS_CACHE, corretores);
const ultima = c => c.avaliacoes[c.avaliacoes.length - 1] || null;
const notasAtuais = c => (ultima(c) || {}).notas || {};
// capacidade atual: as estrelas que o gestor deu; enquanto não der, vale a sugestão das notas
const capDe = c => c.capacidade || capAtual(notasAtuais(c));

// Cada corretor grava em fila própria, sempre com a versão local mais recente.
// O que não chegou ao Firebase fica pendente neste aparelho e é reenviado depois.
const chain = {}, seq = {};
let failing = false, inflight = 0;
function queueWrite(id) {
  const my = seq[id] = (seq[id] || 0) + 1;
  const run = async () => {
    if (my !== seq[id]) return;
    const pend = lsGet(LS_PEND, {});
    if (!(id in pend)) return;
    const cur = pend[id];
    const url = `${FB_ROOT}/${COL}/${encodeURIComponent(id)}?key=${FB_KEY}`;
    inflight++; updateSync();
    try {
      const r = cur.__del
        ? await fetch(url, { method: 'DELETE' })
        : await fetch(url, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields: docFields(cur) }) });
      if (!r.ok && !(cur.__del && r.status === 404)) throw new Error('HTTP ' + r.status);
      if (my === seq[id]) { const p = lsGet(LS_PEND, {}); delete p[id]; lsSet(LS_PEND, p); }
      failing = false;
    } catch (e) {
      if (!failing) toast('Sem conexão. Salvo neste aparelho; envio para a nuvem assim que a internet voltar.');
      failing = true;
    } finally { inflight--; updateSync(); }
  };
  chain[id] = (chain[id] || Promise.resolve()).then(run, run);
  return chain[id];
}
const flushPending = () => Object.keys(lsGet(LS_PEND, {})).forEach(queueWrite);
setInterval(() => { if (failing) flushPending(); }, 30000);
window.addEventListener('online', flushPending);

let loaded = false, gravacoes = 0;
function saveCorretor(c) {
  c = cleanCorretor(c);
  c.atualizadoEm = nowLocal();
  if (!c.criadoEm) c.criadoEm = c.atualizadoEm;
  const i = corretores.findIndex(x => x.id === c.id);
  if (i < 0) corretores.push(c); else corretores[i] = c;
  persistCache();
  const p = lsGet(LS_PEND, {}); p[c.id] = c; lsSet(LS_PEND, p);
  gravacoes++;
  queueWrite(c.id);
  render();
  return c;
}
function removeCorretor(id) {
  corretores = corretores.filter(c => c.id !== id);
  persistCache();
  const p = lsGet(LS_PEND, {}); p[id] = { __del: true }; lsSet(LS_PEND, p);
  gravacoes++;
  queueWrite(id);
}
function applyPending(list) {
  const p = lsGet(LS_PEND, {});
  for (const id in p) {
    const i = list.findIndex(c => c.id === id);
    if (p[id].__del) { if (i >= 0) list.splice(i, 1); }
    else { const c = cleanCorretor(Object.assign({}, p[id], { id })); if (i >= 0) list[i] = c; else list.push(c); }
  }

}
async function fetchAll() {
  const out = []; let tok = '';
  do {
    const r = await fetch(`${FB_ROOT}/${COL}?key=${FB_KEY}&pageSize=300` + (tok ? '&pageToken=' + encodeURIComponent(tok) : ''));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    (j.documents || []).forEach(d => { const o = fromFs({ mapValue: { fields: d.fields || {} } }); o.id = d.name.split('/').pop(); out.push(cleanCorretor(o)); });
    tok = j.nextPageToken || '';

}
async function refresh(silent) {
  try {
    const g = gravacoes, srv = await fetchAll();
    if (g !== gravacoes) return refresh(silent); // salvou algo enquanto carregava: busca de novo para não perder
    corretores = applyPending(srv);
    persistCache(); loaded = true; failing = false;
  } catch (e) {
    failing = true;

function updateSync() {
  const el = $('#sync'); if (!el) return;
  const n = Object.keys(lsGet(LS_PEND, {})).length;

  else if (n || inflight) { el.classList.add('busy'); t = 'Salvando…'; }

// ── GRÁFICOS ──
// linhas ao longo das avaliações (uma ou mais séries)
function graficoLinhas(av, series, min, max, fmt, id, fixo) {
  if (av.length < 2) {
    const v = series.map(s => `${s.nome} <b style="color:var(--text)">${fmt(s.val(av[0]))}</b>`).join(' · ');
    return `<div class="empty-s">Hoje: ${v}.<br>A linha aparece a partir da segunda avaliação.</div>`;
  }
  const W = 560, H = 220, L = 34, R = series.length > 1 ? 48 : 18, T = 24, B = 30;
  const todos = series.flatMap(s => av.map(s.val)).filter(v => v !== null);
  const span = max - min, folga = span * 0.1;
  // fixo: escala inteira de min a max, uma linha por unidade (usado nas estrelas, de 0 a 5)
  const lo = fixo ? min : Math.max(min, Math.floor((Math.min(...todos) - folga) / (span / 10)) * (span / 10));
  const hi = fixo ? max : Math.min(max, Math.ceil((Math.max(...todos) + folga) / (span / 10)) * (span / 10));
  const ticks = fixo ? Array.from({ length: max - min + 1 }, (_, k) => min + k) : [0, 1, 2, 3, 4].map(k => lo + (hi - lo) / 4 * k);
  const x = i => L + i * (W - L - R) / (av.length - 1), y = v => T + (hi - v) * (H - T - B) / (hi - lo || 1);
  const each = Math.ceil(av.length / 7);
  let g = '';
  for (const v of ticks) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.07)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#66759a">${Math.round(v)}</text>`;
  const datas = av.map((a, i) => i % each === 0 || i === av.length - 1 ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#8d9bbb">${fmtShort(a.data)}</text>` : '').join('');
  const sv = series.map((s, si) => {
    const pts = av.map((a, i) => [i, s.val(a)]).filter(p => p[1] !== null);
    const line = pts.map(([i, v]) => `${x(i)},${y(v)}`).join(' ');
    const area = series.length === 1 && pts.length ? `<polygon points="${x(pts[0][0])},${y(lo)} ${line} ${x(pts[pts.length - 1][0])},${y(lo)}" fill="url(#g-${id})"/>` : '';
    const rot = series.length === 1 ? pts.map(([i, v]) => `<text x="${x(i)}" y="${y(v) - 11}" text-anchor="middle" font-size="12" font-weight="700" fill="#f4f6fb">${fmt(v)}</text>`).join('') : '';
    return area + `<polyline points="${line}" fill="none" stroke="${s.cor}" stroke-width="2.5" stroke-linejoin="round"/>` +
      pts.map(([i, v]) => `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${s.cor}" stroke="#0c1631" stroke-width="2"/>`).join('') + rot;
  }).join('') + (series.length > 1 ? rotulosFinais(series, av, x, y, fmt) : '');
  const leg = series.length > 1 ? `<div class="keyl">${series.map(s => `<span><i style="background:${s.cor}"></i>${s.nome}</span>`).join('')}</div>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de evolução">
    <defs><linearGradient id="g-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5a1f" stop-opacity=".28"/><stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/></linearGradient></defs>
    ${g}${datas}${sv}</svg>${leg}`;
}
// valor final de cada linha à direita do gráfico, afastados para não encostar um no outro
function rotulosFinais(series, av, x, y, fmt) {
  const i = av.length - 1;
  const rs = series.map(s => ({ s, v: s.val(av[i]) })).filter(r => r.v !== null).map(r => Object.assign(r, { yy: y(r.v) + 4 })).sort((a, b) => a.yy - b.yy);
  for (let k = 1; k < rs.length; k++) if (rs[k].yy - rs[k - 1].yy < 14) rs[k].yy = rs[k - 1].yy + 14;
  return rs.map(r => `<text x="${x(i) + 9}" y="${r.yy}" font-size="12" font-weight="700" fill="${r.s.cor}">${fmt(r.v)}</text>`).join('');
}
// cada atributo: barra de hoje (laranja) e um traço branco onde estava na primeira avaliação
function graficoAtributos(av) {
  const a0 = av[0].notas, a1 = ultima({ avaliacoes: av }).notas, dois = av.length > 1;
  return `<div class="hb">${GRUPOS.map(g => `<div class="hb-g">${g.nome}</div>` + g.attrs.map(a => {
    const v0 = a0[a.k], v1 = a1[a.k];
    return `<div class="hb-r"><span>${a.nome}</span><span class="hb-t">${typeof v1 === 'number' ? `<i class="a1" style="width:${v1 * 5}%"></i>` : ''}${dois && typeof v0 === 'number' ? `<i class="a0" style="left:calc(${v0 * 5}% - 1.5px)" title="Primeira avaliação: ${v0}"></i>` : ''}</span>
      <span class="hb-v"><span class="${nivel(v1)}">${typeof v1 === 'number' ? v1 : '–'}</span> ${dois && typeof v0 === 'number' && typeof v1 === 'number' && v0 !== v1 ? delta(v1 - v0) : ''}</span></div>`;
  }).join('')).join('')}</div>`;
}
function graficoProd(linhas) {
  const dados = linhas.filter(l => !l.futuro);
  if (!dados.some(l => l.P.v || l.P.a)) return `<div class="empty-s">As barras aparecem conforme as visitas e angariações forem registradas.</div>`;
  const W = 560, H = 200, L = 10, R = 10, T = 22, B = 30;
  const max = Math.max(1, ...dados.map(l => Math.max(l.P.v, l.P.a)));
  const gw = (W - L - R) / linhas.length, bw = Math.min(30, gw / 3.2);
  const y = v => T + (H - T - B) * (1 - v / max);
  const bars = linhas.map((l, i) => {
    const cx = L + gw * i + gw / 2;
    const one = (v, xx, cor) => `<rect x="${xx}" y="${y(v)}" width="${bw}" height="${Math.max(0, H - B - y(v))}" rx="4" fill="${cor}"/>` + (v ? `<text x="${xx + bw / 2}" y="${y(v) - 6}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c6d0e6">${v}</text>` : '');
    return (l.futuro ? '' : one(l.P.v, cx - bw - 2, '#8fa6d8') + one(l.P.a, cx + 2, '#ff8a3d')) +
      `<text x="${cx}" y="${H - 9}" text-anchor="middle" font-size="11.5" fill="${l.atual ? '#ff8a3d' : '#8d9bbb'}">${l.k}º mês</text>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Produção por mês de acompanhamento"><line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="rgba(255,255,255,.1)"/>${bars}</svg>
    <div class="keyl"><span><i></i>Visitas de angariação</span><span class="a"><i></i>Angariações realizadas</span></div>`;
}

// recorta quadrado (um pouco para cima, onde fica o rosto) e reduz para caber no Firebase
function lerFoto(file) {
  return new Promise((ok, no) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const S = 440, s = Math.min(img.width, img.height), cv = document.createElement('canvas');
      cv.width = cv.height = S;
      cv.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) * 0.25, s, s, 0, 0, S, S);
      URL.revokeObjectURL(url);
      ok(cv.toDataURL('image/jpeg', 0.84));
    };
    img.onerror = () => { URL.revokeObjectURL(url); no(new Error('imagem')); };
    img.src = url;
  });
}

function saveAval() {

  const avs = editando
    ? c.avaliacoes.map(a => a.id === form.avId ? Object.assign({}, a, { data, notas, ca: form.ca }) : a)
    : mudou ? c.avaliacoes.concat([{ id: newId('a'), data, notas, obs: '', ca: form.ca }]) : c.avaliacoes;
  // a capacidade atual do corretor acompanha a avaliação mais recente
  const recente = !editando || (u && u.id === form.avId);
  saveCorretor(Object.assign({}, c, recente ? { capacidade: form.ca } : {}, { avaliacoes: avs }));
  closeSheet();
  toast(editando ? 'Avaliação atualizada.' : mudou ? 'Avaliação salva.' : 'Nada mudou desde a última avaliação.');

}

// produção: visita de angariação (valor, tipo, data) / angariação realizada (valor, bairro, data)
function sheetProd(id, tipo) {
  const c = byId(id); if (!c) return;
  form = { tipo: 'prod', id, ptipo: PROD[tipo] ? tipo : 'visita', ti: '' };
  openSheet(shHead('Registrar produção', esc(c.nome)) + `<div class="sh-b">
    <div class="seg" id="p-seg"></div>
    <div class="fl"><label class="lbl" for="p-valor">Valor do imóvel</label><input id="p-valor" inputmode="numeric" placeholder="R$ 0" autocomplete="off"></div>
    <div id="p-ti-box"><span class="lbl">Tipo do imóvel</span><div class="chips" id="p-ti"></div></div>
    <div class="fl" id="p-bairro-box"><label class="lbl" for="p-bairro">Bairro</label><input id="p-bairro" list="bairros" placeholder="Ex.: Santa Felicidade" autocomplete="off"></div>
    <div class="row2"><div class="fl"><label class="lbl" for="p-data" id="p-data-l">Data</label><input id="p-data" type="date" value="${hoje()}"></div></div>
  </div>
  <div class="sh-f"><button class="btn-ghost" data-act="fechar">Cancelar</button><button class="btn-or" data-act="save-prod">Registrar</button></div>`, 'prod');
  $('#p-valor').addEventListener('input', e => maskMoney(e.target));
  renderSeg();
  setTimeout(() => $('#p-valor').focus(), 50);
}
function renderSeg() {
  const vis = form.ptipo === 'visita';
  $('#p-seg').innerHTML = Object.entries(PROD).map(([k, l]) => `<button class="${form.ptipo === k ? 'on' : ''}" data-act="ptipo" data-v="${k}">${l}</button>`).join('');
  $('#p-ti').innerHTML = TIPOS_IMOVEL.map(t => `<button class="chip${form.ti === t ? ' on' : ''}" data-act="p-ti" data-v="${t}">${t}</button>`).join('');
  $('#p-ti-box').classList.toggle('hidden', !vis);
  $('#p-bairro-box').classList.toggle('hidden', vis);
  $('#p-data-l').textContent = vis ? 'Data da visita' : 'Data da angariação';
}
function saveProd() {
  const c = byId(form.id); if (!c) return closeSheet();
  const vis = form.ptipo === 'visita';
  const p = { id: newId('p'), data: $('#p-data').value || hoje(), tipo: form.ptipo, valor: parseMoney($('#p-valor').value), ti: vis ? form.ti : '', bairro: vis ? '' : $('#p-bairro').value.trim() };
  saveCorretor(Object.assign({}, c, { producao: c.producao.concat([p]) }));
  closeSheet();
  toast(`${vis ? 'Visita' : 'Angariação'} registrada para ${firstName(c.nome)}.`, { label: 'Desfazer', fn: () => { const x = byId(c.id); if (x) saveCorretor(Object.assign({}, x, { producao: x.producao.filter(y => y.id !== p.id) })); } });
}

// ── TOAST ──
let toastT;
function toast(msg, action) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button id="toast-a">${esc(action.label)}</button>` : '');
  t.classList.remove('hidden');
  if (action) $('#toast-a').onclick = () => { t.classList.add('hidden'); action.fn(); };
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), action ? 6000 : 3200);
}
async function copiar(txt) {
  try { await navigator.clipboard.writeText(txt); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (er) {}
    ta.remove(); return ok;
  }
}

// ── AÇÕES ──
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (!e.target.closest('#menu')) $('#menu').classList.add('hidden'); return; }
  const a = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  if (a !== 'menu') $('#menu').classList.add('hidden');
  switch (a) {
    case 'menu': $('#menu').classList.toggle('hidden'); break;
    case 'entrar': sheetLogin(); break;
    case 'sair': admin = false; lsSet(LS_AUTH, false); render(); toast('Modo edição desligado neste aparelho.'); break;
    case 'copiar-link': {
      const url = location.origin + location.pathname + (TESTE ? '?base=teste' : '');
      copiar(url).then(ok => toast(ok ? 'Link copiado. Quem abrir vê o elenco, sem poder editar.' : url));
      break;
    }
    case 'recarregar': refresh(); break;
    case 'abrir': ui.fromElenco = true; location.hash = 'c/' + encodeURIComponent(id); break;
    case 'voltar':
      if (ui.fromElenco) { ui.fromElenco = false; history.back(); }
      else { history.replaceState(null, '', location.pathname + location.search); route(); }
      break;
    case 'aba': ui.aba = v; ui.prodAll = false; render(); break;
    case 'per': ui.per = v; lsSet(LS_PER, v); render(); break;
    case 'prod-all': ui.prodAll = true; render(); break;
    case 'novo': sheetPerfil(); break;
    case 'perfil': sheetPerfil(id); break;
    case 'aval': sheetAval(id, el.dataset.av); break;
    case 'info': if (ui.info.has(v)) ui.info.delete(v); else ui.info.add(v); render(); break;
    case 'prod': sheetProd(id, v); break;
    case 'fechar': closeSheet(); break;
    case 'foto-rm': form.foto = ''; renderFotoPrev(); break;
    case 'ca': form.ca = +v; renderEstrelas('#f-ca', form.ca, 'ca'); break;
    case 'save-perfil': savePerfil(); break;
    case 'del-ask': {
      const c = byId(form.id);
      $('#f-del').innerHTML = `<div class="confirm"><span>Tirar ${esc(firstName(c.nome))} do elenco? Somem as avaliações e a produção.</span><button class="btn-del" data-act="del-yes">Tirar</button><button class="link" data-act="del-no">Cancelar</button></div>`;
      $('#f-del').scrollIntoView({ block: 'nearest' });
      break;
    }
    case 'del-no': $('#f-del').innerHTML = ''; break;
    case 'del-yes': {
      const c = byId(form.id); if (!c) break;
      const copia = JSON.parse(JSON.stringify(c));
      closeSheet(); removeCorretor(c.id);
      history.replaceState(null, '', location.pathname + location.search); ui.fromElenco = false; route();
      toast(`${firstName(c.nome)} saiu do elenco.`, { label: 'Desfazer', fn: () => saveCorretor(copia) });
      break;
    }
    case 'nota': passoNota(el.dataset.k, +v); break;
    case 'save-aval': saveAval(); break;
    case 'aval-del-ask':
      $('#a-del').innerHTML = `<div class="confirm"><span>Apagar a avaliação de ${fmtDate(byId(form.id).avaliacoes.find(x => x.id === form.avId).data)}?</span><button class="btn-del" data-act="aval-del-yes">Apagar</button><button class="link" data-act="aval-del-no">Cancelar</button></div>`;
      $('#a-del').scrollIntoView({ block: 'nearest' });
      break;
    case 'aval-del-no': $('#a-del').innerHTML = ''; break;
    case 'aval-del-yes': {
      const c = byId(form.id), avId = form.avId; if (!c) break;
      const antes = c.avaliacoes.slice();
      closeSheet();
      saveCorretor(Object.assign({}, c, { avaliacoes: c.avaliacoes.filter(x => x.id !== avId) }));
      toast('Avaliação apagada.', { label: 'Desfazer', fn: () => { const x = byId(c.id); if (x) saveCorretor(Object.assign({}, x, { avaliacoes: antes })); } });
      break;
    }
    case 'ptipo': form.ptipo = v; renderSeg(); break;
    case 'p-ti': form.ti = form.ti === v ? '' : v; renderSeg(); break;
    case 'save-prod': saveProd(); break;
    case 'prod-del': {
      const c = byId(id); if (!c) break;
      const p = c.producao.find(x => x.id === v); if (!p) break;
      saveCorretor(Object.assign({}, c, { producao: c.producao.filter(x => x.id !== v) }));
      toast('Registro apagado.', { label: 'Desfazer', fn: () => { const x = byId(c.id); if (x) saveCorretor(Object.assign({}, x, { producao: x.producao.concat([p]) })); } });
      break;
    }
  }
});

// ── VERSÃO ──
// O GitHub Pages deixa o navegador guardar a página por 10 minutos. Ao abrir, confere se
// já existe versão nova e, se existir, abre por um endereço novo (que não está guardado).
const VERSAO = '2026-10-29a';
async function confereVersao() {
  try {
    const r = await fetch(location.pathname + '?nv=' + Date.now(), { cache: 'no-store' });
    const m = (await r.text()).match(/const VERSAO = '([^']+)'/);
    if (!m || m[1] === VERSAO) return;
    if (ui.sheet) return; // com uma avaliação aberta, não recarrega: perderia o que está sendo preenchido
    const q = new URLSearchParams(location.search);
    if (q.get('v') === m[1]) return; // já tentou esta versão: não fica em loop
    q.set('v', m[1]);
    location.replace(location.pathname + '?' + q + location.hash);
  } catch (e) {}
}
confereVersao();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') confereVersao(); });

// ── ENTRADA ──
if (TESTE) $('#teste-bar').classList.remove('hidden');
$('#bairros').innerHTML = [...new Set(BAIRROS_CWB)].sort((a, b) => a.localeCompare(b, 'pt-BR')).map(b => `<option value="${esc(b)}">`).join('');
corretores = applyPending(lsGet(LS_CACHE, []).map(cleanCorretor));
route();
refresh(true);
</script>
