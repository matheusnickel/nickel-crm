<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Elenco">
<title>Elenco · VIP Imóveis</title>
<meta property="og:title" content="Elenco · VIP Imóveis">
<meta property="og:description" content="Evolução e produção do time de angariação.">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050b1a; --sheet:#0b1530; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15);
  --text:#f4f6fb; --text2:#c6d0e6; --muted:#8d9bbb; --faint:#66759a;
  --or:#ff5a1f; --or2:#ff8a3d; --orbg:rgba(255,90,31,.12); --orline:rgba(255,122,61,.5);
  --ok:#3ddc97; --warn:#ffc65c; --red:#ff6b78; --vis:#8fa6d8;
  /* cores das notas, como no Football Manager */
  --n1:#77839e; --n2:#e9edf5; --n3:#ffc65c; --n4:#3ddc97;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{min-height:100vh;background:var(--bg);color:var(--text);font:15px/1.45 'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(800px 420px at 100% -5%,rgba(255,90,31,.13),transparent 60%),radial-gradient(700px 520px at -10% 105%,rgba(40,90,220,.14),transparent 60%);background-attachment:fixed}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
body:not(.adm) .adm{display:none!important}
body.adm .pub{display:none!important}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.muted{color:var(--muted)}
em{font-style:normal;background:linear-gradient(90deg,var(--or),var(--or2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lbl{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:9px}
.lbl .hint{text-transform:none;letter-spacing:0;font-family:'Geist',sans-serif;font-weight:500;color:var(--faint);margin-left:6px}
.kick{font-family:'Geist Mono',ui-monospace,monospace;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--or2);font-weight:600}

/* topo */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:calc(var(--sat) + 12px) 20px 12px;background:rgba(5,11,26,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:'Geist Mono',monospace;font-size:13px;letter-spacing:.14em;white-space:nowrap}
.brand i{width:8px;height:8px;background:var(--or);transform:rotate(45deg);border-radius:2px;flex-shrink:0}
.brand b{font-weight:700}.brand span{color:var(--muted)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:14px;position:relative}
.sync{font-family:'Geist Mono',monospace;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
.sync::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ok);flex-shrink:0}
.sync.busy::before{background:var(--or2);animation:pulse 1s infinite}
.sync.warn{color:var(--warn)}.sync.warn::before{background:var(--warn)}
@keyframes pulse{50%{opacity:.3}}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;font-weight:800;flex-shrink:0}
.menu{position:absolute;right:0;top:46px;background:var(--sheet);border:1px solid var(--line2);border-radius:14px;padding:6px;min-width:240px;box-shadow:0 20px 40px rgba(0,0,0,.5);z-index:40}
.menu button{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:9px;font-weight:600}
.menu button:hover{background:var(--orbg)}
.teste{background:repeating-linear-gradient(135deg,#ffc65c,#ffc65c 10px,#f5b43a 10px,#f5b43a 20px);color:#2a1a00;text-align:center;font:700 12px 'Geist Mono',monospace;letter-spacing:.12em;padding:5px}

/* botões */
.btn-or{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;font-weight:700;padding:12px 18px;border-radius:12px;box-shadow:0 10px 24px -10px rgba(255,90,31,.8);white-space:nowrap}
.btn-or.sm,.btn-ghost.sm{padding:8px 14px;font-size:14px;border-radius:10px}
.btn-or:active{transform:translateY(1px)}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);padding:11px 16px;border-radius:12px;font-weight:600;color:var(--text2);white-space:nowrap}
.btn-ghost:hover{border-color:var(--orline);color:#fff}
.link{color:var(--or2);font-weight:600;font-size:14px}
.link:hover{text-decoration:underline}

main{max-width:1180px;margin:0 auto;padding:22px 20px calc(120px + var(--sab))}
.phd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.phd h1{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.phd .sub{font-size:14px;color:var(--muted)}
.phd .r{margin-left:auto}
.group-t{display:flex;align-items:center;gap:10px;margin:30px 2px 14px}
.group-t .lbl{margin:0}
.group-t::after{content:'';flex:1;height:1px;background:var(--line)}
.group-t .gt-r{order:2}

/* chips e campos */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:99px;border:1px solid var(--line2);color:var(--text2);font-weight:600;font-size:14.5px;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--orline);color:#fff}
.chip.on{background:linear-gradient(135deg,var(--or),var(--or2));border-color:transparent;color:#fff}
.chips.sm .chip{padding:6px 12px;font-size:13.5px}
.chip.tag{background:var(--orbg);border-color:var(--orline);color:#fff;padding:7px 8px 7px 13px}
.chip.tag .rm{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:16px;line-height:1;color:var(--text2)}
.chip.tag .rm:hover{background:rgba(255,255,255,.12);color:#fff}
.chip.sug{border-style:dashed;font-size:13px;padding:6px 11px}
input,textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;line-height:1.5}
input:focus,textarea:focus{border-color:var(--orline);box-shadow:0 0 0 3px rgba(255,90,31,.16)}
input[type=date]{min-height:48px}
::placeholder{color:var(--faint)}
.fl{display:flex;flex-direction:column}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.err{color:var(--red);font-size:13.5px;font-weight:600;margin-top:6px}
.err:empty{display:none}
.hintp{font-size:13.5px;color:var(--muted);line-height:1.5}

/* números do topo */
.tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px}
.tools .lbl{margin:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:16px}
.kpis div{background:#08112a;padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.kpis b{font-size:30px;font-weight:900;letter-spacing:-.04em;line-height:1.05;font-variant-numeric:tabular-nums}
.kpis span{font-size:13px;color:var(--muted)}
.kpis .or b{color:var(--or2)}

/* ── CARTA (estilo FIFA) ── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:22px 18px}
.cardbtn{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;transition:transform .18s}
.cardbtn:hover{transform:translateY(-4px)}
.cardbtn .cap{font-size:12.5px;color:var(--muted);font-family:'Geist Mono',monospace;letter-spacing:.06em}
.fut{--c1:#18234a;--c2:#111b3b;--c3:#0b1430;--ink:#c6d0e6;--acc:#c6d0e6;--rim:linear-gradient(160deg,#3a4870,#1c2850);
  container-type:inline-size;width:100%;max-width:260px;aspect-ratio:.72;position:relative;filter:drop-shadow(0 16px 22px rgba(0,0,0,.5))}
.fut-s,.fut-i{position:absolute;clip-path:polygon(0 6.5%,29% 6.5%,50% 0,71% 6.5%,100% 6.5%,100% 87%,50% 100%,0 87%)}
.fut-s{inset:0;background:var(--rim)}
.fut-i{inset:1.8cqw;color:var(--ink);overflow:hidden;
  background:radial-gradient(circle at 26% 18%,rgba(255,255,255,.42),transparent 42%),repeating-linear-gradient(118deg,rgba(255,255,255,.06) 0 2px,transparent 2px 10px),linear-gradient(165deg,var(--c1),var(--c2) 52%,var(--c3))}
.fut-o{position:absolute;left:9cqw;top:15cqw;display:flex;flex-direction:column;align-items:center;gap:1.5cqw;z-index:2}
.fut-o b{font-size:18cqw;font-weight:900;letter-spacing:-.06em;line-height:.9;color:var(--acc);font-variant-numeric:tabular-nums}
.fut-o span{font:700 6cqw 'Geist Mono',monospace;letter-spacing:.06em}
.fut-o i{width:9cqw;height:1px;background:currentColor;opacity:.35}
.fut-o small{font:700 4.6cqw 'Geist Mono',monospace;letter-spacing:.12em;opacity:.75}
.fut-ph{position:absolute;right:6cqw;top:11cqw;width:62cqw;height:62cqw;-webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent)}
.fut-ph img{width:100%;height:100%;object-fit:cover;border-radius:6cqw 6cqw 0 0}
.fut-ph .ini{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:24cqw;font-weight:900;letter-spacing:-.04em;opacity:.28}
.fut-n{position:absolute;left:8cqw;right:8cqw;top:74cqw;text-align:center;font-size:8.4cqw;font-weight:800;text-transform:uppercase;letter-spacing:.02em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:2.4cqw;border-bottom:1px solid currentColor;border-color:color-mix(in srgb,currentColor 30%,transparent)}
.fut-st{position:absolute;left:12cqw;right:12cqw;top:88cqw;display:grid;grid-template-columns:1fr 1fr;column-gap:6cqw;row-gap:1.6cqw}
.fut-st div{display:flex;align-items:baseline;gap:2.4cqw;font-size:7cqw;line-height:1.15}
.fut-st div:nth-child(even){border-left:1px solid color-mix(in srgb,currentColor 30%,transparent);padding-left:5cqw}
.fut-st b{font-weight:900;min-width:9cqw;text-align:right;font-variant-numeric:tabular-nums}
.fut-st span{font:600 5.6cqw 'Geist Mono',monospace;letter-spacing:.04em;opacity:.85}
.fut.t-bronze{--c1:#f2c9a5;--c2:#c88b5e;--c3:#8e5733;--ink:#2b1407;--acc:#2b1407;--rim:linear-gradient(160deg,#ffe2c8,#9a5f37)}
.fut.t-prata{--c1:#f7f9fb;--c2:#c9d0da;--c3:#8f99a7;--ink:#151c28;--acc:#151c28;--rim:linear-gradient(160deg,#ffffff,#8c96a5)}
.fut.t-ouro{--c1:#fcebab;--c2:#e2b851;--c3:#b07f22;--ink:#291b02;--acc:#291b02;--rim:linear-gradient(160deg,#fff6d2,#a8771c)}
.fut.t-elite{--c1:#22336a;--c2:#132049;--c3:#080f27;--ink:#f4f6fb;--acc:#ff8a3d;--rim:linear-gradient(160deg,#ffb27a,#ff5a1f 45%,#7a2a0b)}
.fut.t-elite .fut-i{background:radial-gradient(circle at 26% 18%,rgba(255,138,61,.35),transparent 45%),repeating-linear-gradient(118deg,rgba(255,255,255,.05) 0 2px,transparent 2px 10px),linear-gradient(165deg,var(--c1),var(--c2) 52%,var(--c3))}
.fut.t-novo .fut-i{background:repeating-linear-gradient(118deg,rgba(255,255,255,.035) 0 2px,transparent 2px 10px),linear-gradient(165deg,var(--c1),var(--c2) 52%,var(--c3))}
.fut.t-novo .fut-o b{opacity:.5}

/* evolução do elenco */
.evo{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.evr{display:grid;grid-template-columns:minmax(180px,1.3fr) minmax(200px,2fr) 92px 92px 82px;align-items:center;gap:18px;padding:14px 18px;text-align:left;width:100%;background:rgba(255,255,255,.02);border-top:1px solid var(--line);transition:background .15s}
.evr:first-child{border-top:none}
.evr:hover{background:rgba(255,255,255,.05)}
.evr.hd{background:#08112a;padding:10px 18px;cursor:default;font:600 11.5px 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.evr.hd:hover{background:#08112a}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.av{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.07);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font:700 14px 'Geist Mono',monospace;color:var(--or2);flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.who .nm{font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .mt{font-size:12.5px;color:var(--muted)}
.evb-w{display:flex;align-items:center;gap:12px}
.evb{position:relative;flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.evb i{position:absolute;top:0;bottom:0;border-radius:99px}
.evb .base{left:0;background:rgba(255,138,61,.38)}
.evb .gain{background:linear-gradient(90deg,var(--or),var(--or2));border-radius:0 99px 99px 0}
.evb .loss{background:repeating-linear-gradient(135deg,rgba(255,107,120,.55) 0 3px,transparent 3px 6px)}
.ovr{display:inline-flex;align-items:baseline;gap:6px;white-space:nowrap}
.ovr b{font-size:22px;font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.dl{font:700 12px 'Geist Mono',monospace;white-space:nowrap}
.dl.up{color:var(--ok)}.dl.dn{color:var(--red)}.dl.eq{color:var(--faint)}
.pn{display:flex;flex-direction:column;gap:5px}
.pn b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.pn .bar{height:4px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.pn .bar i{display:block;height:100%;border-radius:99px;background:var(--vis)}
.pn.a .bar i{background:linear-gradient(90deg,var(--or),var(--or2))}
.cv{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text2)}
.cv small{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}
.lbm{display:none;font:600 10.5px 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* legenda */
.legend{margin-top:30px;border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;font-size:14px;color:var(--text2);line-height:1.5}
.legend h4{font:600 12px 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.legend .sw{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px}
.legend .sw span{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.legend .sw i{width:10px;height:10px;border-radius:3px}

/* ── FICHA ── */
.back{display:inline-flex;align-items:center;gap:8px;color:var(--text2);font-weight:600;font-size:14.5px;padding:6px 0;margin-bottom:14px}
.back:hover{color:#fff}
.fhero{display:grid;grid-template-columns:280px minmax(0,1fr);gap:34px;align-items:center}
.fhero .fut{max-width:280px}
.finfo h1{font-size:40px;font-weight:900;letter-spacing:-.045em;line-height:1.02;margin:6px 0 16px;overflow-wrap:anywhere}
.tierp{display:inline-flex;align-items:center;gap:8px}
.tierp i{width:10px;height:10px;border-radius:3px;transform:rotate(45deg)}
.facts{display:flex;flex-wrap:wrap;gap:10px 28px;margin-bottom:18px}
.facts div{display:flex;flex-direction:column}
.facts span{font:600 11px 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.facts b{font-size:16px;font-weight:700}
.stars{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.stars div{display:flex;gap:9px;align-items:baseline;font-size:15px;font-weight:600}
.stars div::before{content:'★';color:var(--n3);font-size:14px}
.evol{font-size:14.5px;color:var(--text2);margin-bottom:4px}
.evol b{color:var(--or2);font-weight:700}
.fact{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

/* atributos (estilo Football Manager) */
.fm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;background:#060d20;border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:10px}
.fm-c{display:flex;flex-direction:column;gap:2px;padding:0 4px}
.fm-h{display:flex;align-items:baseline;justify-content:space-between;padding:6px 10px 10px;font:700 12.5px 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase}
.fm-h small{display:block;font:500 12px 'Geist',sans-serif;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:2px}
.fm-h b{font-size:18px;letter-spacing:-.02em;color:var(--text)}
.fm-r{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#0c1631;border-left:3px solid transparent;font-size:14.5px}
.fm-r:nth-child(odd){background:#0a132b}
.fm-r.hi{background:linear-gradient(90deg,rgba(61,220,151,.16),rgba(61,220,151,.05));border-left-color:var(--n4)}
.fm-r .an{flex:1;min-width:0;cursor:help}
.fm-r .dl{font-size:11px}
.nv{font-size:16px;font-weight:800;min-width:24px;text-align:right;font-variant-numeric:tabular-nums}
.n0{color:var(--faint)}.n1{color:var(--n1)}.n2{color:var(--n2)}.n3{color:var(--n3)}.n4{color:var(--n4)}
.fm-leg{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
.fm-leg b{font-weight:800}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.box{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.box-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.box-h h3{font-size:17px;font-weight:800;letter-spacing:-.02em}
.box-h .r{margin-left:auto}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:'Geist Mono',monospace}
.sum{display:flex;gap:26px;flex-wrap:wrap}
.sum div{display:flex;flex-direction:column}
.sum b{font-size:28px;font-weight:900;letter-spacing:-.04em;line-height:1.05;font-variant-numeric:tabular-nums}
.sum span{font-size:12.5px;color:var(--muted)}
.sum .v b{color:var(--vis)}.sum .a b{color:var(--or2)}
.keyl{display:flex;gap:16px;font-size:12.5px;color:var(--muted)}
.keyl span{display:inline-flex;align-items:center;gap:6px}
.keyl i{width:10px;height:10px;border-radius:3px;background:var(--vis)}
.keyl .a i{background:var(--or2)}
.empty-s{border:1px dashed var(--line2);border-radius:14px;padding:22px 18px;text-align:center;color:var(--muted);font-size:14px}
.empty-s .btn-or{margin-top:12px}
.empty{border:1px dashed var(--line2);border-radius:20px;padding:40px 26px;text-align:center;color:var(--text2)}
.empty h3{font-size:22px;font-weight:800;color:#fff;margin-bottom:6px}
.empty .btn-or{margin-top:18px}

.ls{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:flex-start;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;font-size:14px}

    const i = list.findIndex(c => c.id === id);
    if (p[id].__del) { if (i >= 0) list.splice(i, 1); }
    else { const c = cleanCorretor(Object.assign({}, p[id], { id })); if (i >= 0) list[i] = c; else list.push(c); }
  }
  return list;
}
async function fetchAll() {
  const out = []; let tok = '';
  do {
    const r = await fetch(`${FB_ROOT}/${COL}?key=${FB_KEY}&pageSize=300` + (tok ? '&pageToken=' + encodeURIComponent(tok) : ''));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    (j.documents || []).forEach(d => { const o = fromFs({ mapValue: { fields: d.fields || {} } }); o.id = d.name.split('/').pop(); out.push(cleanCorretor(o)); });
    tok = j.nextPageToken || '';
  } while (tok);
  return out;
}
let loaded = false;
async function refresh(silent) {

    persistCache(); loaded = true; failing = false;

}

function updateSync() {

function inicioPeriodo(p) {
  const d = new Date();
  if (p === 'tudo') return '';

// ── GRÁFICOS ──
function graficoEvo(c) {
  const pts = c.avaliacoes.map(a => ({ d: a.data, o: ovr(a.notas) })).filter(p => p.o !== null);
  if (pts.length < 2) return `<div class="empty-s">${pts.length ? `Overall atual: <b style="color:var(--text)">${pts[0].o}</b>. A linha de evolução aparece a partir da segunda avaliação.` : 'A linha de evolução aparece depois das avaliações.'}</div>`;
  const W = 560, H = 210, L = 34, R = 18, T = 26, B = 30;
  const vals = pts.map(p => p.o);
  const lo = Math.max(0, Math.floor((Math.min(...vals) - 6) / 10) * 10), hi = Math.min(100, Math.ceil((Math.max(...vals) + 6) / 10) * 10);
  const step = hi - lo > 50 ? 20 : 10;
  const x = i => L + i * (W - L - R) / (pts.length - 1), y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const each = Math.ceil(pts.length / 7);
  let g = '';
  for (let v = lo; v <= hi; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.07)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#66759a">${v}</text>`;
  const line = pts.map((p, i) => `${x(i)},${y(p.o)}`).join(' ');
  const area = `${x(0)},${y(lo)} ${line} ${x(pts.length - 1)},${y(lo)}`;
  const dots = pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.o)}" r="4.5" fill="#ff8a3d" stroke="#0b1530" stroke-width="2"/>` +
    `<text x="${x(i)}" y="${y(p.o) - 11}" text-anchor="middle" font-size="12" font-weight="700" fill="#f4f6fb">${p.o}</text>` +
    (i % each === 0 || i === pts.length - 1 ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#8d9bbb">${fmtShort(p.d)}</text>` : '')).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução do overall">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5a1f" stop-opacity=".28"/><stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/></linearGradient></defs>
    ${g}<polygon points="${area}" fill="url(#ga)"/><polyline points="${line}" fill="none" stroke="#ff8a3d" stroke-width="2.5" stroke-linejoin="round"/>${dots}</svg>`;
}
function graficoProd(c) {
  const d = new Date(); d.setDate(1);
  const meses = [];
  for (let i = 5; i >= 0; i--) { const m = new Date(d.getFullYear(), d.getMonth() - i, 1); meses.push(`${m.getFullYear()}-${pad(m.getMonth() + 1)}`); }
  const cont = meses.map(m => ({ m, v: c.producao.filter(p => p.tipo === 'visita' && p.data.startsWith(m)).length, a: c.producao.filter(p => p.tipo === 'angariacao' && p.data.startsWith(m)).length }));
  if (!cont.some(x => x.v || x.a)) return `<div class="empty-s">Os últimos 6 meses aparecem aqui conforme as visitas e angariações forem registradas.</div>`;
  const W = 560, H = 190, L = 10, R = 10, T = 22, B = 28;
  const max = Math.max(1, ...cont.map(x => Math.max(x.v, x.a)));
  const gw = (W - L - R) / 6, bw = Math.min(26, gw / 3.2);
  const y = v => T + (H - T - B) * (1 - v / max);
  const bars = cont.map((x, i) => {
    const cx = L + gw * i + gw / 2;
    const one = (v, xx, cor) => `<rect x="${xx}" y="${y(v)}" width="${bw}" height="${Math.max(0, H - B - y(v))}" rx="4" fill="${cor}"/>` + (v ? `<text x="${xx + bw / 2}" y="${y(v) - 6}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c6d0e6">${v}</text>` : '');
    return one(x.v, cx - bw - 2, '#8fa6d8') + one(x.a, cx + 2, '#ff8a3d') +
      `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#8d9bbb">${MESES[+x.m.slice(5) - 1]}</text>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Produção dos últimos 6 meses"><line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="rgba(255,255,255,.1)"/>${bars}</svg>
    <div class="keyl"><span><i></i>Visitas</span><span class="a"><i></i>Angariações</span><span>· últimos 6 meses</span></div>`;
}

  render();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

// ── FOLHAS ──
function openSheet(html, state) {
  ui.sheet = state;
  $('#sheet').innerHTML = html;
  $('#ov').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}
function closeSheet() {
  ui.sheet = null; form = null;
  $('#ov').classList.add('hidden');
  $('#sheet').innerHTML = '';
  document.body.style.overflow = '';
}
$('#ov').addEventListener('mousedown', e => { if (e.target.id === 'ov') closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.sheet) closeSheet(); });
const shHead = (kick, title) => `<div class="sh-h"><div><span class="kick">${kick}</span><h2>${title}</h2></div><button class="x" data-act="fechar" aria-label="Fechar">×</button></div>`;

function sheetLogin() {
  openSheet(shHead('Modo edição', 'Entrar') + `<form id="lg-form" class="sh-b" autocomplete="on">
    <p class="hintp">Quem abre o link sem senha só vê o elenco. Para cadastrar corretores, avaliar e registrar produção, entre com a senha.</p>
    <input type="password" id="lg-pass" placeholder="Senha" autocomplete="current-password" aria-label="Senha">
    <div class="err" id="lg-err"></div>
    <button class="btn-or" type="submit">Entrar</button></form>`, 'login');
  setTimeout(() => $('#lg-pass').focus(), 50);
  $('#lg-form').addEventListener('submit', e => {
    e.preventDefault();
    if ($('#lg-pass').value === SENHA) { admin = true; lsSet(LS_AUTH, true); closeSheet(); render(); refresh(true); toast('Modo edição ligado neste aparelho.'); }
    else { $('#lg-err').textContent = 'Senha incorreta.'; $('#lg-pass').select(); }
  });
}

// perfil do corretor
function sheetPerfil(id) {
  const c = id ? byId(id) : cleanCorretor({});
  if (id && !c) return;
  form = { tipo: 'perfil', id: id || null, foto: c.foto, destaques: c.destaques.slice(), del: false };
  openSheet(shHead(id ? 'Editar perfil' : 'Novo corretor', id ? esc(c.nome) : 'Adicionar ao elenco') + `<div class="sh-b">
    <div class="fotoed"><div class="pv" id="f-pv"></div><div class="bt">
      <label class="btn-ghost sm" for="f-foto">Escolher foto</label><input type="file" id="f-foto" accept="image/*" class="hidden">
      <button class="link" data-act="foto-rm" id="f-foto-rm">Remover foto</button></div></div>
    <div class="fl"><label class="lbl" for="f-nome">Nome</label><input id="f-nome" value="${esc(c.nome)}" placeholder="Nome e sobrenome" autocomplete="off"><div class="err" id="e-nome"></div></div>
    <div class="row2">
      <div class="fl"><label class="lbl" for="f-nasc">Nascimento</label><input id="f-nasc" type="date" value="${esc(c.nascimento)}"></div>
      <div class="fl"><label class="lbl" for="f-desde">Na VIP desde</label><input id="f-desde" type="date" value="${esc(c.desde)}"></div>
    </div>
    <div><span class="lbl">Destaques<span class="hint">a "perna boa": aparece com ★ na ficha</span></span>
      <div class="chips" id="f-dest"></div>
      <div style="display:flex;gap:8px;margin-top:10px"><input id="f-dest-in" placeholder="Escreva um destaque e toque em Adicionar" autocomplete="off"><button class="btn-ghost" data-act="dest-add">Adicionar</button></div>
      <div class="chips" id="f-sug" style="margin-top:10px"></div></div>
    <div class="fl"><label class="lbl" for="f-evol">A evoluir<span class="hint">o principal ponto de desenvolvimento</span></label><input id="f-evol" value="${esc(c.evoluir)}" placeholder="Ex.: contorno de objeções sobre exclusividade" autocomplete="off"></div>
    <div id="f-del"></div>
  </div>
  <div class="sh-f">${id ? '<button class="danger l" data-act="del-ask">Tirar do elenco</button>' : ''}<button class="btn-ghost" data-act="fechar">Cancelar</button><button class="btn-or" data-act="save-perfil">Salvar</button></div>`, 'perfil');
  renderFotoPrev(); renderDest();
  $('#f-foto').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try { form.foto = await lerFoto(f); renderFotoPrev(); } catch (er) { toast('Não consegui abrir essa foto. Tente outra.'); }
    e.target.value = '';
  });
  $('#f-dest-in').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addDest(e.target.value); } });
  if (!id) setTimeout(() => $('#f-nome').focus(), 50);
}
function renderFotoPrev() {
  const pv = $('#f-pv'); if (!pv) return;
  pv.style.backgroundImage = form.foto ? `url("${form.foto}")` : '';
  pv.textContent = form.foto ? '' : initials($('#f-nome') ? $('#f-nome').value : '');
  $('#f-foto-rm').classList.toggle('hidden', !form.foto);
}
function renderDest() {
  $('#f-dest').innerHTML = form.destaques.map((d, i) => `<span class="chip tag">★ ${esc(d)}<button class="rm" data-act="dest-rm" data-v="${i}" aria-label="Remover">×</button></span>`).join('') || '<span class="muted" style="font-size:14px">Nenhum destaque ainda.</span>';
  $('#f-sug').innerHTML = SUGESTOES.filter(s => !form.destaques.includes(s)).map(s => `<button class="chip sug" data-act="dest-add" data-v="${esc(s)}">+ ${esc(s)}</button>`).join('');
}
function addDest(v) {
  const inp = $('#f-dest-in');
  const t = String(v ?? inp.value).trim();
  if (!t || form.destaques.includes(t)) { if (v === undefined) inp.value = ''; return; }
  form.destaques.push(t);
  if (v === undefined) inp.value = '';
  renderDest();
}
// recorta quadrado (um pouco para cima, onde fica o rosto) e reduz para caber no Firebase
function lerFoto(file) {
  return new Promise((ok, no) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const S = 440, s = Math.min(img.width, img.height), cv = document.createElement('canvas');
      cv.width = cv.height = S;
      cv.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) * 0.25, s, s, 0, 0, S, S);
      URL.revokeObjectURL(url);
      ok(cv.toDataURL('image/jpeg', 0.84));
    };
    img.onerror = () => { URL.revokeObjectURL(url); no(new Error('imagem')); };
    img.src = url;
  });
}
function savePerfil() {
  const nome = $('#f-nome').value.trim().replace(/\s+/g, ' ');
  if (!nome) { $('#e-nome').textContent = 'Coloque o nome.'; $('#f-nome').focus(); return; }
  if ($('#f-dest-in').value.trim()) addDest();
  const base = form.id ? byId(form.id) : { id: newId('k') };
  const c = saveCorretor(Object.assign({}, base, { nome, nascimento: $('#f-nasc').value, desde: $('#f-desde').value, foto: form.foto, destaques: form.destaques, evoluir: $('#f-evol').value.trim() }));
  const novo = !form.id;
  closeSheet();
  if (novo) { ui.fromElenco = true; location.hash = 'c/' + encodeURIComponent(c.id); toast(`${firstName(c.nome)} entrou no elenco.`); }
  else toast('Perfil salvo.');
}

// avaliação: notas de 0 a 20
function sheetAval(id, avId) {
  const c = byId(id); if (!c) return;
  const idx = avId ? c.avaliacoes.findIndex(a => a.id === avId) : -1;
  if (avId && idx < 0) return;
  const atual = idx >= 0 ? c.avaliacoes[idx] : null;
  const ref = idx >= 0 ? c.avaliacoes[idx - 1] || null : ultima(c); // contra o que comparar
  form = { tipo: 'aval', id, avId: avId || null, notas: Object.assign({}, atual ? atual.notas : ref ? ref.notas : {}), ref: ref ? ref.notas : {}, del: false };
  const linhas = g => `<div class="ag"><div class="ag-t">${g.nome} · ${g.sub.toLowerCase()}</div>${g.attrs.map(([k, nome, desc]) => `
    <div class="ar"><div class="an"><b>${nome}</b><small>${desc}</small>${typeof form.ref[k] === 'number' ? `<div class="pr" id="pr-${k}"></div>` : ''}</div>
      <div class="stp"><button data-act="nota" data-k="${k}" data-v="-1" aria-label="Diminuir ${nome}">−</button><input id="n-${k}" inputmode="numeric" maxlength="2" aria-label="${nome}" value="${form.notas[k] ?? ''}" placeholder="–"><button data-act="nota" data-k="${k}" data-v="1" aria-label="Aumentar ${nome}">+</button></div></div>`).join('')}</div>`;
  openSheet(shHead(atual ? 'Editar avaliação' : 'Nova avaliação', esc(c.nome)) + `<div class="sh-b">
    <div class="liveo"><div class="o"><b id="lv-o">–</b><span>OVERALL</span></div><div class="g">${GRUPOS.map(g => `<span>${g.sigla}<b id="lv-${g.k}">–</b></span>`).join('')}</div></div>
    <div class="row2"><div class="fl"><label class="lbl" for="a-data">Data da conversa</label><input id="a-data" type="date" value="${atual ? atual.data : hoje()}"></div></div>
    <p class="hintp">${ref && !atual ? 'Já vem com as notas da última avaliação: mude só o que evoluiu.' : 'Nota de 0 a 20 em cada atributo, como no Football Manager. Pode deixar em branco o que ainda não deu para avaliar.'}</p>
    ${GRUPOS.map(linhas).join('')}
    <div class="fl"><label class="lbl" for="a-obs">O que conversamos<span class="hint">opcional</span></label><textarea id="a-obs" rows="3" placeholder="Combinados, o que melhorou, o que focar até a próxima">${esc(atual ? atual.obs : '')}</textarea></div>
    <div id="a-del"></div>
  </div>
  <div class="sh-f">${atual ? '<button class="danger l" data-act="aval-del-ask">Apagar avaliação</button>' : ''}<button class="btn-ghost" data-act="fechar">Cancelar</button><button class="btn-or" data-act="save-aval">Salvar avaliação</button></div>`, 'aval');
  ATTRS.forEach(a => {
    $('#n-' + a.k).addEventListener('input', e => {
      const d = e.target.value.replace(/\D/g, '').slice(0, 2);
      e.target.value = d;
      if (d === '') delete form.notas[a.k]; else form.notas[a.k] = Math.min(20, +d);
      if (d !== '' && +d > 20) e.target.value = '20';
      pintaNota(a.k);
    });
    pintaNota(a.k);
  });
}
function pintaNota(k) {
  const inp = $('#n-' + k); if (!inp) return;
  const v = form.notas[k];
  inp.className = nivel(v);
  const pr = $('#pr-' + k), p = form.ref[k];
  if (pr) pr.innerHTML = `antes ${p}` + (typeof v === 'number' && v !== p ? ' ' + delta(v - p) : '');
  const o = ovr(form.notas);
  $('#lv-o').textContent = o === null ? '–' : o;
  $('#lv-o').style.color = o === null ? '' : TIER_COR[tier(o)];
  GRUPOS.forEach(g => { const x = grp(form.notas, g.k); $('#lv-' + g.k).textContent = x === null ? '–' : x; });
}
function passoNota(k, d) {
  const v = form.notas[k];
  form.notas[k] = typeof v !== 'number' ? 10 : Math.max(0, Math.min(20, v + d));
  $('#n-' + k).value = form.notas[k];
  pintaNota(k);
}
function saveAval() {
  const c = byId(form.id); if (!c) return closeSheet();
  const data = $('#a-data').value || hoje();
  const notas = cleanNotas(form.notas);
  if (!Object.keys(notas).length) { toast('Dê nota em pelo menos um atributo.'); return; }
  const obs = $('#a-obs').value.trim();
  const avs = form.avId
    ? c.avaliacoes.map(a => a.id === form.avId ? Object.assign({}, a, { data, notas, obs }) : a)
    : c.avaliacoes.concat([{ id: newId('a'), data, notas, obs }]);
  const editando = !!form.avId;
  saveCorretor(Object.assign({}, c, { avaliacoes: avs }));
  closeSheet();
  toast(editando ? 'Avaliação atualizada.' : `Avaliação salva. Overall ${ovr(notas)}.`);
}

// produção: visita de angariação / angariação realizada
function sheetProd(id, tipo) {
  const c = byId(id); if (!c) return;
  form = { tipo: 'prod', id, ptipo: PROD[tipo] ? tipo : 'visita' };
  openSheet(shHead('Registrar produção', esc(c.nome)) + `<div class="sh-b">
    <div class="seg" id="p-seg"></div>
    <div class="row2"><div class="fl"><label class="lbl" for="p-data">Data</label><input id="p-data" type="date" value="${hoje()}"></div></div>
    <div class="fl"><label class="lbl" for="p-imovel">Imóvel<span class="hint">opcional</span></label><input id="p-imovel" placeholder="Ex.: Casa no Santa Felicidade, Rua…" autocomplete="off"></div>
    <div class="fl"><label class="lbl" for="p-obs">Observação<span class="hint">opcional</span></label><input id="p-obs" placeholder="Ex.: exclusividade de 90 dias" autocomplete="off"></div>
  </div>
  <div class="sh-f"><button class="btn-ghost" data-act="fechar">Cancelar</button><button class="btn-or" data-act="save-prod">Registrar</button></div>`, 'prod');
  renderSeg();
}
function renderSeg() {
  $('#p-seg').innerHTML = Object.entries(PROD).map(([k, l]) => `<button class="${form.ptipo === k ? 'on' : ''}" data-act="ptipo" data-v="${k}">${l}</button>`).join('');
}
function saveProd() {
  const c = byId(form.id); if (!c) return closeSheet();
  const p = { id: newId('p'), data: $('#p-data').value || hoje(), tipo: form.ptipo, imovel: $('#p-imovel').value.trim(), obs: $('#p-obs').value.trim() };
  saveCorretor(Object.assign({}, c, { producao: c.producao.concat([p]) }));
  closeSheet();
  toast(`${p.tipo === 'visita' ? 'Visita' : 'Angariação'} registrada para ${firstName(c.nome)}.`, { label: 'Desfazer', fn: () => { const x = byId(c.id); if (x) saveCorretor(Object.assign({}, x, { producao: x.producao.filter(y => y.id !== p.id) })); } });
}

// ── TOAST ──
let toastT;
function toast(msg, action) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button id="toast-a">${esc(action.label)}</button>` : '');
  t.classList.remove('hidden');
  if (action) $('#toast-a').onclick = () => { t.classList.add('hidden'); action.fn(); };
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), action ? 6000 : 3200);
}
async function copiar(txt) {
  try { await navigator.clipboard.writeText(txt); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (er) {}
    ta.remove(); return ok;
  }
}

// ── AÇÕES ──
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (!e.target.closest('#menu')) $('#menu').classList.add('hidden'); return; }
  const a = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  if (a !== 'menu') $('#menu').classList.add('hidden');
  switch (a) {
    case 'menu': $('#menu').classList.toggle('hidden'); break;
    case 'entrar': sheetLogin(); break;
    case 'sair': admin = false; lsSet(LS_AUTH, false); render(); toast('Modo edição desligado neste aparelho.'); break;
    case 'copiar-link': {
      const url = location.origin + location.pathname + (TESTE ? '?base=teste' : '');
      copiar(url).then(ok => toast(ok ? 'Link copiado. Quem abrir vê o elenco, sem poder editar.' : url));
      break;
    }
    case 'recarregar': refresh(); break;
    case 'abrir': ui.fromElenco = true; location.hash = 'c/' + encodeURIComponent(id); break;
    case 'voltar':
      if (ui.fromElenco) { ui.fromElenco = false; history.back(); }
      else { history.replaceState(null, '', location.pathname + location.search); route(); }
      break;
    case 'per': ui.per = v; lsSet(LS_PER, v); render(); break;
    case 'prod-all': ui.prodAll = true; render(); break;
    case 'novo': sheetPerfil(); break;
    case 'perfil': sheetPerfil(id); break;
    case 'aval': sheetAval(id, el.dataset.av); break;
    case 'prod': sheetProd(id, v); break;
    case 'fechar': closeSheet(); break;
    case 'foto-rm': form.foto = ''; renderFotoPrev(); break;
    case 'dest-add': addDest(v); break;
    case 'dest-rm': form.destaques.splice(+v, 1); renderDest(); break;
    case 'save-perfil': savePerfil(); break;
    case 'del-ask': {
      const c = byId(form.id);
      $('#f-del').innerHTML = `<div class="confirm"><span>Tirar ${esc(firstName(c.nome))} do elenco? Some a carta, as avaliações e a produção.</span><button class="btn-del" data-act="del-yes">Tirar</button><button class="link" data-act="del-no">Cancelar</button></div>`;
      $('#f-del').scrollIntoView({ block: 'nearest' });
      break;
    }
    case 'del-no': $('#f-del').innerHTML = ''; break;
    case 'del-yes': {
      const c = byId(form.id); if (!c) break;
      const copia = JSON.parse(JSON.stringify(c));
      closeSheet(); removeCorretor(c.id);
      history.replaceState(null, '', location.pathname + location.search); ui.fromElenco = false; route();
      toast(`${firstName(c.nome)} saiu do elenco.`, { label: 'Desfazer', fn: () => saveCorretor(copia) });
      break;
    }
    case 'nota': passoNota(el.dataset.k, +v); break;
    case 'save-aval': saveAval(); break;
    case 'aval-del-ask':
      $('#a-del').innerHTML = `<div class="confirm"><span>Apagar a avaliação de ${fmtDate(byId(form.id).avaliacoes.find(x => x.id === form.avId).data)}?</span><button class="btn-del" data-act="aval-del-yes">Apagar</button><button class="link" data-act="aval-del-no">Cancelar</button></div>`;
      $('#a-del').scrollIntoView({ block: 'nearest' });
      break;
    case 'aval-del-no': $('#a-del').innerHTML = ''; break;
    case 'aval-del-yes': {
      const c = byId(form.id), avId = form.avId; if (!c) break;
      const antes = c.avaliacoes.slice();
      closeSheet();
      saveCorretor(Object.assign({}, c, { avaliacoes: c.avaliacoes.filter(x => x.id !== avId) }));
      toast('Avaliação apagada.', { label: 'Desfazer', fn: () => { const x = byId(c.id); if (x) saveCorretor(Object.assign({}, x, { avaliacoes: antes })); } });
      break;
    }
    case 'ptipo': form.ptipo = v; renderSeg(); break;
    case 'save-prod': saveProd(); break;
    case 'prod-del': {
      const c = byId(id); if (!c) break;
      const p = c.producao.find(x => x.id === v); if (!p) break;
      saveCorretor(Object.assign({}, c, { producao: c.producao.filter(x => x.id !== v) }));
      toast('Registro apagado.', { label: 'Desfazer', fn: () => { const x = byId(c.id); if (x) saveCorretor(Object.assign({}, x, { producao: x.producao.concat([p]) })); } });
      break;
    }
  }
});

// ── ENTRADA ──
if (TESTE) $('#teste-bar').classList.remove('hidden');
corretores = applyPending(lsGet(LS_CACHE, []).map(cleanCorretor));
route();
refresh(true);
</script>
