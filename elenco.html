<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f4f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Elenco">
<title>Elenco · VIP Imóveis</title>
<meta property="og:title" content="Elenco · VIP Imóveis">
<meta property="og:description" content="Atributos, evolução e produção do time de angariação.">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Mesmo visual da Carteira (pedido do Matheus em 01/11/2026): Open Sans, fundo claro, cartões brancos.
   Laranja = ação; verde-água = selecionado e "faz sozinho"; âmbar = "fez acompanhado". */
:root{
  --bg:#f3f4f2; --bg2:#e9ebe8; --bg3:#f7f7f5; --hov:#f3f4f2; --card:#fff; --sheet:#fff;
  --line:rgba(40,42,46,.08); --line2:rgba(40,42,46,.14);
  --text:#2c2e33; --text2:#55585e; --muted:#878787; --faint:#b9bbbd; --ink:#2c2e33;
  --or:#e0662c; --or-h:#c9551f; --or2:#b8521f; --orbg:#fcece2; --orline:rgba(224,102,44,.3);
  --tq:#7cc1ba; --tq2:#3f8c84; --tqbg:#e4f3f1;
  --ok:#3f8c84; --warn:#a6751c; --warnbg:#f8eed8; --red:#b4474b; --vis:#3f8c84;
  --sh1:0 1px 2px rgba(40,42,46,.04),0 6px 18px -10px rgba(40,42,46,.14);
  --sh2:0 2px 4px rgba(40,42,46,.04),0 24px 48px -18px rgba(40,42,46,.22);
  /* tela de jogador do Football Manager, versão clara */
  --fm0:#fff; --fm1:#fff; --fm2:#fafaf8; --fmhi:rgba(124,193,186,.16);
  --n1:#a9acb0; --n2:#55585e; --n3:#a6751c; --n4:#3f8c84;
  --g-tec:#7cc1ba; --g-men:#e0662c; --g-pos:#a6751c;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{min-height:100vh;background:var(--bg);color:var(--text);font:400 15px/1.5 'Open Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
body:not(.adm) .adm{display:none!important}
body.adm .pub{display:none!important}
.muted{color:var(--muted)}
.lbl{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:10px}
.lbl .hint{text-transform:none;letter-spacing:0;font-weight:400;color:var(--faint);margin-left:6px}
.kick{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--or2);font-weight:600}

/* topo, igual ao da Carteira: marca, abas em verde-água e o menu à direita */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;height:calc(var(--sat) + 64px);padding:var(--sat) 28px 0;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap}
.brand i{width:7px;height:7px;background:var(--or);transform:rotate(45deg);flex-shrink:0}
.brand b{font-weight:700}.brand span{color:var(--muted);font-weight:300}
.tabs{display:flex;gap:4px;margin-left:16px}
.tabs a{padding:8px 14px;border-radius:4px;color:var(--text2);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;transition:background .2s,color .2s}
.tabs a:hover{color:var(--text)}
.tabs a.on{background:var(--tq);color:#fff}
.top-r{margin-left:auto;display:flex;align-items:center;gap:14px;position:relative}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
.sync::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--tq);flex-shrink:0}
.sync.busy::before{background:var(--or);animation:pulse 1s infinite}
.sync.warn{color:var(--warn)}.sync.warn::before{background:var(--warn)}
@keyframes pulse{50%{opacity:.3}}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;font-weight:300;font-size:16px;flex-shrink:0}
.menu{position:absolute;right:0;top:46px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:240px;box-shadow:var(--sh2);z-index:40}
.menu button{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:8px;font-weight:600;font-size:14px}
.menu button:hover{background:var(--bg)}
.teste{background:repeating-linear-gradient(135deg,#f6e3b4,#f6e3b4 10px,#efd79b 10px,#efd79b 20px);color:#5a4210;text-align:center;font-weight:700;font-size:11.5px;letter-spacing:.14em;padding:5px}

/* botões: o laranja é sempre ação */
.btn-or{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--or);color:#fff;font-weight:600;padding:12px 20px;border-radius:10px;box-shadow:0 10px 22px -14px rgba(224,102,44,.9);white-space:nowrap;transition:background .15s,transform .15s}
.btn-or:hover{background:var(--or-h)}
.btn-or:disabled{opacity:.6;cursor:default}
.btn-or.sm,.btn-ghost.sm{padding:9px 15px;font-size:14px;border-radius:8px}
.btn-or:active{transform:translateY(1px)}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--card);border:1px solid var(--line2);padding:11px 18px;border-radius:10px;font-weight:600;color:var(--text);white-space:nowrap;transition:border-color .15s,color .15s}
.btn-ghost:hover{border-color:var(--tq);color:var(--tq2)}
.link{color:var(--or2);font-weight:600;font-size:14px}
.link:hover{text-decoration:underline}

main{max-width:1180px;margin:0 auto;padding:30px 28px calc(120px + var(--sab))}
.phd{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.phd h1{font-weight:300;font-size:30px;line-height:1.1;letter-spacing:.08em;text-transform:uppercase;color:var(--text)}
.phd .sub{font-size:14px;color:var(--muted);font-weight:300;padding-bottom:3px}
.group-t{display:flex;align-items:center;gap:10px;margin:28px 2px 12px}
.group-t .lbl{margin:0}
.group-t::after{content:'';flex:1;height:1px;background:var(--line)}

/* chips e campos */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:99px;background:var(--card);border:1px solid var(--line2);color:var(--text2);font-weight:600;font-size:13.5px;transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--tq);color:var(--tq2)}
.chip.on{background:var(--tq);border-color:var(--tq);color:#fff}
.chips.sm .chip{padding:6px 13px;font-size:13px}
.chip.tag{background:var(--orbg);border-color:var(--orline);color:var(--or2);padding:6px 8px 6px 14px}
.chip.tag .rm{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:16px;line-height:1;color:var(--text2)}
.chip.tag .rm:hover{background:rgba(40,42,46,.12);color:var(--text)}
.chip.sug{border-style:dashed;font-size:13px;padding:6px 11px}
input,textarea{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;line-height:1.5}
input:focus,textarea:focus{border-color:var(--tq);box-shadow:0 0 0 4px rgba(124,193,186,.2)}
input[type=date]{min-height:48px}
::placeholder{color:var(--faint)}
.fl{display:flex;flex-direction:column}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.err{color:var(--red);font-size:13.5px;font-weight:600;margin-top:6px}
.err:empty{display:none}
.hintp{font-size:13.5px;color:var(--muted);line-height:1.5}

/* estrelas (capacidade atual) */
/* dourada quando tem, prateada quando não tem */
.st5{position:relative;display:inline-block;font-size:16px;line-height:1;white-space:nowrap;vertical-align:-2px;letter-spacing:1px}
.st5::before,.st5 i::before{content:'★★★★★';-webkit-background-clip:text;background-clip:text;color:transparent}
.st5::before{background-image:linear-gradient(180deg,#e6e8ea 0%,#cdd0d4 100%)}
.st5 i{position:absolute;left:0;top:0;overflow:hidden;font-style:normal}
.st5 i::before{background-image:linear-gradient(180deg,#fff1a8 0%,#f7c531 50%,#d99a0b 100%)}

/* nota pintada como no FM */
.n0{color:var(--faint)}.n1{color:var(--n1)}.n2{color:var(--n2)}.n3{color:var(--n3)}.n4{color:var(--n4)}
.dl{font:700 11.5px 'Open Sans',sans-serif;white-space:nowrap}
.dl.up{color:var(--ok)}.dl.dn{color:var(--red)}.dl.eq{color:var(--faint)}

/* ── ELENCO (lista do plantel) ── */
.tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px}
.tools .lbl{margin:0}
.tools .hintp{flex-basis:100%;margin-top:-4px}
/* painel de números: cartões brancos com a faixa colorida à esquerda, como na Carteira */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}
.kpis div{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px 15px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--sh1);overflow:hidden;min-width:0}
.kpis div::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--faint)}
.kpis div:nth-child(2)::before{background:var(--tq)}.kpis div:nth-child(3)::before{background:var(--or)}.kpis div:nth-child(4)::before{background:var(--tq2)}.kpis div:nth-child(5)::before{background:#e0b25a}
.kpis b{font-size:36px;font-weight:300;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpis span{font-size:12.5px;color:var(--muted)}
.sq{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);box-shadow:var(--sh1)}
.sqr .st5{font-size:18px}
.sqr .num{font-size:17px}
.sqr{display:grid;grid-template-columns:minmax(220px,2.4fr) 70px 170px 120px 140px;align-items:center;gap:12px;padding:10px 16px;width:100%;text-align:left;background:var(--fm1);border-top:1px solid rgba(40,42,46,.04);font-size:14.5px;transition:background .12s}
.sqr:nth-child(odd){background:var(--fm2)}
.sqr:hover{background:var(--hov)}
.sqr.hd{background:var(--bg3);cursor:default;padding:9px 16px;font:600 11px 'Open Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:none}
.sqr.hd:hover{background:var(--bg3)}
.sqr .c{text-align:center}
/* cada número exatamente embaixo do título da coluna */
.sqr > :not(.who){text-align:center}
.sqr.hd > :first-child{text-align:left}
.sqr .cell{display:flex;flex-direction:column;align-items:center;justify-content:center}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.av{width:40px;height:40px;border-radius:50%;background:var(--tqbg);border:2px solid #fff;box-shadow:0 0 0 1.5px var(--tq);display:flex;align-items:center;justify-content:center;font:600 13px 'Open Sans',sans-serif;color:var(--tq2);flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.who .nm{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .mt{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gv{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center}
.num{font-weight:600;font-variant-numeric:tabular-nums;text-align:center}
.num.v{color:var(--vis)}.num.a{color:var(--or2)}
.lbm{display:none}

.legend{margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;font-size:14px;color:var(--text2);line-height:1.5}
.legend h4{font:600 12px 'Open Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.legend .sw{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px}
.legend .sw span{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.legend .sw i{width:10px;height:10px;border-radius:3px}

/* ── PERFIL DO CORRETOR (tela de jogador do FM) ── */
.back{display:inline-flex;align-items:center;gap:8px;color:var(--text2);font-weight:600;font-size:14.5px;padding:6px 0;margin-bottom:12px}
.back:hover{color:var(--text)}
.pf{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh1)}
.pf-h{display:flex;gap:20px;align-items:center;padding:18px 20px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.pf-ph{width:104px;height:104px;border-radius:50%;overflow:hidden;background:var(--tqbg);border:3px solid #fff;box-shadow:0 0 0 2px var(--tq);display:flex;align-items:center;justify-content:center;font:300 32px 'Open Sans',sans-serif;color:var(--tq2);flex-shrink:0}
.pf-ph img{width:100%;height:100%;object-fit:cover}
.pf-id{flex:1;min-width:220px}
.pf-id h1{font-size:34px;font-weight:300;letter-spacing:0;line-height:1.05;overflow-wrap:anywhere}
.pf-f{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:12px}
.pf-f div{display:flex;flex-direction:column;gap:3px}
.pf-f span{font:600 10.5px 'Open Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pf-f b{font-size:15px;font-weight:700}
.pf-f .st5{font-size:18px}
.capbox{display:flex;flex-direction:column;gap:12px;padding:14px 18px;border-radius:14px;background:var(--bg3);border:1px solid var(--line2)}
.capbox div{display:flex;flex-direction:column;gap:5px}
.capbox div > span:first-child{font:600 10.5px 'Open Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.capbox .st5{font-size:24px;align-self:flex-start}
.sug{font-size:13px;color:var(--muted)}
.sug .st5{font-size:14px;margin-left:4px}
.pf-act{display:flex;gap:8px;flex-wrap:wrap;width:100%;padding-top:4px}
.pf-tabs{display:flex;gap:2px;padding:0 12px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto}
.pf-tabs button{padding:12px 14px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.pf-tabs button.on{color:var(--text);border-bottom-color:var(--tq)}
.pf-tabs button:hover{color:var(--text)}
.pf-b{padding:16px}

.fm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.fm-c{display:flex;flex-direction:column;gap:2px;min-width:0}
.fm-h{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:2px 4px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.fm-h .t{font:700 12px 'Open Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase}
.fm-h small{display:block;font:500 12px 'Open Sans',sans-serif;color:var(--muted);margin-top:2px}
.fm-h .g{text-align:right;white-space:nowrap}
.fm-h .g b{font-size:18px;font-weight:300;font-variant-numeric:tabular-nums}
.fm-h .g span{display:block;font:600 10.5px 'Open Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fm-r{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;padding:10px 12px;background:var(--fm1);border-left:3px solid transparent;transition:background .12s}
.fm-r:hover{background:var(--hov)}
.fm-r .ic{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin-left:7px;border-radius:50%;border:1px solid var(--line2);font:700 10px 'Open Sans',sans-serif;font-style:normal;color:var(--muted);vertical-align:2px}
.fm-r.open .ic{background:var(--tq);border-color:var(--tq);color:#fff}
.fm-x{display:block;font-size:13.5px;font-weight:500;line-height:1.5;color:var(--text2);background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.fm-x .fx{display:block;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.fm-x .fx b{margin-right:4px}
.pnl-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.fm-r:nth-child(even){background:var(--fm2)}
.fm-r.hi{background:linear-gradient(90deg,var(--fmhi),rgba(124,193,186,.03));border-left-color:var(--tq)}
.fm-r .ln{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.fm-r .an{flex:1;min-width:0}
.nv{font-size:18px;font-weight:600;min-width:24px;text-align:right;font-variant-numeric:tabular-nums}
.fm-leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin-top:12px}
.fm-leg b{font-weight:800}

.pn3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
.pnl{background:var(--fm1);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pnl h3{font:700 11.5px 'Open Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pap{display:flex;flex-direction:column;gap:2px}
.pap button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;text-align:left;width:100%}
.pap button:hover{background:rgba(40,42,46,.04)}
.pap button.on{background:var(--fmhi);box-shadow:inset 3px 0 0 var(--n4)}
.pap .pt{flex:1;min-width:0}
.pap .pt b{display:block;font-size:14.5px;font-weight:700}
.pap .pt small{display:block;font-size:12px;color:var(--muted)}
.kv{display:flex;flex-direction:column;gap:2px}
.kv span{font:600 10.5px 'Open Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kv b{font-size:15px;font-weight:700}
.chs{display:flex;flex-direction:column;gap:6px}
.chs div{display:flex;gap:9px;align-items:baseline;font-size:14.5px;font-weight:600}
.chs div::before{content:'★';color:var(--n3);font-size:13px}
.evol{font-size:14px;color:var(--text2)}
.evol b{color:var(--or2)}
.nota{font-size:14px;color:var(--text2);line-height:1.5;border-left:2px solid var(--orline);padding-left:10px}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh1);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.box-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.box-h h3{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text2)}
.box-h .r{margin-left:auto}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:'Open Sans',sans-serif}
.keyl{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.keyl span{display:inline-flex;align-items:center;gap:6px}
.keyl i{width:10px;height:10px;border-radius:3px;background:var(--vis)}
.keyl .a i{background:var(--tq)}
/* atributos: primeira avaliação × hoje */
.hb{display:flex;flex-direction:column;gap:9px}
.hb-g{font:700 11px 'Open Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.hb-r{display:grid;grid-template-columns:150px minmax(0,1fr) 64px;align-items:center;gap:12px;font-size:14px}
.hb-t{position:relative;height:10px;border-radius:99px;background:rgba(40,42,46,.06)}
.hb-t i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.hb-t .a1{background:var(--tq)}

// ── GRÁFICOS ──
// linhas ao longo das avaliações (uma ou mais séries)
function graficoLinhas(av, series, min, max, fmt, id, fixo) {
  if (av.length < 2) {
    const v = series.map(s => `${s.nome} <b style="color:var(--text)">${fmt(s.val(av[0]))}</b>`).join(' · ');
    return `<div class="empty-s">Hoje: ${v}.<br>A linha aparece a partir da segunda avaliação.</div>`;
  }
  const W = 560, H = 220, L = 34, R = series.length > 1 ? 48 : 18, T = 24, B = 30;
  const todos = series.flatMap(s => av.map(s.val)).filter(v => v !== null);
  const span = max - min, folga = span * 0.1;
  // fixo: escala inteira de min a max, uma linha por unidade (usado nas estrelas, de 0 a 5)
  const lo = fixo ? min : Math.max(min, Math.floor((Math.min(...todos) - folga) / (span / 10)) * (span / 10));
  const hi = fixo ? max : Math.min(max, Math.ceil((Math.max(...todos) + folga) / (span / 10)) * (span / 10));
  const ticks = fixo ? Array.from({ length: max - min + 1 }, (_, k) => min + k) : [0, 1, 2, 3, 4].map(k => lo + (hi - lo) / 4 * k);
  const x = i => L + i * (W - L - R) / (av.length - 1), y = v => T + (hi - v) * (H - T - B) / (hi - lo || 1);
  const each = Math.ceil(av.length / 7);
  let g = '';
  for (const v of ticks) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(40,42,46,.07)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#b9bbbd">${Math.round(v)}</text>`;
  const datas = av.map((a, i) => i % each === 0 || i === av.length - 1 ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#878787">${fmtShort(a.data)}</text>` : '').join('');
  const sv = series.map((s, si) => {
    const pts = av.map((a, i) => [i, s.val(a)]).filter(p => p[1] !== null);
    const line = pts.map(([i, v]) => `${x(i)},${y(v)}`).join(' ');
    const area = series.length === 1 && pts.length ? `<polygon points="${x(pts[0][0])},${y(lo)} ${line} ${x(pts[pts.length - 1][0])},${y(lo)}" fill="url(#g-${id})"/>` : '';
    const rot = series.length === 1 ? pts.map(([i, v]) => `<text x="${x(i)}" y="${y(v) - 11}" text-anchor="middle" font-size="12" font-weight="700" fill="#2c2e33">${fmt(v)}</text>`).join('') : '';
    return area + `<polyline points="${line}" fill="none" stroke="${s.cor}" stroke-width="2.5" stroke-linejoin="round"/>` +
      pts.map(([i, v]) => `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${s.cor}" stroke="#fff" stroke-width="2"/>`).join('') + rot;
  }).join('') + (series.length > 1 ? rotulosFinais(series, av, x, y, fmt) : '');
  const leg = series.length > 1 ? `<div class="keyl">${series.map(s => `<span><i style="background:${s.cor}"></i>${s.nome}</span>`).join('')}</div>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de evolução">
    <defs><linearGradient id="g-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc1ba" stop-opacity=".28"/><stop offset="1" stop-color="#7cc1ba" stop-opacity="0"/></linearGradient></defs>
    ${g}${datas}${sv}</svg>${leg}`;
}
// valor final de cada linha à direita do gráfico, afastados para não encostar um no outro
function rotulosFinais(series, av, x, y, fmt) {
  const i = av.length - 1;
  const rs = series.map(s => ({ s, v: s.val(av[i]) })).filter(r => r.v !== null).map(r => Object.assign(r, { yy: y(r.v) + 4 })).sort((a, b) => a.yy - b.yy);
  for (let k = 1; k < rs.length; k++) if (rs[k].yy - rs[k - 1].yy < 14) rs[k].yy = rs[k - 1].yy + 14;
  return rs.map(r => `<text x="${x(i) + 9}" y="${r.yy}" font-size="12" font-weight="700" fill="${r.s.cor}">${fmt(r.v)}</text>`).join('');
}
function graficoProd(linhas) {
  const dados = linhas.filter(l => !l.futuro);
  if (!dados.some(l => l.P.v || l.P.a)) return `<div class="empty-s">As barras aparecem conforme as visitas e angariações forem registradas.</div>`;
  const W = 560, H = 200, L = 10, R = 10, T = 22, B = 30;
  const max = Math.max(1, ...dados.map(l => Math.max(l.P.v, l.P.a)));
  const gw = (W - L - R) / linhas.length, bw = Math.min(30, gw / 3.2);
  const y = v => T + (H - T - B) * (1 - v / max);
  const bars = linhas.map((l, i) => {
    const cx = L + gw * i + gw / 2;
    const one = (v, xx, cor) => `<rect x="${xx}" y="${y(v)}" width="${bw}" height="${Math.max(0, H - B - y(v))}" rx="4" fill="${cor}"/>` + (v ? `<text x="${xx + bw / 2}" y="${y(v) - 6}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#55585e">${v}</text>` : '');
    return (l.futuro ? '' : one(l.P.v, cx - bw - 2, '#7cc1ba') + one(l.P.a, cx + 2, '#e0662c')) +
      `<text x="${cx}" y="${H - 9}" text-anchor="middle" font-size="11.5" fill="${l.atual ? '#e0662c' : '#878787'}">${l.k}º mês</text>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Produção por mês de acompanhamento"><line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="rgba(40,42,46,.1)"/>${bars}</svg>
    <div class="keyl"><span><i></i>Visitas de angariação</span><span class="a"><i></i>Angariações realizadas</span></div>`;
}

function mesMentoria() { let k = 1; const h = hoje(); while (maisMeses(mentoria.inicio, k) <= h && k < 60) k++; return k; }
const diasMentoria = () => Math.max(1, Math.round((new Date(hoje()) - new Date(mentoria.inicio)) / 864e5) + 1);
const estTxt = v => `<span class="rs">★</span>${fmtEst(v)}`;
// Relatórios: escolhe o período (1º, 2º, 3º mês ou a mentoria toda) e de quem (o time todo ou uma pessoa)
const PER_REL = [['1', '1º mês'], ['2', '2º mês'], ['3', '3º mês'], ['tudo', 'Mentoria toda']];
function periodoRel(per) {
  const de = per === 'tudo' ? mentoria.inicio : maisMeses(mentoria.inicio, +per - 1);
  const fimMes = per === 'tudo' ? diaAntes(maisMeses(mentoria.inicio, 3)) : diaAntes(maisMeses(mentoria.inicio, +per));
  const fim = fimMes < hoje() ? fimMes : hoje(); // até hoje, se o mês ainda não acabou
  return { de, fim, fimMes, nome: per === 'tudo' ? 'da mentoria' : `do ${per}º mês`, k: per === 'tudo' ? 3 : +per };
}
// evolução no período: de onde a pessoa estava quando o período começou (ou da primeira avaliação) até a última avaliação do período
function evoP(c, P) {
  const avs = avsN(c).filter(a => a.data <= P.fim);
  if (!avs.length) return null;
  const antes = avs.filter(a => a.data < P.de).pop(), ini = antes || avs[0], fimAv = avs[avs.length - 1];
  const s = notasDe(c, ini.data), e = notasDe(c, P.fim);
  return { de: capN(s.n), ate: capN(e.n), p: s.n, hj: e.n, dataIni: ini.data, dataFim: fimAv.data, sIni: situacaoDe(s.n), sFim: situacaoDe(e.n) };
}
function paginasRelatorio(opt) {

  const vis = Es.reduce((s, x) => s + x.prodP.v, 0), ass = Es.reduce((s, x) => s + x.prodP.a, 0);

// recorta quadrado (um pouco para cima, onde fica o rosto) e reduz para caber no Firebase
function lerFoto(file) {
  return new Promise((ok, no) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const S = 440, s = Math.min(img.width, img.height), cv = document.createElement('canvas');
      cv.width = cv.height = S;
      cv.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) * 0.25, s, s, 0, 0, S, S);
      URL.revokeObjectURL(url);
      ok(cv.toDataURL('image/jpeg', 0.84));
    };
    img.onerror = () => { URL.revokeObjectURL(url); no(new Error('imagem')); };
    img.src = url;
  });
}

function saveTreino() {
  const tema = $('#t-tema').value.trim();
  if (!form.temas.length && !tema) { $('#t-err').textContent = 'Toque no que foi treinado.'; return; }
  if (!form.quem.length) { $('#t-err').textContent = 'Toque em quem estava.'; return; }

  // em cada pessoa: a avaliação deste treino (com todas as notas dela até ali e as do treino por cima)
  const res = {};
  form.quem.forEach(pid => {
    const c = byId(pid); if (!c) return;
    const outras = c.avaliacoes.filter(a => a.t !== tid);
    const base = notasDe(Object.assign({}, c, { avaliacoes: outras }), data);
    const notas = Object.assign({}, base.av ? base.av.notas : {});
    res[pid] = {};
    form.temas.forEach(k => { const antes = notaAntes(c, k, data, tid), depois = (form.notas[pid] || {})[k] ?? Math.max(antes, 6); notas[k] = depois; res[pid][k] = [antes, depois]; });
    ATRS.forEach(a => { if (typeof notas[a.k] !== 'number') notas[a.k] = 1; });
    const n = cleanNotas(notas);
    saveCorretor(Object.assign({}, c, { avaliacoes: outras.concat([{ id: newId('a'), data, notas: n, obs: 'Treino: ' + (tema || form.temas.map(k => atr(k).nome).join(', ')), ca: capN(n), m: 3, t: tid }]) }));
  });
  // quem saiu do treino na edição perde a nota daquele treino
  const t0 = form.tid ? mentoria.treinos.find(x => x.id === form.tid) : null;
  if (t0) t0.quem.filter(pid => !form.quem.includes(pid)).forEach(pid => { const c = byId(pid); if (c) saveCorretor(Object.assign({}, c, { avaliacoes: c.avaliacoes.filter(a => a.t !== tid) })); });
  const t = { id: tid, data, temas: form.temas, tema, quem: form.quem, obs: '', res };

let toastT;
function toast(msg, action) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button id="toast-a">${esc(action.label)}</button>` : '');
  t.classList.remove('hidden');
  if (action) $('#toast-a').onclick = () => { t.classList.add('hidden'); action.fn(); };
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), action ? 6000 : 3200);
}
async function copiar(txt) {
  try { await navigator.clipboard.writeText(txt); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (er) {}
    ta.remove(); return ok;
  }
}

  try {
    const r = await fetch(location.pathname + '?nv=' + Date.now(), { cache: 'no-store' });
    const m = (await r.text()).match(/const VERSAO = '([^']+)'/);
    if (!m || m[1] === VERSAO) return;
    if (ui.sheet) return; // com uma avaliação aberta, não recarrega: perderia o que está sendo preenchido
    const q = new URLSearchParams(location.search);
    if (q.get('v') === m[1]) return; // já tentou esta versão: não fica em loop
    q.set('v', m[1]);
    location.replace(location.pathname + '?' + q + location.hash);
  } catch (e) {}
}
confereVersao();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') confereVersao(); });

// ── ENTRADA ──
if (TESTE) $('#teste-bar').classList.remove('hidden');
$('#bairros').innerHTML = [...new Set(BAIRROS_CWB)].sort((a, b) => a.localeCompare(b, 'pt-BR')).map(b => `<option value="${esc(b)}">`).join('');
mentoria = cleanMentoria(lsGet(LS_CACHE + '_m', null));
corretores = applyPending(lsGet(LS_CACHE, []).filter(o => o && o.id !== MID).map(cleanCorretor));
route();
refresh(true);
</script>
