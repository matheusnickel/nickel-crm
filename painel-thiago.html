<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nickel CRM · Gestão</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
.pt-main{max-width:1140px;margin:0 auto;padding:28px 28px 80px}

/* TOPBAR FILTRO */
.pt-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:16px;flex-wrap:wrap}
.pt-stats{display:flex;gap:1px;background:var(--border);border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.pt-stat{background:var(--bg2);padding:14px 22px;min-width:115px;text-align:center}
.pt-stat-num{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;margin-bottom:3px}
.pt-stat-num.blue{color:#6495ed}
.pt-stat-num.green{color:var(--gold)}
.pt-stat-lbl{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;font-weight:500}

/* RANGE FILTRO */
.filter-bar{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 16px;margin-bottom:24px;flex-wrap:wrap}
.filter-lbl{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
.period-tabs{display:flex;gap:1px;background:var(--border);border-radius:7px;overflow:hidden;border:1px solid var(--border)}
.period-tab{background:var(--bg2);border:none;color:var(--text-muted);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;padding:6px 14px;cursor:pointer;transition:background .15s,color .15s}
.period-tab.active{background:var(--bg3);color:var(--text)}
.filter-sep{width:1px;height:20px;background:var(--border);margin:0 4px}
.range-sep{font-size:12px;color:var(--text-muted)}
.range-inp{background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;padding:6px 9px;outline:none;transition:border-color .2s;cursor:pointer}
.range-inp:focus,.range-inp.on{border-color:var(--gold)}
.btn-range-clear{background:none;border:1px solid var(--border);color:var(--text-muted);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;padding:6px 10px;border-radius:6px;cursor:pointer;transition:all .15s}
.btn-range-clear:hover{border-color:var(--red);color:var(--red)}
.range-hint{font-size:11px;color:var(--gold);font-weight:600}

/* GRADE 2 COLUNAS */
.pt-agents{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:32px}

/* CARD AGENTE */
.pt-agent{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.pt-agent-head{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;user-select:none;transition:background .15s}
.pt-agent-head:hover{background:var(--bg3)}
.pt-av{width:40px;height:40px;flex-shrink:0;background:var(--bg3);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--gold)}
.pt-agent-name{font-size:15px;font-weight:600;flex:1}
.pt-badges{display:flex;gap:6px}
.pt-badge{font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px}
.pt-badge.cq{background:rgba(100,149,237,.12);color:#6495ed}
.pt-badge.doc{background:rgba(168,230,61,.12);color:var(--gold)}
.pt-badge.zero{background:rgba(255,255,255,.05);color:var(--text-muted)}
.pt-chev{font-size:11px;color:var(--text-muted);transition:transform .2s;flex-shrink:0;margin-left:4px}
.pt-agent.open>.pt-agent-head .pt-chev{transform:rotate(180deg)}
.pt-agent-body{display:none;border-top:1px solid var(--border)}
.pt-agent.open>.pt-agent-body{display:block}

/* SEÇÕES */
.pt-sec{padding:16px 18px}
.pt-sec+.pt-sec{border-top:1px solid var(--border)}
.pt-sec-title{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px}

/* DATA DO LANÇAMENTO */
.lancamento-date-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 14px}
.lancamento-date-lbl{font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.lancamento-date-inp{background:transparent;border:none;color:var(--gold);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;outline:none;cursor:pointer;flex:1}

/* STEPPER */
.pt-stepper-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.pt-stepper-lbl{font-size:14px;font-weight:500}
.vid-stepper{display:flex;align-items:center;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.vid-step-btn{background:var(--bg2);border:none;color:var(--text);font-size:18px;font-weight:700;width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.vid-step-btn:hover{background:var(--border)}
.vid-step-val{min-width:40px;text-align:center;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;color:#6495ed;background:var(--bg3);padding:0 4px;line-height:38px}

/* CQ FORMS */
.cq-list{display:flex;flex-direction:column;gap:10px}
.cq-item{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.cq-num{font-size:11px;font-weight:700;color:#6495ed;text-transform:uppercase;letter-spacing:.06em}
.cq-row{display:flex;gap:8px}
.cq-row>*{flex:1;min-width:0}
.cq-inp{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:8px 10px;outline:none;transition:border-color .2s}
.cq-inp:focus{border-color:#6495ed}
.cq-inp::placeholder{color:var(--text-muted)}

/* BAIRROS */
.field-lbl{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;margin-top:4px}
.field-lbl::before{content:'';display:inline-block;width:3px;height:13px;border-radius:2px;background:#6495ed;flex-shrink:0}
.field-lbl.gold::before{background:var(--gold)}
.bairro-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.bairro-chip{font-size:11px;font-weight:500;padding:4px 10px;border-radius:5px;border:1px solid var(--border);background:var(--bg2);color:var(--text-muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.bairro-chip:hover{border-color:#6495ed;color:var(--text)}
.bairro-chip.sel{background:rgba(100,149,237,.15);border-color:#6495ed;color:#6495ed;font-weight:700}
.bairro-add-row{display:flex;gap:6px;margin-top:4px}
.bairro-add-row input{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;padding:5px 8px;outline:none;transition:border-color .2s}
.bairro-add-row input:focus{border-color:#6495ed}
.bairro-add-row input::placeholder{color:var(--text-muted)}
.btn-bairro-add{background:none;border:1px solid var(--border);color:var(--text-muted);font-size:11px;padding:5px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;transition:all .15s}
.btn-bairro-add:hover{border-color:#6495ed;color:#6495ed}

/* TIPOLOGIA */
.tipo-group{display:flex;gap:5px;flex-wrap:wrap}
.tipo-btn{font-size:11px;font-weight:500;padding:5px 11px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--text-muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.tipo-btn:hover{border-color:var(--gold);color:var(--text)}
.tipo-btn.sel{background:rgba(168,230,61,.12);border-color:var(--gold);color:var(--gold);font-weight:700}

/* VALOR */
.valor-wrap{position:relative}
.valor-prefix{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--text-muted);pointer-events:none;font-weight:600}
.valor-inp{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;padding:8px 10px 8px 36px;outline:none;transition:border-color .2s;font-variant-numeric:tabular-nums}
.valor-inp:focus{border-color:var(--gold)}
.valor-inp::placeholder{color:var(--text-muted);font-weight:400}

/* DOC */
.pt-doc-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.pt-doc-chip{display:flex;align-items:center;gap:6px;background:rgba(168,230,61,.08);border:1px solid rgba(168,230,61,.2);border-radius:7px;padding:5px 12px}
.pt-doc-code{font-size:13px;font-weight:700;color:var(--gold)}
.pt-doc-rm{background:none;border:none;color:rgba(168,230,61,.4);font-size:16px;cursor:pointer;padding:0 0 0 2px;line-height:1;transition:color .15s}
.pt-doc-rm:hover{color:var(--red)}
.pt-add-doc{display:flex;gap:8px}
.pt-add-doc input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 12px;outline:none;transition:border-color .2s}
.pt-add-doc input:focus{border-color:var(--gold)}
.pt-add-doc input::placeholder{color:var(--text-muted)}
.pt-btn-doc{background:var(--gold);border:none;color:#000;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;padding:9px 18px;border-radius:8px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background .2s}
.pt-btn-doc:hover{background:#96ce35}

/* CQ ACORDEÃO */
.cq-item{background:var(--bg3);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.cq-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;user-select:none;transition:background .15s}
.cq-head:hover{background:rgba(100,149,237,.07)}
.cq-head-left{display:flex;align-items:center;gap:10px}
.cq-num{font-size:12px;font-weight:700;color:#6495ed;text-transform:uppercase;letter-spacing:.06em}
.cq-summary{font-size:12px;color:var(--text-muted);font-style:italic}
.cq-chev{font-size:10px;color:var(--text-muted);transition:transform .2s}
.cq-open .cq-chev{transform:rotate(180deg)}
.cq-body{display:none;padding:0 14px 14px;display:flex;flex-direction:column;gap:9px}
.cq-item:not(.cq-open) .cq-body{display:none}
.cq-item.cq-open .cq-body{display:flex}

/* SALVAR LANÇAMENTO */
.btn-salvar-lancamento{display:block;width:100%;margin-top:16px;padding:11px;background:var(--gold);color:#000;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;border:none;border-radius:8px;cursor:pointer;transition:background .2s,transform .1s;letter-spacing:.3px}
.btn-salvar-lancamento:hover{background:#96ce35}
.btn-salvar-lancamento:active{transform:scale(.98)}

/* HISTÓRICO DO AGENTE */
.hist-toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;padding:14px 18px;border-top:1px solid var(--border)}
.hist-toggle:hover{background:var(--bg3)}
.hist-toggle-lbl{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em}
.hist-toggle-chev{font-size:10px;color:var(--text-muted);transition:transform .2s}
.hist-open .hist-toggle-chev{transform:rotate(180deg)}
.hist-list{display:none;border-top:1px solid var(--border)}
.hist-open .hist-list{display:block}
.hist-row{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--border)}
.hist-row:last-child{border-bottom:none}
.hist-date{font-size:13px;font-weight:600;color:var(--text);min-width:110px}
.hist-badges{display:flex;gap:6px;flex:1}
.hist-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}
.hist-badge.cq{background:rgba(100,149,237,.12);color:#6495ed}
.hist-badge.doc{background:rgba(168,230,61,.12);color:var(--gold)}
.hist-badge.zero{background:rgba(255,255,255,.05);color:var(--text-muted)}
.hist-empty{padding:14px 18px;font-size:13px;color:var(--text-muted)}

/* ANALYTICS */
.analytics-section{margin-top:8px}
.analytics-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.analytics-title{font-size:14px;font-weight:700;color:var(--text)}
.summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border-radius:10px;overflow:hidden;border:1px solid var(--border);margin-bottom:16px}
.sum-cell{background:var(--bg2);padding:16px;text-align:center}
.sum-num{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:3px}
.sum-num.blue{color:#6495ed}
.sum-num.green{color:var(--gold)}
.sum-num.orange{color:#f97316}
.sum-lbl{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.analytics-grid.full{grid-template-columns:1fr}
.a-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px}
.a-card-title{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px}
.a-empty{font-size:13px;color:var(--text-muted);text-align:center;padding:20px 0}

/* SAVE BAR */
.pt-save-bar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border);padding:14px 28px;z-index:50}
.pt-save-inner{max-width:1140px;margin:0 auto;display:flex;align-items:center;gap:12px}
.pt-period-note{font-size:12px;color:var(--text-muted)}

#pt-toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 22px;font-size:13px;color:var(--text);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:999}
</style>
</head>
<body>

<header class="app-header">
  <span class="logo">NICKEL CRM</span>
  <span class="user-info">Painel de Gestão</span>
</header>

<div class="pt-main">

  <!-- STATS + FILTRO -->
  <div class="pt-topbar">
    <div class="pt-stats">
      <div class="pt-stat"><div class="pt-stat-num blue" id="s-cq-p">0</div><div class="pt-stat-lbl">CQs no período</div></div>
      <div class="pt-stat"><div class="pt-stat-num blue" id="s-cq-w">0</div><div class="pt-stat-lbl">CQs semana</div></div>
    </div>
  </div>

  <!-- BARRA DE FILTRO -->
  <div class="filter-bar">
    <span class="filter-lbl">Filtro</span>
    <div class="period-tabs">
      <button class="period-tab active" data-p="week">Esta semana</button>
      <button class="period-tab" data-p="month">Este mês</button>
      <button class="period-tab" data-p="all">Tudo</button>
    </div>
    <div class="filter-sep"></div>
    <span class="range-sep">De</span>
    <input type="date" class="range-inp" id="range-from">
    <span class="range-sep">até</span>
    <input type="date" class="range-inp" id="range-to">
    <button class="btn-range-clear" id="btn-range-clear" style="display:none">✕ Limpar</button>
    <span class="range-hint" id="range-hint" style="display:none"></span>
  </div>

  <!-- AGENTES -->
  <div class="pt-agents" id="agents-wrap"></div>

  <!-- ANALYTICS -->
  <div class="analytics-section">
    <div class="analytics-hdr">
      <div class="analytics-title">Análises do período</div>
    </div>
    <div class="summary-row">
      <div class="sum-cell"><div class="sum-num blue" id="an-cq">0</div><div class="sum-lbl">CQs no período</div></div>
      <div class="sum-cell"><div class="sum-num orange" id="an-val">—</div><div class="sum-lbl">Valor médio CQs</div></div>
    </div>
    <div class="analytics-grid">
      <div class="a-card">
        <div class="a-card-title">Tipologias angariadas</div>
        <canvas id="chart-tipo" style="max-height:200px"></canvas>
        <div class="a-empty" id="empty-tipo" style="display:none">Nenhum dado no período</div>
      </div>
      <div class="a-card">
        <div class="a-card-title">Bairros mais frequentes</div>
        <canvas id="chart-bairro" style="max-height:200px"></canvas>
        <div class="a-empty" id="empty-bairro" style="display:none">Nenhum dado no período</div>
      </div>
    </div>
    <div class="analytics-grid full">
      <div class="a-card">
        <div class="a-card-title">Faixa de valores (R$)</div>
        <canvas id="chart-valor" style="max-height:180px"></canvas>
        <div class="a-empty" id="empty-valor" style="display:none">Nenhum dado no período</div>
      </div>
    </div>
  </div>

</div>

<div id="pt-toast"></div>

<script>
var AGENTS=[
  {id:'anne',    name:'Anne Ludwig'},
  {id:'jo',      name:'Jo Casas'},
  {id:'flora',   name:'Flora Carvalho'},
  {id:'sanny',   name:'Sanny Martins'},
  {id:'karoline',name:'Karoline Tyszka'},
  {id:'thiago',  name:'Thiago Araújo'},
  {id:'laura',   name:'Laura Bonkoski'},
];

var BAIRROS=['Água Verde','Ahú','Alto da XV','Bacacheri','Batel','Bigorrilho','Cabral','Centro','Champagnat','Cristo Rei','Ecoville','Hugo Lange','Jardim Social','Juvevê','Mercês','Mossunguê','Pilarzinho','Portão','Rebouças','Santo Inácio','Seminário','Vila Izabel'];
var TIPOLOGIAS=['Casa de rua','Casa em condomínio','Apartamento','Cobertura'];
var MONTHS=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
var CHART_COLORS=['#6495ed','#a8e63d','#f97316','#e879f9','#22d3ee','#f87171','#facc15','#a3e635'];

var today=new Date().toISOString().slice(0,10);
var curPeriod='week';
var rangeFrom='',rangeTo='';
var charts={tipo:null,bairro:null,valor:null};

// bairros extras
var extraBairros=[];
try{extraBairros=JSON.parse(localStorage.getItem('tgp_extra_bairros')||'[]')}catch{}
function allBairros(){return BAIRROS.concat(extraBairros.filter(function(b){return BAIRROS.indexOf(b)<0}))}
function saveExtraBairros(){try{localStorage.setItem('tgp_extra_bairros',JSON.stringify(extraBairros))}catch{}}

// draft: {agentId: {date, cqs:[{nome,tel,bairro,tipologia,valor}], docs:[{codigo}]}}
var draft={};
function getDraft(id){
  if(!draft[id])draft[id]={date:today,cqs:[]};
  return draft[id];
}

// ── STORAGE POR AGENTE ──
// tgp_a_{id} = [{date, cqs:[{nome,tel,bairro,tipologia,valor}], docs:[{codigo}]}, ...]
function agentKey(id){return'tgp_a_'+id}
function loadAgent(id){try{return JSON.parse(localStorage.getItem(agentKey(id))||'[]')}catch{return[]}}
function saveAgent(id,entries){try{localStorage.setItem(agentKey(id),JSON.stringify(entries))}catch{}}

function upsertEntry(id,entry){
  var entries=loadAgent(id);
  var idx=entries.findIndex(function(e){return e.date===entry.date});
  if(idx>=0)entries[idx]=entry;else entries.push(entry);
  entries.sort(function(a,b){return b.date.localeCompare(a.date)});
  saveAgent(id,entries);
}

// ── UTILS ──
function ini(n){return n.split(' ').slice(0,2).map(function(w){return w[0]||''}).join('').toUpperCase()}
function daysAgo(n){var d=new Date(today);d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)}
function fmtDate(d){var p=d.split('-');return(+p[2])+' de '+MONTHS[+p[1]-1]+' de '+p[0]}
function fmtDateShort(d){var p=d.split('-');return(+p[2])+'/'+MONTHS[+p[1]-1]+'/'+p[0]}
function fmtValor(v){if(!v)return'';return v.toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
function parseValor(s){return parseInt((s||'').replace(/\D/g,''),10)||0}

// ── PERIOD DATES ──
function getPeriodDates(){
  if(rangeFrom&&rangeTo&&rangeFrom<=rangeTo){
    var dates=[],d=new Date(rangeFrom),end=new Date(rangeTo);
    while(d<=end){dates.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1)}
    return dates;
  }
  var dates=[];
  var n=curPeriod==='week'?6:curPeriod==='month'?29:364;
  for(var i=n;i>=0;i--)dates.push(daysAgo(i));
  return dates;
}

function getWeekDates(){var dates=[];for(var i=6;i>=0;i--)dates.push(daysAgo(i));return dates}

// ── AGGREGATE ──
function aggregatePeriod(){
  var dates=getPeriodDates();
  var dateSet={};dates.forEach(function(d){dateSet[d]=true});
  var allCqs=[],totalDocs=0;
  AGENTS.forEach(function(a){
    loadAgent(a.id).forEach(function(e){
      if(dateSet[e.date]){
        allCqs=allCqs.concat(e.cqs||[]);
          }
    });
  });
  return{cqs:allCqs};
}

function aggregateWeek(){
  var wdates=getWeekDates();var wset={};wdates.forEach(function(d){wset[d]=true});
  var cq=0;
  AGENTS.forEach(function(a){
    loadAgent(a.id).forEach(function(e){
      if(wset[e.date]){cq+=(e.cqs||[]).length}
    });
  });
  return{c:cq};
}

// ── TILES ──
function refreshTiles(){
  var p=aggregatePeriod(),w=aggregateWeek();
  document.getElementById('s-cq-p').textContent=p.cqs.length;
  document.getElementById('s-cq-w').textContent=w.c;
}

// ── BADGES DO AGENTE (período atual) ──
function agentPeriodTotals(id){
  var dates=getPeriodDates();var dset={};dates.forEach(function(d){dset[d]=true});
  var cq=0;
  loadAgent(id).forEach(function(e){
    if(dset[e.date]){cq+=(e.cqs||[]).length}
  });
  return{cq:cq};
}

// ── ANALYTICS ──
function refreshAnalytics(){
  var agg=aggregatePeriod();
  document.getElementById('an-cq').textContent=agg.cqs.length;
  var vals=agg.cqs.map(function(c){return parseValor(c.valor||'')}).filter(function(v){return v>0});
  document.getElementById('an-val').textContent=vals.length?'R$ '+fmtValor(Math.round(vals.reduce(function(a,b){return a+b},0)/vals.length)):'—';
  buildTipoChart(agg.cqs);buildBairroChart(agg.cqs);buildValorChart(agg.cqs);
  refreshTiles();
  refreshAgentBadges();
}

function refreshAgentBadges(){
  AGENTS.forEach(function(a){
    var t=agentPeriodTotals(a.id);
    var el=document.querySelector('[data-agent="'+a.id+'"] .pt-badges');
    if(!el)return;
    el.innerHTML='<span class="pt-badge '+(t.cq?'cq':'zero')+'">'+t.cq+' CQ</span>';
  });
}

function buildTipoChart(cqs){
  var counts={};TIPOLOGIAS.forEach(function(t){counts[t]=0});
  cqs.forEach(function(c){if(c.tipologia)counts[c.tipologia]=(counts[c.tipologia]||0)+1});
  var labels=TIPOLOGIAS.filter(function(k){return counts[k]>0});
  var canvas=document.getElementById('chart-tipo'),empty=document.getElementById('empty-tipo');
  if(!labels.length){canvas.style.display='none';empty.style.display='block';return}
  canvas.style.display='';empty.style.display='none';
  if(charts.tipo)charts.tipo.destroy();
  charts.tipo=new Chart(canvas.getContext('2d'),{type:'doughnut',data:{labels:labels,datasets:[{data:labels.map(function(k){return counts[k]}),backgroundColor:CHART_COLORS,borderWidth:0,hoverOffset:4}]},options:{responsive:true,plugins:{legend:{position:'right',labels:{color:'#6b8299',font:{size:11},padding:12}},tooltip:{backgroundColor:'#0e1218',titleColor:'#f0f4f8',bodyColor:'#6b8299',borderColor:'#1e2a38',borderWidth:1}}}});
}
function buildBairroChart(cqs){
  var counts={};cqs.forEach(function(c){if(c.bairro)counts[c.bairro]=(counts[c.bairro]||0)+1});
  var sorted=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a]}).slice(0,8);
  var canvas=document.getElementById('chart-bairro'),empty=document.getElementById('empty-bairro');
  if(!sorted.length){canvas.style.display='none';empty.style.display='block';return}
  canvas.style.display='';empty.style.display='none';
  if(charts.bairro)charts.bairro.destroy();
  charts.bairro=new Chart(canvas.getContext('2d'),{type:'bar',data:{labels:sorted,datasets:[{data:sorted.map(function(k){return counts[k]}),backgroundColor:'rgba(100,149,237,.5)',borderColor:'rgba(100,149,237,.9)',borderWidth:1,borderRadius:4}]},options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false},tooltip:{backgroundColor:'#0e1218',titleColor:'#f0f4f8',bodyColor:'#6b8299',borderColor:'#1e2a38',borderWidth:1}},scales:{x:{grid:{color:'rgba(30,42,56,.8)'},ticks:{color:'#6b8299',font:{size:10},stepSize:1},beginAtZero:true},y:{grid:{display:false},ticks:{color:'#6b8299',font:{size:11}}}}}});
}
function buildValorChart(cqs){
  var faixas=['Até 500k','500k–1M','1M–2M','2M–3M','3M–5M','Acima 5M'],counts=[0,0,0,0,0,0];
  cqs.forEach(function(c){var v=parseValor(c.valor||'');if(!v)return;if(v<=500000)counts[0]++;else if(v<=1000000)counts[1]++;else if(v<=2000000)counts[2]++;else if(v<=3000000)counts[3]++;else if(v<=5000000)counts[4]++;else counts[5]++});
  var canvas=document.getElementById('chart-valor'),empty=document.getElementById('empty-valor');
  if(counts.every(function(v){return v===0})){canvas.style.display='none';empty.style.display='block';return}
  canvas.style.display='';empty.style.display='none';
  if(charts.valor)charts.valor.destroy();
  charts.valor=new Chart(canvas.getContext('2d'),{type:'bar',data:{labels:faixas,datasets:[{data:counts,backgroundColor:'rgba(168,230,61,.5)',borderColor:'rgba(168,230,61,.9)',borderWidth:1,borderRadius:4}]},options:{responsive:true,plugins:{legend:{display:false},tooltip:{backgroundColor:'#0e1218',titleColor:'#f0f4f8',bodyColor:'#6b8299',borderColor:'#1e2a38',borderWidth:1}},scales:{x:{grid:{color:'rgba(30,42,56,.8)'},ticks:{color:'#6b8299',font:{size:11}}},y:{grid:{color:'rgba(30,42,56,.8)'},ticks:{color:'#6b8299',font:{size:10},stepSize:1},beginAtZero:true}}}});
}

function cqSummary(c){
  var parts=[];
  if(c.nome)parts.push(c.nome);
  if(c.bairro)parts.push(c.bairro);
  if(c.valor)parts.push('R$ '+fmtValor(parseValor(c.valor)));
  return parts.length?parts.join(' · '):'Clique para preencher';
}

function renderAgents(){
  document.getElementById('agents-wrap').innerHTML=AGENTS.map(agentHTML).join('');
  bindEvents();
}

function rerenderAgent(id){
  var el=document.querySelector('[data-agent="'+id+'"]');
  if(!el)return;
  var wasOpen=el.classList.contains('open');
  var histOpen=el.querySelector('.hist-toggle')&&el.querySelector('.hist-toggle').classList.contains('hist-open');
  var a=AGENTS.filter(function(x){return x.id===id})[0];
  var tmp=document.createElement('div');
  tmp.innerHTML=agentHTML(a);
  var card=tmp.firstElementChild;
  if(wasOpen)card.classList.add('open');
  if(histOpen){
    var ht=card.querySelector('.hist-toggle');
    var hl=card.querySelector('.hist-list');
    if(ht)ht.classList.add('hist-open');
    if(hl)hl.style.display='block';
  }
  el.replaceWith(card);
  bindEvents();
}

// ── SYNC DRAFT ──
function syncDraft(id){
  var d=getDraft(id);
  var len=d.cqs.length;
  for(var i=0;i<len;i++){
    if(!d.cqs[i])d.cqs[i]={nome:'',tel:'',bairro:'',tipologia:'',valor:''};
    var nome=document.querySelector('.cq-nome[data-id="'+id+'"][data-i="'+i+'"]');
    var tel=document.querySelector('.cq-tel[data-id="'+id+'"][data-i="'+i+'"]');
    var valor=document.querySelector('.cq-valor[data-id="'+id+'"][data-i="'+i+'"]');
    if(nome)d.cqs[i].nome=nome.value;
    if(tel)d.cqs[i].tel=tel.value;
    if(valor)d.cqs[i].valor=parseValor(valor.value).toString();
  }
}

// ── BIND EVENTS ──
function bindEvents(){
  // toggle card
  document.querySelectorAll('.pt-agent-head').forEach(function(h){
    h.addEventListener('click',function(){h.closest('.pt-agent').classList.toggle('open')});
  });

  // data do lançamento
  document.querySelectorAll('.lancamento-date-inp').forEach(function(inp){
    inp.addEventListener('change',function(){
      var id=inp.dataset.id;
      getDraft(id).date=inp.value;
      // atualiza botão salvar
      var btn=document.querySelector('.btn-salvar-lancamento[data-id="'+id+'"]');
      if(btn)btn.textContent='✓ Salvar lançamento de '+fmtDateShort(inp.value);
    });
  });

  // cq acordeão toggle
  document.querySelectorAll('.cq-head').forEach(function(h){
    h.addEventListener('click',function(e){
      e.stopPropagation();
      h.closest('.cq-item').classList.toggle('cq-open');
    });
  });

  // stepper +
  document.querySelectorAll('.sp').forEach(function(b){
    b.addEventListener('click',function(e){
      e.stopPropagation();var id=b.dataset.id;syncDraft(id);
      getDraft(id).cqs.push({nome:'',tel:'',bairro:'',tipologia:'',valor:''});rerenderAgent(id);
    });
  });
  // stepper -
  document.querySelectorAll('.sm').forEach(function(b){
    b.addEventListener('click',function(e){
      e.stopPropagation();var id=b.dataset.id;syncDraft(id);
      var d=getDraft(id);if(d.cqs.length)d.cqs.pop();rerenderAgent(id);
    });
  });

  // inputs texto
  document.querySelectorAll('.cq-nome,.cq-tel').forEach(function(inp){
    inp.addEventListener('input',function(){
      var id=inp.dataset.id,i=+inp.dataset.i,d=getDraft(id);
      if(!d.cqs[i])d.cqs[i]={nome:'',tel:'',bairro:'',tipologia:'',valor:''};
      if(inp.classList.contains('cq-nome')){
        d.cqs[i].nome=inp.value;
        var sumEl=document.querySelector('.cq-head[data-id="'+id+'"][data-i="'+i+'"] .cq-summary');
        if(sumEl)sumEl.textContent=cqSummary(d.cqs[i]);
      } else d.cqs[i].tel=inp.value;
    });
  });

  // valor
  document.querySelectorAll('.cq-valor').forEach(function(inp){
    inp.addEventListener('input',function(){
      var id=inp.dataset.id,i=+inp.dataset.i;
      var raw=inp.value.replace(/\D/g,'');
      inp.value=raw?fmtValor(parseInt(raw,10)):'';
      var d=getDraft(id);if(!d.cqs[i])d.cqs[i]={nome:'',tel:'',bairro:'',tipologia:'',valor:''};
      d.cqs[i].valor=raw;
    });
  });

  // bairro chip
  document.querySelectorAll('.bairro-chip').forEach(function(chip){
    chip.addEventListener('click',function(e){
      e.stopPropagation();
      var id=chip.dataset.id,i=+chip.dataset.i,b=chip.dataset.b;
      syncDraft(id);var d=getDraft(id);
      if(!d.cqs[i])d.cqs[i]={nome:'',tel:'',bairro:'',tipologia:'',valor:''};
      d.cqs[i].bairro=(d.cqs[i].bairro===b?'':b);
      chip.closest('.cq-item').querySelectorAll('.bairro-chip').forEach(function(c){c.classList.toggle('sel',c.dataset.b===d.cqs[i].bairro)});
    });
  });

  // bairro add
  document.querySelectorAll('.btn-bairro-add').forEach(function(btn){
    btn.addEventListener('click',function(e){
      e.stopPropagation();var id=btn.dataset.id,i=+btn.dataset.i;
      var inp=btn.previousElementSibling,v=(inp?inp.value.trim():'');if(!v)return;
      if(allBairros().indexOf(v)<0){extraBairros.push(v);saveExtraBairros()}
      syncDraft(id);var d=getDraft(id);
      if(!d.cqs[i])d.cqs[i]={nome:'',tel:'',bairro:'',tipologia:'',valor:''};
      d.cqs[i].bairro=v;rerenderAgent(id);
    });
  });

  // tipologia
  document.querySelectorAll('.tipo-btn').forEach(function(btn){
    btn.addEventListener('click',function(e){
      e.stopPropagation();var id=btn.dataset.id,i=+btn.dataset.i,t=btn.dataset.t;
      syncDraft(id);var d=getDraft(id);
      if(!d.cqs[i])d.cqs[i]={nome:'',tel:'',bairro:'',tipologia:'',valor:''};
      d.cqs[i].tipologia=(d.cqs[i].tipologia===t?'':t);
      btn.closest('.tipo-group').querySelectorAll('.tipo-btn').forEach(function(b){b.classList.toggle('sel',b.dataset.t===d.cqs[i].tipologia)});
    });
  });



  // salvar lançamento
  document.querySelectorAll('.btn-salvar-lancamento').forEach(function(btn){
    btn.addEventListener('click',function(e){
      e.stopPropagation();var id=btn.dataset.id;syncDraft(id);
      var d=getDraft(id);
      upsertEntry(id,{date:d.date,cqs:JSON.parse(JSON.stringify(d.cqs))});
      draft[id]={date:today,cqs:[]};
      rerenderAgent(id);
      refreshAnalytics();
      toast('✓ Lançamento salvo — '+fmtDateShort(d.date));
    });
  });

  // histórico toggle
  document.querySelectorAll('.hist-toggle').forEach(function(h){
    h.addEventListener('click',function(e){
      e.stopPropagation();
      h.classList.toggle('hist-open');
      var list=document.querySelector('.hist-list[data-id="'+h.dataset.id+'"]');
      if(list)list.style.display=h.classList.contains('hist-open')?'block':'none';
    });
  });
}

function applyRange(){
  var f=document.getElementById('range-from').value,t=document.getElementById('range-to').value;
  if(!f||!t)return;if(f>t)return;
  rangeFrom=f;rangeTo=t;
  document.getElementById('range-from').classList.add('on');document.getElementById('range-to').classList.add('on');
  document.getElementById('btn-range-clear').style.display='';
  var hint=document.getElementById('range-hint');
  hint.textContent=fmtDateShort(f)+' → '+fmtDateShort(t);hint.style.display='';
  document.querySelectorAll('.period-tab').forEach(function(t){t.classList.remove('active')});
  refreshAnalytics();
}
document.getElementById('range-from').addEventListener('change',applyRange);
document.getElementById('range-to').addEventListener('change',applyRange);
document.getElementById('btn-range-clear').addEventListener('click',function(){
  rangeFrom='';rangeTo='';
  document.getElementById('range-from').value='';document.getElementById('range-to').value='';
  document.getElementById('range-from').classList.remove('on');document.getElementById('range-to').classList.remove('on');
  document.getElementById('btn-range-clear').style.display='none';
  document.getElementById('range-hint').style.display='none';
  document.querySelectorAll('.period-tab').forEach(function(t){t.classList.remove('active')});
  document.querySelector('.period-tab[data-p="week"]').classList.add('active');
  curPeriod='week';refreshAnalytics();
});
