<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nickel CRM · Gestão</title>
<link rel="stylesheet" href="style.css">
<style>
/* LAYOUT DESKTOP */
.pt-main{max-width:1100px;margin:0 auto;padding:28px 28px 60px}

/* TOPO: data + stats */
.pt-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;gap:16px;flex-wrap:wrap}
.pt-date-block{display:flex;align-items:center;gap:10px}
.pt-date-label{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em}
.pt-date-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;padding:9px 16px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:border-color .2s}
.pt-date-btn:hover{border-color:var(--gold)}

.pt-stats{display:flex;gap:1px;background:var(--border);border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.pt-stat{background:var(--bg2);padding:14px 24px;min-width:110px;text-align:center}
.pt-stat-num{font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;margin-bottom:4px}
.pt-stat-num.blue{color:#6495ed}
.pt-stat-num.green{color:var(--gold)}
.pt-stat-lbl{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;font-weight:500}

/* GRID DE AGENTES — 2 colunas */
.pt-agents{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* CARD DO AGENTE */
.pt-agent{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden}

.pt-agent-head{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;user-select:none;transition:background .15s}
.pt-agent-head:hover{background:var(--bg3)}

.pt-av{width:40px;height:40px;flex-shrink:0;background:var(--bg3);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--gold)}
.pt-agent-name{font-size:15px;font-weight:600;flex:1}
.pt-badges{display:flex;gap:6px}
.pt-badge{font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px}
.pt-badge.cq{background:rgba(100,149,237,.12);color:#6495ed}
.pt-badge.doc{background:rgba(168,230,61,.12);color:var(--gold)}
.pt-badge.zero{background:rgba(255,255,255,.05);color:var(--text-muted)}
.pt-chev{font-size:11px;color:var(--text-muted);transition:transform .2s;flex-shrink:0;margin-left:4px}
.pt-agent.open>.pt-agent-head .pt-chev{transform:rotate(180deg)}

.pt-agent-body{display:none;border-top:1px solid var(--border)}
.pt-agent.open>.pt-agent-body{display:block}

/* SEÇÕES DENTRO DO CARD */
.pt-sec{padding:18px 18px 14px}
.pt-sec+.pt-sec{border-top:1px solid var(--border)}
.pt-sec-title{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px}

/* STEPPER */
.pt-stepper-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.pt-stepper-lbl{font-size:14px;font-weight:500}
.vid-stepper{display:flex;align-items:center;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.vid-step-btn{background:var(--bg2);border:none;color:var(--text);font-size:18px;font-weight:700;width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.vid-step-btn:hover{background:var(--border)}
.vid-step-val{min-width:40px;text-align:center;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;color:#6495ed;background:var(--bg3);padding:0 4px;line-height:38px}

/* FORMULÁRIOS CQ */
.cpd-details-wrap{display:flex;flex-direction:column;gap:8px}
.cpd-detail-item{display:flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.cpd-detail-label{font-size:11px;font-weight:700;color:#6495ed;width:44px;flex-shrink:0}
.cpd-detail-item input{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:7px 10px;outline:none;transition:border-color .2s}
.cpd-detail-item input:focus{border-color:#6495ed}
.cpd-detail-item input::placeholder{color:var(--text-muted)}

/* DOC CHIPS */
.pt-doc-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.pt-doc-chip{display:flex;align-items:center;gap:6px;background:rgba(168,230,61,.08);border:1px solid rgba(168,230,61,.2);border-radius:7px;padding:5px 12px}
.pt-doc-code{font-size:13px;font-weight:700;color:var(--gold)}
.pt-doc-rm{background:none;border:none;color:rgba(168,230,61,.4);font-size:16px;cursor:pointer;padding:0 0 0 2px;line-height:1;transition:color .15s}
.pt-doc-rm:hover{color:var(--red)}

.pt-add-doc{display:flex;gap:8px}
.pt-add-doc input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 12px;outline:none;transition:border-color .2s}
.pt-add-doc input:focus{border-color:var(--gold)}
.pt-add-doc input::placeholder{color:var(--text-muted)}
.pt-btn-doc{background:var(--gold);border:none;color:#000;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;padding:9px 18px;border-radius:8px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background .2s}
.pt-btn-doc:hover{background:#96ce35}

/* BOTÃO SALVAR */
.pt-save-bar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border);padding:14px 28px;margin-top:28px}
.pt-save-inner{max-width:1100px;margin:0 auto}
.pt-btn-save{background:var(--gold);border:none;color:#000;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;padding:13px 48px;border-radius:10px;cursor:pointer;transition:background .2s,transform .1s;letter-spacing:.3px}
.pt-btn-save:hover{background:#96ce35}
.pt-btn-save:active{transform:scale(.98)}

/* TOAST */
#pt-toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 22px;font-size:13px;color:var(--text);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:999}

input[type=date].hid{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
</style>
</head>
<body>

<header class="app-header">
  <span class="logo">NICKEL CRM</span>
  <span class="user-info">Painel de Gestão</span>
</header>

<div class="pt-main">

  <!-- TOPO -->
  <div class="pt-topbar">
    <div class="pt-date-block">
      <span class="pt-date-label">Data</span>
      <button class="pt-date-btn" id="date-btn">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="2.5" width="12" height="10.5" rx="2" stroke="#6b8299" stroke-width="1.2"/><path d="M5 1v3M9 1v3M1 6.5h12" stroke="#6b8299" stroke-width="1.2" stroke-linecap="round"/></svg>
        <span id="date-lbl"></span>
      </button>
      <input type="date" class="hid" id="date-inp">
    </div>

    <div class="pt-stats">
      <div class="pt-stat"><div class="pt-stat-num blue" id="s-cq-d">0</div><div class="pt-stat-lbl">CQs hoje</div></div>
      <div class="pt-stat"><div class="pt-stat-num green" id="s-doc-d">0</div><div class="pt-stat-lbl">DOCs hoje</div></div>
      <div class="pt-stat"><div class="pt-stat-num blue" id="s-cq-w">0</div><div class="pt-stat-lbl">CQs semana</div></div>
      <div class="pt-stat"><div class="pt-stat-num green" id="s-doc-w">0</div><div class="pt-stat-lbl">DOCs semana</div></div>
    </div>
  </div>

  <!-- GRADE DE AGENTES -->
  <div class="pt-agents" id="agents-wrap"></div>

</div>

<!-- BARRA DE SALVAR -->
<div class="pt-save-bar">
  <div class="pt-save-inner">
    <button class="pt-btn-save" id="btn-save">✓ Salvar dia</button>
  </div>
</div>

<div id="pt-toast"></div>

<script>
var AGENTS=[
  {id:'silvana', name:'Silvana Costa'},
  {id:'anne',    name:'Anne Ludwig'},
  {id:'flora',   name:'Flora'},
  {id:'jo',      name:'Jo Casas Imóveis'},
  {id:'renan',   name:'Renan Lemos'},
  {id:'sanny',   name:'Sanny Martins'},
  {id:'thiago',  name:'Thiago Araujo'},
  {id:'karoline',name:'Karoline Tyszka'},
];
var MONTHS=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
var today=new Date().toISOString().slice(0,10);
var curDate=today;
var state={};

function stKey(d){return'tgp_'+d}
function loadDay(d){try{return JSON.parse(localStorage.getItem(stKey(d))||'null')||{}}catch{return{}}}
function saveDay(d,s){try{localStorage.setItem(stKey(d),JSON.stringify(s))}catch{}}
function ini(n){return n.split(' ').slice(0,2).map(function(w){return w[0]||''}).join('').toUpperCase()}
function daysAgo(n){var d=new Date(today);d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)}
function fmtDate(d){var p=d.split('-');return(+p[2])+' de '+MONTHS[+p[1]-1]+' de '+p[0]}
function ensure(id){if(!state[id])state[id]={cqs:[],docs:[]}}
function totals(s){var c=0,doc=0;AGENTS.forEach(function(a){c+=(s[a.id]&&s[a.id].cqs?s[a.id].cqs.length:0);doc+=(s[a.id]&&s[a.id].docs?s[a.id].docs.length:0)});return{c:c,d:doc}}
function dayTotals(d){return totals(d===curDate?state:loadDay(d))}

function refreshTiles(){
  var t=dayTotals(curDate);
  document.getElementById('s-cq-d').textContent=t.c;
  document.getElementById('s-doc-d').textContent=t.d;
  var wc=t.c,wd=t.d;
  for(var i=1;i<7;i++){var x=dayTotals(daysAgo(i));wc+=x.c;wd+=x.d}
  document.getElementById('s-cq-w').textContent=wc;
  document.getElementById('s-doc-w').textContent=wd;
}

function cqFormsHTML(id){
  var cqs=state[id]&&state[id].cqs||[];
  if(!cqs.length)return'';
  var h='<div class="cpd-details-wrap" style="margin-top:0">';
  for(var i=0;i<cqs.length;i++){
    var c=cqs[i];
    h+='<div class="cpd-detail-item"><span class="cpd-detail-label">CQ '+(i+1)+'</span>';
    h+='<input class="cq-nome" data-id="'+id+'" data-i="'+i+'" type="text" placeholder="Nome do proprietário" value="'+(c.nome||'').replace(/"/g,'&quot;')+'">';
    h+='<input class="cq-tel" data-id="'+id+'" data-i="'+i+'" type="tel" placeholder="Telefone" value="'+(c.tel||'').replace(/"/g,'&quot;')+'"></div>';
  }
  return h+'</div>';
}

function docChipsHTML(id){
  var docs=state[id]&&state[id].docs||[];
  if(!docs.length)return'';
  var h='<div class="pt-doc-chips">';
  for(var i=0;i<docs.length;i++){
    h+='<div class="pt-doc-chip"><span class="pt-doc-code">'+docs[i].codigo+'</span>';
    h+='<button class="pt-doc-rm" data-id="'+id+'" data-i="'+i+'">×</button></div>';
  }
  return h+'</div>';
}

function agentHTML(a){
  ensure(a.id);
  var cqs=state[a.id].cqs,docs=state[a.id].docs;
  return '<div class="pt-agent" data-agent="'+a.id+'">'
    +'<div class="pt-agent-head">'
    +'<div class="pt-av">'+ini(a.name)+'</div>'
    +'<div class="pt-agent-name">'+a.name+'</div>'
    +'<div class="pt-badges">'
    +'<span class="pt-badge '+(cqs.length?'cq':'zero')+'">'+cqs.length+' CQ</span>'
    +'<span class="pt-badge '+(docs.length?'doc':'zero')+'">'+docs.length+' DOC</span>'
    +'</div><span class="pt-chev">▼</span></div>'
    +'<div class="pt-agent-body">'
    +'<div class="pt-sec">'
    +'<div class="pt-sec-title">Conversas Qualificadas</div>'
    +'<div class="pt-stepper-row"><span class="pt-stepper-lbl">CQs do dia</span>'
    +'<div class="vid-stepper">'
    +'<button class="vid-step-btn sm" data-id="'+a.id+'">−</button>'
    +'<div class="vid-step-val sv" data-id="'+a.id+'">'+cqs.length+'</div>'
    +'<button class="vid-step-btn sp" data-id="'+a.id+'">+</button>'
    +'</div></div>'
    +'<div class="cq-forms-wrap" data-id="'+a.id+'">'+cqFormsHTML(a.id)+'</div>'
    +'</div>'
    +'<div class="pt-sec">'
    +'<div class="pt-sec-title">DOCs</div>'
    +'<div class="doc-chips-slot" data-id="'+a.id+'">'+docChipsHTML(a.id)+'</div>'
    +'<div class="pt-add-doc">'
    +'<input class="doc-inp" data-id="'+a.id+'" placeholder="Código do DOC" maxlength="30">'
    +'<button class="pt-btn-doc" data-id="'+a.id+'">+ Adicionar</button>'
    +'</div></div>'
    +'</div></div>';
}

function renderAgents(){
  document.getElementById('agents-wrap').innerHTML=AGENTS.map(agentHTML).join('');
  bindEvents();
}

function rerender(id,keepOpen){
  var el=document.querySelector('[data-agent="'+id+'"]');
  if(!el)return;
  var a=AGENTS.filter(function(x){return x.id===id})[0];
  var tmp=document.createElement('div');
  tmp.innerHTML=agentHTML(a);
  var card=tmp.firstElementChild;
  if(keepOpen)card.classList.add('open');
  el.replaceWith(card);
  bindEvents();refreshTiles();
}

function syncCqInputs(id){
  document.querySelectorAll('.cq-nome[data-id="'+id+'"]').forEach(function(inp){
    var i=+inp.dataset.i;ensure(id);
    if(!state[id].cqs[i])state[id].cqs[i]={nome:'',tel:''};
    state[id].cqs[i].nome=inp.value;
  });
  document.querySelectorAll('.cq-tel[data-id="'+id+'"]').forEach(function(inp){
    var i=+inp.dataset.i;ensure(id);
    if(!state[id].cqs[i])state[id].cqs[i]={nome:'',tel:''};
    state[id].cqs[i].tel=inp.value;
  });
}

function bindEvents(){
  document.querySelectorAll('.pt-agent-head').forEach(function(h){
    h.addEventListener('click',function(){h.closest('.pt-agent').classList.toggle('open')});
  });
  document.querySelectorAll('.sp').forEach(function(b){
    b.addEventListener('click',function(e){
      e.stopPropagation();var id=b.dataset.id;syncCqInputs(id);ensure(id);
      state[id].cqs.push({nome:'',tel:''});rerender(id,true);
    });
  });
  document.querySelectorAll('.sm').forEach(function(b){
    b.addEventListener('click',function(e){
      e.stopPropagation();var id=b.dataset.id;syncCqInputs(id);ensure(id);
      if(state[id].cqs.length)state[id].cqs.pop();rerender(id,true);
    });
  });
  document.querySelectorAll('.cq-nome,.cq-tel').forEach(function(inp){
    inp.addEventListener('input',function(){
      var id=inp.dataset.id,i=+inp.dataset.i;ensure(id);
      if(!state[id].cqs[i])state[id].cqs[i]={nome:'',tel:''};
      if(inp.classList.contains('cq-nome'))state[id].cqs[i].nome=inp.value;
      else state[id].cqs[i].tel=inp.value;
    });
  });
  document.querySelectorAll('.pt-btn-doc').forEach(function(b){
    b.addEventListener('click',function(e){
      e.stopPropagation();var id=b.dataset.id;
      var inp=document.querySelector('.doc-inp[data-id="'+id+'"]');
      var v=(inp?inp.value:'').trim();if(!v){if(inp)inp.focus();return;}
      ensure(id);state[id].docs.push({codigo:v});inp.value='';rerender(id,true);
    });
  });
  document.querySelectorAll('.doc-inp').forEach(function(inp){
    inp.addEventListener('keydown',function(e){
      if(e.key==='Enter'){var b=document.querySelector('.pt-btn-doc[data-id="'+inp.dataset.id+'"]');if(b)b.click()}
    });
  });
  document.querySelectorAll('.pt-doc-rm').forEach(function(b){
    b.addEventListener('click',function(e){
      e.stopPropagation();var id=b.dataset.id,i=+b.dataset.i;
      ensure(id);state[id].docs.splice(i,1);rerender(id,true);
    });
  });
}

function setDate(d){
  curDate=d;
  document.getElementById('date-lbl').textContent=fmtDate(d);
  document.getElementById('date-inp').value=d;
  state=loadDay(d);
  renderAgents();refreshTiles();
}

document.getElementById('date-btn').addEventListener('click',function(){
  var inp=document.getElementById('date-inp');
  try{inp.showPicker()}catch(e){inp.click()}
});
document.getElementById('date-inp').addEventListener('change',function(e){if(e.target.value)setDate(e.target.value)});

document.getElementById('btn-save').addEventListener('click',function(){
  AGENTS.forEach(function(a){syncCqInputs(a.id)});
  saveDay(curDate,state);
  refreshTiles();
  var t=document.getElementById('pt-toast');
  t.textContent='✓ Dia salvo com sucesso';t.style.opacity='1';
  setTimeout(function(){t.style.opacity='0'},2200);
});

setDate(today);
</script>
</body>
</html>
